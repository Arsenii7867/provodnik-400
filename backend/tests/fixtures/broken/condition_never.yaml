# ожидаемая ошибка: condition_never_shown
# условие по флагу, который никто не выставляет
id: condition_never
version: 1
title: Проверочный сценарий
summary: Короткий сценарий, на котором проверяется сам валидатор.
source_situations: [19, 28]
difficulty: 1
critical: false
tags: [проверка]
competencies: [medical]
role_model: false
estimated_minutes: 1
context:
  service_class: standard
  segment: перегон
  next_station_minutes: 5
  time_of_day: день
  passenger: {label: пассажир на месте 1А, state: жалуется на боль в груди}
  crew_available: [chief]
start: {node: intro, loyalty: 50, safety: 50, flags: {}}
nodes:
  intro:
    type: dialog
    text: Пассажиру на месте 1А плохо, он держится за грудь.
    passenger_says: Мне нехорошо, давит в груди.
    timer:
      seconds: 20
      on_expire:
        next: too_late
        effects: {loyalty: -20, safety: -20}
        debrief:
          why: Промедление при боли в груди опасно, каждая минута без помощи повышает риск для жизни пассажира.
          better: Сразу вызвать начальника поезда по радиосвязи и остаться рядом с пассажиром.
          refs: [sit_19]
    options:
      - id: call_chief
        text: Вызываю начальника поезда по радиосвязи и остаюсь рядом.
        effects: {loyalty: 10, safety: 20}
        competencies: {medical: 2}
        next: ending_good
        debrief:
          verdict: best
          why: Реакция карточки 19, начальник поезда вызван любым доступным способом, проводник остался рядом.
          refs: [sit_19]
      - id: give_pills
        text: Даю пассажиру своё лекарство.
        effects: {loyalty: 10, safety: -30}
        competencies: {medical: -3}
        next: ending_bad
        debrief:
          verdict: bad
          why: Личные лекарства выдавать нельзя, реакция пассажира на препарат неизвестна и отвечать будет проводник.
          better: Действовать через начальника поезда и медиков на ближайшей станции.
          refs: [sit_28]
      - id: wait
        text: Жду, что пассажиру станет лучше само.
        effects: {safety: -10}
        next: ending_bad
        debrief:
          verdict: bad
          why: Время уходит впустую, а при боли в груди помощь нужно организовать сразу через начальника поезда.
          better: Вызвать начальника поезда по радиосвязи и организовать помощь.
          refs: [sit_19]
      - id: talk
        text: Успокаиваю пассажира разговором.
        when: {flags_all: {chief_called: true}}
        effects: {loyalty: 5}
        next: ending_good
        debrief:
          verdict: ok
          why: Контакт с пассажиром есть, но помощь не организована и начальник поезда не вызван.
          better: Успокоить пассажира и сразу вызвать начальника поезда по радиосвязи.
          refs: [sit_19]
  too_late:
    type: event
    text: Пассажиру стало хуже.
    next: ending_bad
  ending_good:
    type: ending
    title: Помощь организована
    text: Начальник поезда организовал помощь.
    debrief:
      summary: Вызов сделан вовремя, помощь организована через начальника поезда и медиков на станции.
      refs: [sit_19]
  ending_bad:
    type: ending
    title: Инцидент
    text: Пассажир пострадал.
    forced_outcome: incident
    debrief:
      summary: Помощь не организована вовремя, пассажир пострадал, разбор случая у начальника поезда.
      refs: [sit_28]
