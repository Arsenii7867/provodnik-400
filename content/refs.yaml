# Справочник ссылок для разбора. Ключи sit_N это карточки «Примеры ситуаций взаимодействия
# поездного персонала с пассажирами» (phrase: рекомендованная реплика, rule: реакция по
# карточке), ключи sto_* это пункты стандартов СТО РЖД 03.011-2026, 03.013-2026 и 03.014-2026
# с дословной цитатой. Нумерация пунктов восстановлена по оглавлению текстовой версии
# стандартов (reconstructed: true), поэтому разбор показывает и номер, и текст нормы.
# Тире в цитатах заменены запятой, двоеточием или дефисом, остальной текст сохранён.

sit_3:
  kind: situation
  number: 3
  title: Пассажир опоздал на поезд
  phrase: >-
    «Понимаю Ваше волнение. Поезд уже отправился по расписанию, пожалуйста, обратитесь в кассу
    или информационную стойку, Вам подскажут ближайший рейс и порядок возврата/переоформления».
  rule: >-
    Не задерживать поезд и не открывать двери после закрытия. Направить в кассу/к дежурному/в
    приложение для возврата или переоформления, если возможно по тарифу.
sit_14:
  kind: situation
  number: 14
  title: Ручная кладь мешает проходу
  phrase: >-
    «В целях безопасности проход должен оставаться свободным. Позвольте, я помогу разместить
    вещи» «Обращаю Ваше внимание на то, что в конце вагона есть специализированное место для
    размещения багажа, прошу Вас переставить вещи, благодарю за понимание!»
  rule: >-
    Найти владельца ручной клади путем опроса пассажиров и описания оставленного. Вежливо
    попросить переставить делая акцент на безопасности.
sit_17:
  kind: situation
  number: 17
  title: Пассажир потерял вещь
  phrase: «Давайте зафиксируем описание вещи, я сразу передам информацию начальнику поезда»
  rule: >-
    Уточнить описание, место, время. Организовать поиск, сообщить начальнику поезда. Начальник
    поезда может сделать объявление по громкой связи.
sit_19:
  kind: situation
  number: 19
  title: Пассажиру стало плохо
  phrase: «Я рядом, сейчас приглашу начальника поезда и организуем помощь».
  rule: >-
    Вызвать начальника поезда любым доступным способом, оказать помощь в рамках компетенции,
    спросить о медиках среди пассажиров.
sit_20:
  kind: situation
  number: 20
  title: Пассажир курит на борту (включая электронные сигареты)
  phrase: >-
    «Прошу Вас прекратить курение. В поезде это не допускается». «Вынужден(а) пригласить
    начальника поезда»
  rule: >-
    Вежливо прекратить нарушение, при отказе начальник поезда/ПТБ. Обязательно сделать акцент на
    угрозу безопасности движения.
sit_21:
  kind: situation
  number: 21
  title: Пассажир употребляет алкоголь
  phrase: «Обращаю Ваше внимание, употребление алкогольных напитков допускается только в вагоне-бистро»
  rule: Напомнить правила проезда, при нарушении порядка пригласить начальника поезда, сотрудников ПТБ.
sit_28:
  kind: situation
  number: 28
  title: Пассажир просит предоставить лекарство
  phrase: «Сожалею, но на борту отсутствуют медикаменты». «Позвольте предложить для Вас воду/чай/кофе»
  rule: Не выдавать личные лекарства, действовать через аптечку/начальника поезда/медиков.
sit_35:
  kind: situation
  number: 35
  title: Пассажир просит открыть окно
  phrase: «Окна в поезде не открываются, но я передам просьбу по температуре»
  rule: >-
    Объяснить техническую невозможность/безопасность, предложить регулировку климата. На станции
    стоянка одна минута: отпускать подышать только с предупреждением об этом.
sit_41:
  kind: situation
  number: 41
  title: Пассажир сообщает о бесхозной вещи
  phrase: >-
    «Уважаемые пассажиры, просьба не приближаться к предмету. Мы сейчас уточним принадлежность
    вещи» «Благодарю за бдительность, сейчас я уточню, кому принадлежит оставленная вещь»
  rule: Не трогать вещь, сообщить начальнику поезда, сотрудникам ПТБ по поездной радиосвязи.

sto_011_4_6:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 4.6
  title: Готовность к посадке за одну минуту
  quote: >-
    Готовность высокоскоростного пассажирского поезда к посадке должна быть обеспечена в течение
    одной минуты с момента объявления посадки на поезд. Готовность к посадке означает: поезд
    подготовлен к посадке пассажиров в соответствии с классами обслуживания; поезд полностью
    остановлен; предназначенные для посадки/высадки пассажиров входные двери механически и
    электрически разблокированы; работники, задействованные в контроле наличия у пассажиров
    действительных проездных документов, и в обслуживании пассажиров при посадке, находятся на
    своих рабочих местах.
  reconstructed: true
sto_011_5_3:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 5.3
  title: Четыре класса обслуживания
  quote: >-
    На высокоскоростных железнодорожных линиях рекомендуется предусматривать четыре класса
    обслуживания в пути следования: стандарт (дополнительные услуги предоставляются за отдельную
    плату); комфорт (часть дополнительных услуг включена в стоимость проездного документа); бизнес
    (расширенный перечень дополнительных услуг, включенных в стоимость проездного документа);
    первый (персональный подход к обслуживанию пассажиров с предоставлением расширенного перечня
    дополнительных услуг, включенных в стоимость проездного документа, в изолированном от других
    классов обслуживания пространстве).
  reconstructed: true
sto_011_7_1_4:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.1.4
  title: Услуги маломобильным по классу билета
  quote: >-
    Маломобильным пассажирам должна быть предоставлена возможность воспользоваться услугами в
    соответствии с классом обслуживания, указанным в проездном документе. Способы обеспечения
    доступности услуг для маломобильных пассажиров приведены в СТО РЖД 03.014.
  reconstructed: true
sto_011_7_4_13:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.4.13
  title: Бистро доступно в любое время
  quote: >-
    Услуги питания в вагоне-бистро должны быть доступны пассажирам в любое время следования
    высокоскоростного пассажирского поезда по маршруту между начальной и конечной станциями
    высокоскоростной железнодорожной линии.
  reconstructed: true
sto_011_10_1:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.1
  title: Форма, бейдж, инструкция, этика
  quote: >-
    Персонал, осуществляющий обслуживание пассажиров в пути следования и на вокзальных комплекса
    высокоскоростных железнодорожных линий, должен: носить форменную одежду и именной бейдж;
    выполнять требования своей должностной инструкции; соблюдать нормы и правила этики поведения.
  reconstructed: true
sto_011_10_3:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.3
  title: Ответ на любую просьбу, при отказе извиниться и объяснить
  quote: >-
    На вокзальном комплексе и в высокоскоростном поезде пассажир должен иметь возможность
    обратиться в любой момент к работнику с вопросом и(или) просьбой об услуге и получить ответ
    или услугу. При невозможности выполнить просьбу или оказать услугу работник должен извиниться
    и объяснить причину отказа.
  reconstructed: true
sto_011_10_4:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.4
  title: Неотложные просьбы в приоритетном порядке
  quote: >-
    Просьбы пассажиров, имеющие неотложный характер (например, оказание первой помощи), должны
    выполняться в приоритетном порядке.
  reconstructed: true
sto_011_10_5:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.5
  title: Нормативы ожидания обслуживания по классам
  quote: >-
    Численность персонала должна определяться с учетом допустимой продолжительности ожидания
    обслуживания пассажирами в штатной ситуации: класса обслуживания стандарт: не более 20 мин;
    класса обслуживания комфорт: не более 15 мин; класса обслуживания бизнес: не более 10 мин;
    первого класса обслуживания: не более 5 мин.
  reconstructed: true
sto_011_10_6:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.6
  title: Состав бригады, кто за что отвечает
  quote: >-
    При формировании поездной бригады высокоскоростного поезда необходимо предусматривать
    работников с различным функционалом: предоставление услуг пассажирам (по классам
    обслуживания); предоставление пассажирам услуг питания в вагоне-бистро; техническое
    обслуживание и сопровождение эксплуатации инженерно-технического оборудования
    высокоскоростного поезда; поддержание санитарно-гигиенического состояния внутри вагонов
    высокоскоростного поезда; обеспечение безопасности пассажиров и персонала; организация и
    руководство работой поездной бригады.
  reconstructed: true
sto_011_t1_equipment:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 1, строка «оборудование для использования услуг»
  title: Розетки, держатели и кнопка вызова по классам
  quote: >-
    стандарт: «разъемы для зарядки мобильных устройств (не менее одного на каждый кресельный
    блок)»; комфорт: «разъемы для зарядки мобильных устройств (не менее одного на каждый
    кресельный блок)»; бизнес: «разъемы для зарядки мобильных устройств (не менее одного на
    каждое пассажирское место); держатели для стаканов»; первый: «кнопка вызова персонала;
    разъемы для зарядки мобильных устройств (не менее двух на каждое пассажирское место);
    держатели для стаканов».
  reconstructed: false
sto_011_t2_entertainment:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 2, строка «Развлечения»
  title: Планшет по запросу
  quote: >-
    стандарт и комфорт: «-»; бизнес и первый: «предоставление в пользование планшета по запросу
    у персонала».
  reconstructed: false
sto_011_t2_storage:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 2, строка «Хранение личных вещей (ручной клади и багажа)»
  title: Места хранения ручной клади по классам
  quote: >-
    стандарт: «багажные полки; карманы в пассажирских креслах»; комфорт и бизнес: «багажные
    полки; отсеки со стеллажами для хранения багажа; карманы в пассажирских креслах»; первый:
    «закрытый багажный отсек или шкаф; отсеки и(или) крючки для размещения ручной клади (сумок,
    портфелей, рюкзаков и т.п.); сейф*» (звёздочка в таблице: «услуга носит рекомендательный
    характер»).
  reconstructed: false
sto_013_7_1_2:
  kind: standard
  document: СТО РЖД 03.013-2026
  clause: пункт 7.1.2
  title: Питьевая вода на всём пути, одноразовые стаканчики
  quote: >-
    Оборудование, используемое для подачи питьевой воды согласно таблице 1, должно обеспечивать
    доступ к данной услуге на всем пути следования с учетом продолжительности поездки, в том
    числе обеспечено наличие одноразовых стаканчиков.
  reconstructed: true
sto_014_6_1:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.1
  title: Доступность поезда, подъёмные устройства
  quote: >-
    Доступность высокоскоростного пассажирского поезда для маломобильных пассажиров должна быть
    обеспечена с соблюдением требований ГОСТ Р 51090 (в части обеспечения доступности и
    безопасности), ГОСТ 33190 (в части соблюдения технических требований для перевозки
    инвалидов), ГОСТ Р 51764 (в части технических требований к подъемным устройствам,
    предназначенным для обеспечения перемещения маломобильных пассажиров в вагон).
  reconstructed: true
sto_014_6_2:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.2
  title: Проезд маломобильных по классам обслуживания
  quote: >-
    Маломобильным пассажирам, в том числе инвалидам различных групп функционирования, должна
    быть обеспечена возможность проезда в вагонах различных классов обслуживания: на
    пассажирском месте: в вагонах классов обслуживания первый и бизнес для инвалидов всех групп
    функционирования; в кресле-коляске на специально выделенном месте для инвалидов с
    ограничениями мобильности, на пассажирском месте для инвалидов всех групп функционирования
    и для маломобильных пассажиров: в вагонах классов обслуживания стандарт и комфорт.
    Примечание: перевозка лежачих больных может быть осуществлена только на отдельных условиях.
  reconstructed: true
sto_014_6_3:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.3
  title: Место для сопровождающего и для сложенной коляски
  quote: >-
    В вагонах высокоскоростного пассажирского поезда, где предусмотрен проезд на пассажирском
    месте маломобильных пассажиров, передвигающихся с использованием кресла-коляски, должно быть
    предусмотрено место для сопровождающего его лица и место для размещения кресла-коляски в
    сложенном состоянии в пути следования.
  reconstructed: true
sto_014_6_4:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.4
  title: Одежда и кладь на выделенных местах
  quote: >-
    На специально выделенных местах для проезда маломобильных пассажиров, передвигающихся в
    креслах-колясках, должны быть предусмотрены доступные для них места для размещения верхней
    одежды и ручной клади.
  reconstructed: true
sto_014_6_5:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.5
  title: Кресло-коляска поезда во временное пользование
  quote: >-
    В высокоскоростных пассажирских поездах необходимо предусматривать не менее одного
    кресла-коляски для предоставления во временное пользование маломобильным пассажирам для
    обеспечения доступности услуг, предоставление которых на пассажирском месте невозможно
    организовать.
  reconstructed: true
sto_014_7_1:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 7.1
  title: Коммуникация на всех этапах
  quote: >-
    Коммуникация с маломобильными пассажирами и инвалидами всех групп функционирования должна
    быть обеспечена на всех этапах обслуживания на высокоскоростных железнодорожных линиях.
  reconstructed: true
sto_014_7_14:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 7.14
  title: Альтернативная коммуникация со слабослышащими в поезде
  quote: >-
    На территории вокзальных комплексов и в высокоскоростных пассажирских поездах в пути
    следования на высокоскоростных железнодорожных линиях маломобильным пассажирам из числа
    инвалидов с нарушением функции слуха должны быть доступны различные альтернативные способы
    коммуникации, в том числе с использованием коммуникативных устройств, смартфонов, планшетов
    и т.п.
  reconstructed: true
sto_014_8_1:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.1
  title: Помощь в получении услуг
  quote: >-
    На вокзальных комплексах и в пути следования на высокоскоростных железнодорожных линиях
    необходимо обеспечивать помощь в получении услуг маломобильными пассажирами.
  reconstructed: true
sto_014_8_2:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.2
  title: Помощь безвозмездно
  quote: >-
    Перечень категорий маломобильных пассажиров, включая инвалидов различных групп
    функционирования, которым помощь предоставляется на безвозмездной основе, определен
    федеральным законом [2] и может быть расширен организационно-правовыми или
    распорядительными документами.
  reconstructed: true
sto_014_8_7:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.7
  title: Персонал поезда помогает разместиться с вещами
  quote: >-
    Персонал высокоскоростного поезда оказывать помощь маломобильным пассажирам при размещении
    их в вагоне с личными вещами и багажом.
  reconstructed: true
sto_014_8_8:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.8
  title: Питание на место для маломобильных
  quote: >-
    Маломобильным пассажирам, испытывающим затруднения при самостоятельном передвижении, в пути
    следования должна быть доступна возможность заказа питания на пассажирское место.
  reconstructed: true
sto_014_8_9:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.9
  title: Навыки персонала при обслуживании маломобильных
  quote: >-
    Персонал, непосредственно задействованный в обслуживании маломобильных пассажиров на
    высокоскоростных железнодорожных линиях, должен обладать навыками (умениями): получения
    информации от маломобильных пассажиров или сопровождающих их лиц в процессе оказания услуг
    в объеме, необходимом для предупреждения опасных ситуаций; построения наилучшего маршрута
    следования для сопровождения маломобильных пассажиров с учетом их особенностей и групп
    функционирования инвалидов в соответствии со схемой доступных маршрутов передвижения на
    объекте; использования различных альтернативных способов коммуникации в темпе, наиболее
    приемлемом для получателя услуг с учетом особенностей маломобильных пассажиров и групп
    функционирования инвалидов, в том числе с использованием коммуникативных устройств,
    смартфонов, планшетов, средств альтернативной коммуникации; анализа окружающей информации,
    получаемой посредством наблюдения, и предоставления необходимой информации маломобильным
    пассажирам о внешней обстановке на объекте и имеющихся барьерах, препятствиях; оказания
    помощи в использовании технического оборудования, находящегося на объекте, и
    вспомогательных средств с учетом особенностей маломобильных пассажиров и групп
    функционирования инвалидов; использования и безопасной эксплуатации имеющихся на объекте
    вспомогательных средств и технического оборудования; создания спокойной, комфортной,
    доброжелательной обстановки в процессе предоставления услуг сопровождения и оказания
    помощи.
  reconstructed: true
