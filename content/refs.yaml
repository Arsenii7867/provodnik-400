# Справочник ссылок для разбора. Ключи sit_N это карточки «Примеры ситуаций взаимодействия
# поездного персонала с пассажирами» (phrase: рекомендованная реплика, rule: реакция по
# карточке дословно, tip: совет из правой колонки карточки, если разбор на него опирается),
# ключи sto_* это пункты стандартов СТО РЖД 03.011-2026, 03.013-2026 и 03.014-2026 с дословной
# цитатой, ключ model_* это ролевая модель со второго слайда того же документа. Нумерация
# пунктов восстановлена по оглавлению текстовой версии стандартов (reconstructed: true),
# поэтому разбор показывает и номер, и текст нормы. Тире в цитатах заменены запятой,
# двоеточием или дефисом, остальной текст сохранён.

model_role_steps:
  kind: model
  document: Примеры ситуаций взаимодействия поездного персонала с пассажирами
  clause: слайд 2, основная ролевая модель
  title: Четыре шага разговора с пассажиром
  quote: >-
    Признать ситуацию: «Я Вас понимаю...», «Понимаю, что ситуация неприятная...», «Я сожалею, что
    это доставило Вам дискомфорт...». Обозначить правило: «Обращаю Ваше внимание, что...»,
    «Информирую Вас о том, что...», «Позвольте обратить Ваше внимание на то, что...». Предложить
    решение: «Я уточню и вернусь к Вам...», «Я приглашу начальника поезда...», «Для решения этого
    вопроса мне понадобится время...». Заверить: «Я благодарю Вас за понимание...», «Благодарю Вас
    за ожидание...», «Благодарю за обращение...».

sit_3:
  kind: situation
  number: 3
  title: Пассажир опоздал на поезд
  phrase: >-
    «Понимаю Ваше волнение. Поезд уже отправился по расписанию, пожалуйста, обратитесь в кассу
    или информационную стойку, Вам подскажут ближайший рейс и порядок возврата/переоформления».
  rule: >-
    Не задерживать поезд и не открывать двери после закрытия. Направить в кассу/к дежурному/в
    приложение для возврата или переоформления, если возможно по тарифу.
sit_6:
  kind: situation
  number: 6
  title: Пассажир с признаками алкогольного опьянения
  phrase: «Прошу Вас соблюдать спокойствие и не создавать неудобств другим пассажирам».
  rule: >-
    Оценить безопасность: агрессия, нарушение порядка, риск для себя/других. Сообщить начальнику
    поезда, ПТБ; при необходимости ЛОВД. Не вступать в спор.
  tip: >-
    В случае вызова начальника поезда по рации не говорить о том, что пассажир пьян, чтобы не
    провоцировать пассажира на агрессию.
sit_8:
  kind: situation
  number: 8
  title: Пассажир желает повысить класс обслуживания
  phrase: >-
    «Сейчас я уточню наличие свободных мест и возможность оформления повышения класса
    обслуживания». «До подтверждения пересадки прошу Вас оставаться на месте, указанном в билете,
    спасибо за понимание».
  rule: >-
    Проверить наличие мест и возможность доплаты через утвержденный канал (мобильная касса). До
    оформления попросить оставаться на своем месте, согласно купленному билету.
  tip: >-
    Уточнить стоимость доплаты и вид оплаты. Иметь возможность предоставить сдачу в случае оплаты
    наличными.
sit_9:
  kind: situation
  number: 9
  title: Пассажир хочет пересесть
  phrase: >-
    «Подскажите, пожалуйста, причину пересадки, я проверю, чем мы можем помочь». «Если место
    свободно и пересадка возможна по правилам, я Вас проинформирую».
  rule: >-
    Уточнить причину. Проверить свободные места в том же классе. При повышении класса только с
    оформлением доплаты. При конфликте/угрозе здоровью привлечь начальника поезда.
sit_13:
  kind: situation
  number: 13
  title: Пассажир не на своем месте
  phrase: >-
    «Добрый день! Позвольте уточнить, Вы пересели?» «Пожалуйста, позвольте Ваш билет.» «Давайте
    сверим номер вагона и места, я помогу Вам разобраться».
  rule: >-
    Выяснить причину, возможно, пассажир самостоятельно решил пересесть. Проверить билет, спокойно
    вернуть к своему месту или оформить пересадку при возможности.
sit_14:
  kind: situation
  number: 14
  title: Ручная кладь мешает проходу
  phrase: >-
    «В целях безопасности проход должен оставаться свободным. Позвольте, я помогу разместить
    вещи» «Обращаю Ваше внимание на то, что в конце вагона есть специализированное место для
    размещения багажа, прошу Вас переставить вещи, благодарю за понимание!»
  rule: >-
    Найти владельца ручной клади путем опроса пассажиров и описания оставленного. Вежливо
    попросить переставить делая акцент на безопасности.
sit_16:
  kind: situation
  number: 16
  title: Не работает розетка/мультимедиа/кнопка вызова
  phrase: >-
    «Спасибо, что сообщили. Сейчас проверим оборудование и предложим решение» «Прошу прощения за
    доставленные неудобства, могу я предложить Вам пересесть?»
  rule: >-
    Выслушать пассажира, принести извинения, предложить пересесть при возможности.
    Проинформировать начальника поезда и бортинженера
sit_17:
  kind: situation
  number: 17
  title: Пассажир потерял вещь
  phrase: «Давайте зафиксируем описание вещи, я сразу передам информацию начальнику поезда»
  rule: >-
    Уточнить описание, место, время. Организовать поиск, сообщить начальнику поезда. Начальник
    поезда может сделать объявление по громкой связи.
sit_19:
  kind: situation
  number: 19
  title: Пассажиру стало плохо
  phrase: «Я рядом, сейчас приглашу начальника поезда и организуем помощь».
  rule: >-
    Вызвать начальника поезда любым доступным способом, оказать помощь в рамках компетенции,
    спросить о медиках среди пассажиров.
sit_20:
  kind: situation
  number: 20
  title: Пассажир курит на борту (включая электронные сигареты)
  phrase: >-
    «Прошу Вас прекратить курение. В поезде это не допускается». «Вынужден(а) пригласить
    начальника поезда»
  rule: >-
    Вежливо прекратить нарушение, при отказе начальник поезда/ПТБ. Обязательно сделать акцент на
    угрозу безопасности движения.
sit_21:
  kind: situation
  number: 21
  title: Пассажир употребляет алкоголь
  phrase: «Обращаю Ваше внимание, употребление алкогольных напитков допускается только в вагоне-бистро»
  rule: Напомнить правила проезда, при нарушении порядка пригласить начальника поезда, сотрудников ПТБ.
sit_28:
  kind: situation
  number: 28
  title: Пассажир просит предоставить лекарство
  phrase: «Сожалею, но на борту отсутствуют медикаменты». «Позвольте предложить для Вас воду/чай/кофе»
  rule: Не выдавать личные лекарства, действовать через аптечку/начальника поезда/медиков.
sit_29:
  kind: situation
  number: 29
  title: У пассажира паническая атака/сильное волнение
  phrase: «Постарайтесь дышать спокойно. Я рядом, сейчас помогу Вам и принесу воды»
  rule: >-
    Общаться спокойно, не паниковать, посадить пассажира на кресло, предоставить воду, не оставлять
    без внимания.
  tip: >-
    Уточнить у пассажира бывало ли такое ранее. Уведомить начальника поезда. Дыхание «по
    квадрату». Отвлечь пассажира разговором, предоставить что-то для чтения, прослушивания или
    просмотра (журнал, планшет).
sit_30:
  kind: situation
  number: 30
  title: Ребенок потерялся
  phrase: >-
    «Не волнуйтесь, я помогу Вам найти родителей/сопровождающих. Побудьте, пожалуйста, рядом со
    мной»
  rule: Оставаться с ребенком, сообщить начальнику, сделать объявление без лишних персональных данных.
  tip: Сообщить информацию начальнику поезда. Проводить ребенка до купе начальника поезда.
sit_33:
  kind: situation
  number: 33
  title: Два пассажира на одно место
  phrase: «Я вижу, что ситуация требует уточнения. Сейчас я приглашу начальника поезда для уточнения».
  rule: Внимательно проверить проездные документы. Пригласить начальника поезда.
  tip: >-
    При наличии свободных мест пассажиру предложат пересесть, либо повысить класс обслуживания без
    взимания дополнительной платы.
sit_35:
  kind: situation
  number: 35
  title: Пассажир просит открыть окно
  phrase: «Окна в поезде не открываются, но я передам просьбу по температуре»
  rule: Объяснить техническую невозможность/безопасность, предложить регулировку климата.
  tip: >-
    Если пассажиру очень нужно «подышать», можно предложить под личную ответственность
    «подышать» на ближайшей станции, с условием не отходить далеко, так как стоянка 1 минута,
    или находясь в тамбуре
sit_41:
  kind: situation
  number: 41
  title: Пассажир сообщает о бесхозной вещи
  phrase: >-
    «Уважаемые пассажиры, просьба не приближаться к предмету. Мы сейчас уточним принадлежность
    вещи» «Благодарю за бдительность, сейчас я уточню, кому принадлежит оставленная вещь»
  rule: Не трогать вещь, сообщить начальнику поезда, сотрудникам ПТБ по поездной радиосвязи.
sit_45:
  kind: situation
  number: 45
  title: Пассажир паникует
  phrase: «Пожалуйста, сохраняйте спокойствие и следуйте рекомендациям персонала поезда»
  rule: Сохранять спокойствие. Не допускать паники. Давать четкие и понятные формулировки.
  tip: Четко знать свои должностные обязанности и алгоритмы отработки нештатных ситуаций.
sit_46:
  kind: situation
  number: 46
  title: Пассажира укачивает
  phrase: >-
    «Позвольте предложить Вам пересесть по ходу движения» «Позвольте предложить воду с лимоном
    для Вас»
  rule: >-
    Если пассажир едет против хода движения, предложить место по ходу (при наличии). Предложить
    воду. Если в наличии есть лимон, предложить.
  tip: Чуть позже обязательно подойти и спросить как себя чувствует пассажир.
sit_47:
  kind: situation
  number: 47
  title: Пассажир просит присмотреть за ребенком
  phrase: >-
    «Я буду рядом в зоне обслуживания и присмотрю» «В течение поездки я обязательно буду
    интересоваться комфортом проезда Вашего ребенка» «Да, конечно, я побуду рядом, только отмечу,
    что мне необходимо продолжить обслуживание»
  rule: >-
    Не брать ответственность вместо сопровождающего, предложить ситуативную помощь. Смотреть по
    ситуации.
  tip: >-
    Если ребенок старше 10 лет и едет без сопровождения обязательно подходить в течение поездки и
    интересоваться все ли комфортно. Если просят просто побыть рядом с малышом и отлучиться в
    уборную/бистро оказать содействие, но вежливо отметить, что у вас есть свои должностные
    обязанности.
sit_50:
  kind: situation
  number: 50
  title: Пассажир просит предоставить алкоголь, но выглядит нетрезвым
  phrase: «К сожалению, я не могу предоставить Вам этот напиток, позвольте предложить Вам чай или кофе?»
  rule: Вежливо отказать, сообщить начальнику поезда при угрозе конфликтной ситуации.
  tip: >-
    Важно понимать, что ЗАПРЕТИТЬ пассажиру приобретать алкоголь в бистро мы не можем, однако при
    угрозе конфликта или вероятности снижения комфорта проезда пассажиров начальник поезда в
    праве принимать подобные решения. Если в стоимость билета пассажира включен алкоголь, не
    предоставлять мы тоже не можем, но необходимо предупредить начальника.
sit_51:
  kind: situation
  number: 51
  title: Пассажир хочет «посмотреть» первый и бизнес-классы
  phrase: >-
    «Я не могу Вас пропустить в вагоны первого и бизнес-класса, так как сейчас там производится
    обслуживание горячими напитками, мы находимся на транспорте и мешать обслуживанию небезопасно.
    Спасибо за понимание»
  rule: Вежливо отказать сославшись на то, что на данный момент там производится обслуживание.
  tip: >-
    Обязательно сделать акцент на безопасности. Вы не пускаете пассажира не потому, что Вам жалко,
    а потому, что заботитесь о нем.

sto_011_4_6:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 4.6
  title: Готовность к посадке за одну минуту
  quote: >-
    Готовность высокоскоростного пассажирского поезда к посадке должна быть обеспечена в течение
    одной минуты с момента объявления посадки на поезд. Готовность к посадке означает: поезд
    подготовлен к посадке пассажиров в соответствии с классами обслуживания; поезд полностью
    остановлен; предназначенные для посадки/высадки пассажиров входные двери механически и
    электрически разблокированы; работники, задействованные в контроле наличия у пассажиров
    действительных проездных документов, и в обслуживании пассажиров при посадке, находятся на
    своих рабочих местах.
  reconstructed: true
sto_011_5_3:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 5.3
  title: Четыре класса обслуживания
  quote: >-
    На высокоскоростных железнодорожных линиях рекомендуется предусматривать четыре класса
    обслуживания в пути следования: стандарт (дополнительные услуги предоставляются за отдельную
    плату); комфорт (часть дополнительных услуг включена в стоимость проездного документа); бизнес
    (расширенный перечень дополнительных услуг, включенных в стоимость проездного документа);
    первый (персональный подход к обслуживанию пассажиров с предоставлением расширенного перечня
    дополнительных услуг, включенных в стоимость проездного документа, в изолированном от других
    классов обслуживания пространстве).
  reconstructed: true
sto_011_5_5:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 5.5
  title: Класс в отдельном вагоне или купе
  quote: >-
    Выделение определенного класса обслуживания пассажиров необходимо осуществлять в отдельном
    вагоне высокоскоростного поезда, либо в изолированном пространстве, отделенном от остального
    салона вагона (например, купе).
  reconstructed: true
sto_011_7_1_3:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.1.3
  title: Повышение класса при свободных местах
  quote: >-
    При наличии свободных мест в вагонах более высокого класса обслуживания пассажиру
    предоставляют возможность повышения класса обслуживания в соответствии с правилами и
    условиями, установленными организационно-правовыми и(или) распорядительными документами.
  reconstructed: true
sto_011_7_1_4:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.1.4
  title: Услуги маломобильным по классу билета
  quote: >-
    Маломобильным пассажирам должна быть предоставлена возможность воспользоваться услугами в
    соответствии с классом обслуживания, указанным в проездном документе. Способы обеспечения
    доступности услуг для маломобильных пассажиров приведены в СТО РЖД 03.014.
  reconstructed: true
sto_011_7_4_3:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.4.3
  title: Доставка из бистро на место в первом классе
  quote: >-
    Пассажиры вагонов первого класса обслуживания должны иметь возможность заказа и доставки к
    пассажирскому месту блюд и напитков из вагона-бистро.
  reconstructed: true
sto_011_7_4_10:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.4.10
  title: Напитки в первом классе без ограничений
  quote: >-
    Горячие и прохладительные напитки пассажирам первого класса обслуживания должны быть доступны
    на всем пути следования в неограниченном количестве.
  reconstructed: true
sto_011_7_4_13:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.4.13
  title: Бистро доступно в любое время
  quote: >-
    Услуги питания в вагоне-бистро должны быть доступны пассажирам в любое время следования
    высокоскоростного пассажирского поезда по маршруту между начальной и конечной станциями
    высокоскоростной железнодорожной линии.
  reconstructed: true
sto_011_7_7_4:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.7.4
  title: Ребёнок знает, кто его сопровождает
  quote: >-
    Ребенок должен быть проинформирован, кто именно из работников его сопровождает, как к нему
    можно обратиться, где его найти и(или) как позвать в случае необходимости.
  reconstructed: true
sto_011_7_10_2:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 7.10.2
  title: Платная услуга только после согласования цены
  quote: >-
    Дополнительные услуги, не включенные в стоимость проездного документа, могут быть оказаны
    только после предварительного согласования с пассажиром и информированием его об
    установленной стоимости услуги.
  reconstructed: true
sto_011_8_10:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 8.10
  title: Посадка под контролем персонала
  quote: >-
    Посадка-высадка пассажиров в вагоны высокоскоростного поезда должна осуществляться в
    присутствии и под контролем обслуживающего персонала.
  reconstructed: true
sto_011_10_1:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.1
  title: Форма, бейдж, инструкция, этика
  quote: >-
    Персонал, осуществляющий обслуживание пассажиров в пути следования и на вокзальных комплекса
    высокоскоростных железнодорожных линий, должен: носить форменную одежду и именной бейдж;
    выполнять требования своей должностной инструкции; соблюдать нормы и правила этики поведения.
  reconstructed: true
sto_011_10_3:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.3
  title: Ответ на любую просьбу, при отказе извиниться и объяснить
  quote: >-
    На вокзальном комплексе и в высокоскоростном поезде пассажир должен иметь возможность
    обратиться в любой момент к работнику с вопросом и(или) просьбой об услуге и получить ответ
    или услугу. При невозможности выполнить просьбу или оказать услугу работник должен извиниться
    и объяснить причину отказа.
  reconstructed: true
sto_011_10_4:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.4
  title: Неотложные просьбы в приоритетном порядке
  quote: >-
    Просьбы пассажиров, имеющие неотложный характер (например, оказание первой помощи), должны
    выполняться в приоритетном порядке.
  reconstructed: true
sto_011_10_5:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.5
  title: Нормативы ожидания обслуживания по классам
  quote: >-
    Численность персонала должна определяться с учетом допустимой продолжительности ожидания
    обслуживания пассажирами в штатной ситуации: класса обслуживания стандарт: не более 20 мин;
    класса обслуживания комфорт: не более 15 мин; класса обслуживания бизнес: не более 10 мин;
    первого класса обслуживания: не более 5 мин.
  reconstructed: true
sto_011_10_6:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: пункт 10.6
  title: Состав бригады, кто за что отвечает
  quote: >-
    При формировании поездной бригады высокоскоростного поезда необходимо предусматривать
    работников с различным функционалом: предоставление услуг пассажирам (по классам
    обслуживания); предоставление пассажирам услуг питания в вагоне-бистро; техническое
    обслуживание и сопровождение эксплуатации инженерно-технического оборудования
    высокоскоростного поезда; поддержание санитарно-гигиенического состояния внутри вагонов
    высокоскоростного поезда; обеспечение безопасности пассажиров и персонала; организация и
    руководство работой поездной бригады.
  reconstructed: true
sto_011_t1_equipment:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 1, строка «оборудование для использования услуг»
  title: Розетки, держатели и кнопка вызова по классам
  quote: >-
    стандарт: «разъемы для зарядки мобильных устройств (не менее одного на каждый кресельный
    блок)»; комфорт: «разъемы для зарядки мобильных устройств (не менее одного на каждый
    кресельный блок)»; бизнес: «разъемы для зарядки мобильных устройств (не менее одного на
    каждое пассажирское место); держатели для стаканов»; первый: «кнопка вызова персонала;
    разъемы для зарядки мобильных устройств (не менее двух на каждое пассажирское место);
    держатели для стаканов».
  reconstructed: false
sto_011_t2_entertainment:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 2, строка «Развлечения»
  title: Планшет по запросу
  quote: >-
    стандарт и комфорт: «-»; бизнес и первый: «предоставление в пользование планшета по запросу
    у персонала».
  reconstructed: false
sto_011_t2_food:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 2, строка «Питание и напитки на пассажирском месте»
  title: Питание на пассажирском месте по классам
  quote: >-
    стандарт: «-»; комфорт: «кулер с горячей и холодной водой в вагоне»; бизнес: «прохладительные
    и горячие напитки; холодные закуски; десерт; соль, сахар, специи в индивидуальной упаковке»;
    первый: «прохладительные и горячие напитки; холодные и горячие закуски; горячее питание;
    десерт; соль, сахар, специи в индивидуальной упаковке».
  reconstructed: false
sto_011_t2_storage:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 2, строка «Хранение личных вещей (ручной клади и багажа)»
  title: Места хранения ручной клади по классам
  quote: >-
    стандарт: «багажные полки; карманы в пассажирских креслах»; комфорт и бизнес: «багажные
    полки; отсеки со стеллажами для хранения багажа; карманы в пассажирских креслах»; первый:
    «закрытый багажный отсек или шкаф; отсеки и(или) крючки для размещения ручной клади (сумок,
    портфелей, рюкзаков и т.п.); сейф*» (звёздочка в таблице: «услуга носит рекомендательный
    характер»).
  reconstructed: false
sto_011_t3_staff_presence:
  kind: standard
  document: СТО РЖД 03.011-2026
  clause: таблица 3, строка «Устное информирование»
  title: Присутствие персонала на рабочем месте
  quote: >-
    «Возможность обратиться к персоналу | Присутствие персонала на рабочем месте с учетом
    п. 10.5».
  reconstructed: false
sto_013_4_7:
  kind: standard
  document: СТО РЖД 03.013-2026
  clause: пункт 4.7
  title: Платные услуги через контрольно-кассовую технику
  quote: >-
    При оказании услуг пассажирам высокоскоростного электропоезда на платной основе необходимо
    использовать контрольно-кассовую технику, количество которой определяют в зависимости от
    реализуемой технологии оказания услуг.
  reconstructed: true
sto_013_7_1_2:
  kind: standard
  document: СТО РЖД 03.013-2026
  clause: пункт 7.1.2
  title: Питьевая вода на всём пути, одноразовые стаканчики
  quote: >-
    Оборудование, используемое для подачи питьевой воды согласно таблице 1, должно обеспечивать
    доступ к данной услуге на всем пути следования с учетом продолжительности поездки, в том
    числе обеспечено наличие одноразовых стаканчиков.
  reconstructed: true
sto_013_7_1_3:
  kind: standard
  document: СТО РЖД 03.013-2026
  clause: пункт 7.1.3
  title: Сервисная тележка в первом и бизнесе
  quote: >-
    Для подачи блюд и напитков в каждом вагоне высокоскоростного электропоезда с классами
    обслуживания первый и бизнес должно быть предусмотрено не менее одной сервисной мобильной
    тележки.
  reconstructed: true
sto_013_7_1_4:
  kind: standard
  document: СТО РЖД 03.013-2026
  clause: пункт 7.1.4
  title: Тележка проходит между креслами
  quote: >-
    Габаритные размеры сервисной мобильной тележки должны позволять ее беспрепятственное
    перемещение по проходу между пассажирскими креслами.
  reconstructed: true
sto_014_6_1:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.1
  title: Доступность поезда, подъёмные устройства
  quote: >-
    Доступность высокоскоростного пассажирского поезда для маломобильных пассажиров должна быть
    обеспечена с соблюдением требований ГОСТ Р 51090 (в части обеспечения доступности и
    безопасности), ГОСТ 33190 (в части соблюдения технических требований для перевозки
    инвалидов), ГОСТ Р 51764 (в части технических требований к подъемным устройствам,
    предназначенным для обеспечения перемещения маломобильных пассажиров в вагон).
  reconstructed: true
sto_014_6_2:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.2
  title: Проезд маломобильных по классам обслуживания
  quote: >-
    Маломобильным пассажирам, в том числе инвалидам различных групп функционирования, должна
    быть обеспечена возможность проезда в вагонах различных классов обслуживания: на
    пассажирском месте: в вагонах классов обслуживания первый и бизнес для инвалидов всех групп
    функционирования; в кресле-коляске на специально выделенном месте для инвалидов с
    ограничениями мобильности, на пассажирском месте для инвалидов всех групп функционирования
    и для маломобильных пассажиров: в вагонах классов обслуживания стандарт и комфорт.
    Примечание: перевозка лежачих больных может быть осуществлена только на отдельных условиях.
  reconstructed: true
sto_014_6_3:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.3
  title: Место для сопровождающего и для сложенной коляски
  quote: >-
    В вагонах высокоскоростного пассажирского поезда, где предусмотрен проезд на пассажирском
    месте маломобильных пассажиров, передвигающихся с использованием кресла-коляски, должно быть
    предусмотрено место для сопровождающего его лица и место для размещения кресла-коляски в
    сложенном состоянии в пути следования.
  reconstructed: true
sto_014_6_4:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.4
  title: Одежда и кладь на выделенных местах
  quote: >-
    На специально выделенных местах для проезда маломобильных пассажиров, передвигающихся в
    креслах-колясках, должны быть предусмотрены доступные для них места для размещения верхней
    одежды и ручной клади.
  reconstructed: true
sto_014_6_5:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 6.5
  title: Кресло-коляска поезда во временное пользование
  quote: >-
    В высокоскоростных пассажирских поездах необходимо предусматривать не менее одного
    кресла-коляски для предоставления во временное пользование маломобильным пассажирам для
    обеспечения доступности услуг, предоставление которых на пассажирском месте невозможно
    организовать.
  reconstructed: true
sto_014_7_1:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 7.1
  title: Коммуникация на всех этапах
  quote: >-
    Коммуникация с маломобильными пассажирами и инвалидами всех групп функционирования должна
    быть обеспечена на всех этапах обслуживания на высокоскоростных железнодорожных линиях.
  reconstructed: true
sto_014_7_14:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 7.14
  title: Альтернативная коммуникация со слабослышащими в поезде
  quote: >-
    На территории вокзальных комплексов и в высокоскоростных пассажирских поездах в пути
    следования на высокоскоростных железнодорожных линиях маломобильным пассажирам из числа
    инвалидов с нарушением функции слуха должны быть доступны различные альтернативные способы
    коммуникации, в том числе с использованием коммуникативных устройств, смартфонов, планшетов
    и т.п.
  reconstructed: true
sto_014_8_1:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.1
  title: Помощь в получении услуг
  quote: >-
    На вокзальных комплексах и в пути следования на высокоскоростных железнодорожных линиях
    необходимо обеспечивать помощь в получении услуг маломобильными пассажирами.
  reconstructed: true
sto_014_8_2:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.2
  title: Помощь безвозмездно
  quote: >-
    Перечень категорий маломобильных пассажиров, включая инвалидов различных групп
    функционирования, которым помощь предоставляется на безвозмездной основе, определен
    федеральным законом [2] и может быть расширен организационно-правовыми или
    распорядительными документами.
  reconstructed: true
sto_014_8_4:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.4
  title: Сопровождение от парковки до вагона
  quote: >-
    Маломобильным пассажирам должна быть обеспечена возможность оформления услуги сопровождения
    по территории вокзального комплекса высокоскоростной железнодорожной линии от момента
    прибытия на парковку до момента посадки в вагон.
  reconstructed: true
sto_014_8_7:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.7
  title: Персонал поезда помогает разместиться с вещами
  quote: >-
    Персонал высокоскоростного поезда оказывать помощь маломобильным пассажирам при размещении
    их в вагоне с личными вещами и багажом.
  reconstructed: true
sto_014_8_8:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.8
  title: Питание на место для маломобильных
  quote: >-
    Маломобильным пассажирам, испытывающим затруднения при самостоятельном передвижении, в пути
    следования должна быть доступна возможность заказа питания на пассажирское место.
  reconstructed: true
sto_014_8_9:
  kind: standard
  document: СТО РЖД 03.014-2026
  clause: пункт 8.9
  title: Навыки персонала при обслуживании маломобильных
  quote: >-
    Персонал, непосредственно задействованный в обслуживании маломобильных пассажиров на
    высокоскоростных железнодорожных линиях, должен обладать навыками (умениями): получения
    информации от маломобильных пассажиров или сопровождающих их лиц в процессе оказания услуг
    в объеме, необходимом для предупреждения опасных ситуаций; построения наилучшего маршрута
    следования для сопровождения маломобильных пассажиров с учетом их особенностей и групп
    функционирования инвалидов в соответствии со схемой доступных маршрутов передвижения на
    объекте; использования различных альтернативных способов коммуникации в темпе, наиболее
    приемлемом для получателя услуг с учетом особенностей маломобильных пассажиров и групп
    функционирования инвалидов, в том числе с использованием коммуникативных устройств,
    смартфонов, планшетов, средств альтернативной коммуникации; анализа окружающей информации,
    получаемой посредством наблюдения, и предоставления необходимой информации маломобильным
    пассажирам о внешней обстановке на объекте и имеющихся барьерах, препятствиях; оказания
    помощи в использовании технического оборудования, находящегося на объекте, и
    вспомогательных средств с учетом особенностей маломобильных пассажиров и групп
    функционирования инвалидов; использования и безопасной эксплуатации имеющихся на объекте
    вспомогательных средств и технического оборудования; создания спокойной, комфортной,
    доброжелательной обстановки в процессе предоставления услуг сопровождения и оказания
    помощи.
  reconstructed: true
