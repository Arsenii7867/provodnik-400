# Классы обслуживания ВСМ-400 (СТО РЖД 03.011-2026, п. 5.3 и п. 10.5, слайды организаторов).
# loyalty_sensitivity умножает эффект варианта на лояльность: пассажир первого класса переживает
# ту же ошибку острее. wait_minutes это допустимое ожидание обслуживания по п. 10.5, его видит
# сотрудник в шапке прохождения. Доступность вариантов по классу задаётся в сценарии
# условием when: {service_class: [...]}.

standard:
  title: Стандарт
  description: дополнительные услуги за отдельную плату, компоновка 3+2, бистро в одном из вагонов
  layout: "3+2"
  wait_minutes: 20
  loyalty_sensitivity: 1.0
comfort:
  title: Комфорт
  description: часть дополнительных услуг включена в билет, компоновка 2+2, игровая комната в одном из вагонов
  layout: "2+2"
  wait_minutes: 15
  loyalty_sensitivity: 1.0
business:
  title: Бизнес
  description: расширенный перечень услуг включён в билет, компоновка 2+2, планшет по запросу
  layout: "2+2"
  wait_minutes: 10
  loyalty_sensitivity: 1.25
first:
  title: Первый
  description: персональный подход в изолированном пространстве, компоновка 2+1, кнопка вызова персонала
  layout: "2+1"
  wait_minutes: 5
  loyalty_sensitivity: 1.5
