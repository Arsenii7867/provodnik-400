# Компетенции проводника, по которым оцениваются решения в сценариях. Код встречается в
# эффектах вариантов (competencies: {код: очки от минус 3 до 3}), название и описание видит
# сотрудник в профиле и аналитике.

- code: empathy
  title: Эмпатия и контакт
  description: признать ситуацию и чувства пассажира, остаться рядом, говорить спокойно
- code: rules
  title: Правила и стандарты
  description: обозначить правило со ссылкой на норму, не нарушать его ради лояльности
- code: solution
  title: Сервисное решение
  description: предложить выход и альтернативу, довести до результата, вернуться с ответом
- code: safety
  title: Безопасность на борту
  description: курение, бесхозные вещи, свободный проход, алкоголь, двери, физический риск
- code: escalation
  title: Эскалация и бригада
  description: правильный канал и момент вызова начальника поезда, ПТБ, бортинженера, медиков
- code: medical
  title: Первая помощь и здоровье
  description: действия в рамках компетенции, без личных лекарств, через начальника и медиков
- code: inclusion
  title: Инклюзивность
  description: маломобильные пассажиры, дети, пассажиры с животными, альтернативная коммуникация
