id: upgrade_and_seat
version: 2
title: Хочу в бизнес
summary: >-
  Пассажирка комфорт-класса просит пересадить её в бизнес и готова доплатить; в бизнесе есть
  свободное место, мобильная касса в служебном купе, до Твери полчаса.
source_situations: [8, 9, 13, 33]
difficulty: 2
critical: false
tags: [класс обслуживания, доплата, мобильная касса, комфорт]
competencies: [rules, solution, escalation, empathy]
role_model: true
estimated_minutes: 3
context:
  service_class: comfort
  segment: участок Москва, Тверь, через двадцать минут после отправления
  next_station_minutes: 30
  time_of_day: день
  passenger:
    label: женщина лет тридцати на месте 14А с ноутбуком
    state: устала от шумных соседей, просит пересадить в бизнес и готова доплатить
  crew_available: [chief]
  loyalty_of: пассажирка с места 14А и пассажир бизнес-класса с билетом на 3С
start:
  node: request
  loyalty: 60
  safety: 75
  flags: {}
# пересадка до оформления доплаты закрывает образцовый исход: порог выше умолчаний rules.yaml
outcome_rules:
  exemplary_if: {safety_min: 90, loyalty_min: 80}
nodes:
  request:
    type: dialog
    text: >-
      Пассажирка с 14А закрывает ноутбук: рядом шумная компания, работать невозможно. Она просит
      пересадить её в бизнес и готова доплатить прямо сейчас.
    passenger_says: Пересадите меня в бизнес, я доплачу. Тут работать нельзя.
    options:
      - id: acknowledge_check_seats
        text: >-
          Говорю «Понимаю Вас. Сейчас я уточню наличие свободных мест и возможность оформления
          повышения класса обслуживания».
        role_step: acknowledge
        effects: {loyalty: 10, safety: 5}
        competencies: {empathy: 2, rules: 1, solution: 1}
        next: offer
        debrief:
          verdict: best
          why: >-
            Реплика карточки 8 дословно, перед ней признание из ролевой модели. Повышение класса
            при свободных местах предусмотрено стандартом, но по правилам и с оформлением, и
            пассажирка сразу слышит, что вы этим займётесь.
          refs: [sit_8, sto_011_7_1_3, model_role_steps]
      - id: ask_reason_same_class
        text: >-
          Говорю «Понимаю Вас. Подскажите, пожалуйста, причину пересадки, я проверю, чем мы можем
          помочь», и смотрю свободные места в комфорте.
        role_step: acknowledge
        effects: {loyalty: 5, safety: 5}
        competencies: {empathy: 1, solution: 1}
        next: offer
        debrief:
          verdict: ok
          why: >-
            Тоже по карточке 9: причину вы узнали и проверяете места в том же классе, где тихое
            место решило бы вопрос без доплаты. Уступает лучшему одним: не сказано, что вы
            проверите и повышение класса, о котором она просила.
          better: >-
            Уточнить причину и сразу сказать: «Сейчас я уточню наличие свободных мест и возможность
            оформления повышения класса обслуживания».
          refs: [sit_9, sit_8]
      - id: move_free_now
        text: >-
          Говорю «Идёмте, в бизнесе есть пустое кресло, доплату оформим потом, как освобожусь», и
          сажаю её на пустующее 3С.
        effects: {loyalty: 15, safety: -5}
        competencies: {rules: -3, solution: 1}
        next: moved_free
        debrief:
          verdict: bad
          why: >-
            Ловушка карточек 8 и 9: пересадить в более высокий класс до оформления доплаты. Место
            выбрано на глаз, без проверки по кассе: пассажирке приятно, но у 3С есть владелец с
            билетом, и спор за него теперь вопрос времени.
          better: >-
            «Сейчас я уточню наличие свободных мест и возможность оформления повышения класса
            обслуживания»: сначала проверка мест и оформление через мобильную кассу, потом
            пересадка.
          refs: [sit_8, sit_9, sto_011_7_1_3]
      - id: refuse_flat
        text: Говорю «Пересадок нет, сидите на своём месте» и иду дальше по вагону.
        effects: {loyalty: -15}
        competencies: {rules: -1, empathy: -2}
        next: offer
        debrief:
          verdict: bad
          why: >-
            Карточка 8 начинает с проверки мест, и отказ без неё выпадает из её реакции, а
            стандарт прямо предусматривает повышение класса при свободных местах. К тому же при
            отказе положено извиниться и объяснить причину.
          better: >-
            Проверить места и стоимость: «Сейчас я уточню наличие свободных мест и возможность
            оформления повышения класса обслуживания».
          refs: [sit_8, sto_011_7_1_3, sto_011_10_3]

  offer:
    type: dialog
    text: >-
      Тихих мест в комфорте нет. В приложении видно: в бизнесе свободно место 5D, доплата по
      тарифу проводится через мобильную кассу, она в служебном купе. Пассажирка уже складывает
      ноутбук.
    passenger_says: Отлично, я пошла? Заплачу, как оформите.
    options:
      - id: stay_until_paid
        text: >-
          Говорю «Доплата по тарифу, картой или наличными через мобильную кассу. Обращаю Ваше
          внимание: до подтверждения пересадки прошу Вас оставаться на месте, указанном в билете.
          Оформление займёт пару минут».
        role_step: rule
        effects: {loyalty: 5, safety: 10}
        competencies: {rules: 2, empathy: 1}
        set_flags: {stay_asked: true}
        next: packing
        debrief:
          verdict: best
          why: >-
            Стоимость и способ оплаты названы заранее, как требует стандарт для платных услуг, а
            дальше вторая реплика карточки 8 почти дословно: до оформления пассажир остаётся на
            своём месте, и это защищает и её, и владельца чужого кресла от спора в проходе. Срок
            назван, поэтому ожидание не выглядит отказом.
          refs: [sit_8, sto_011_7_10_2, model_role_steps]
      - id: explain_price_only
        text: >-
          Называю стоимость доплаты и говорю, что оплата через мобильную кассу, картой или
          наличными; про ожидание на месте не говорю.
        effects: {loyalty: 5}
        competencies: {rules: 1}
        next: packing
        debrief:
          verdict: ok
          why: >-
            Стоимость и способ оплаты названы заранее, как требует стандарт для платных услуг, и
            это верно. Но карточка 8 велит ещё и попросить оставаться на месте до оформления: без
            этой просьбы пассажирка решит, что можно идти.
          better: >-
            Добавить: «До подтверждения пересадки прошу Вас оставаться на месте, указанном в
            билете».
          refs: [sto_011_7_10_2, sit_8]
      - id: let_move_pay_later
        text: Говорю «Идите в бизнес, устраивайтесь, я подойду с кассой».
        effects: {loyalty: 10, safety: -15}
        competencies: {rules: -2}
        next: moved_free
        debrief:
          verdict: bad
          why: >-
            Ловушка карточки 8: пересадить до оформления доплаты. Место вы не назвали, и
            пассажирка сядет на первое пустое кресло, а у него есть владелец: спор за место с
            законным пассажиром, о котором предупреждает карточка 13, вы устроили сами.
          better: >-
            «До подтверждения пересадки прошу Вас оставаться на месте, указанном в билете», и
            оформить доплату через мобильную кассу у её кресла.
          refs: [sit_8, sit_13]
      - id: cash_in_pocket
        text: >-
          Беру наличные сразу: «Чек выпишу позже, кассу нести долго», и отпускаю её в бизнес:
          сядет на любое пустое.
        effects: {loyalty: 5}
        competencies: {rules: -3}
        set_flags: {cash_bypass: true}
        delayed:
          - steps: 4
            effects: {safety: -30}
            text: >-
              Касса не сошлась с числом пересадок, и начальник поезда выясняет, кто и за что взял
              наличные без чека.
            unless_flags: {receipt_issued: true}
        next: moved_free
        debrief:
          verdict: bad
          why: >-
            Вторая ловушка карточки 8: принять доплату мимо мобильной кассы. Платные услуги
            оформляются через контрольно-кассовую технику; наличные в кармане без чека всплывут при
            сверке, а пассажирка ушла в бизнес до оформления и без названного места.
          better: >-
            Оформить доплату через мобильную кассу у её кресла и только потом проводить на место.
          refs: [sit_8, sto_013_4_7]
      - id: call_chief_for_nothing
        text: >-
          По радиосвязи вызываю начальника поезда: «Пассажирка хочет в бизнес, подойдите, решите».
          Он отвечает, что это мой вопрос.
        escalation_target: chief
        effects: {loyalty: -5}
        competencies: {escalation: -2}
        next: packing
        debrief:
          verdict: bad
          why: >-
            Повышение класса при свободных местах и мобильная касса это ваша работа, карточка 8 не
            предусматривает здесь начальника поезда. Пассажирка ждёт лишние минуты, а начальник
            отвлечён от бригады ради вопроса, который решается на месте.
          better: >-
            Самому уточнить места и стоимость, попросить оставаться на месте и оформить доплату
            через мобильную кассу.
          refs: [sit_8, sto_011_7_1_3]

  packing:
    type: dialog
    text: >-
      Пассажирка сложила ноутбук и сумку и поглядывает в сторону бизнес-вагона. Мобильная касса в
      служебном купе, до него полвагона.
    passenger_says: Долго ещё? Я могу и сама дойти.
    timer:
      seconds: 40
      on_expire:
        next: moved_himself
        effects: {loyalty: -5, safety: -15}
        competencies: {solution: -1, rules: -1}
        debrief:
          why: >-
            Вы тянули с кассой, и пассажирка ушла в бизнес сама: карточка 8 предупреждает, что до
            оформления доплаты пассажир остаётся на своём месте, а удержать его там может только
            быстрое оформление.
          better: >-
            Сразу сказать, сколько ждать, и оформить доплату через мобильную кассу у её кресла за
            пару минут.
          refs: [sit_8, sit_13]
    options:
      - id: process_mobile_kiosk
        text: >-
          Говорю «Для решения вопроса мне понадобится две минуты: принесу мобильную кассу и
          оформим здесь».
        role_step: solution
        effects: {safety: 10}
        competencies: {solution: 2, rules: 1}
        next: done
        debrief:
          verdict: best
          why: >-
            Решение по ролевой модели с названным сроком: доплата через утверждённый канал,
            пассажирка остаётся на месте, как требует карточка 8, и знает, сколько ждать.
          refs: [sit_8, sto_013_4_7, model_role_steps]
      - id: ask_to_wait_again
        text: Говорю «Прошу Вас пока оставаться на месте» и ухожу за кассой, не сказав, сколько ждать.
        effects: {loyalty: -5, safety: 5}
        competencies: {rules: 1}
        next: done
        debrief:
          verdict: ok
          why: >-
            Правило карточки 8 повторено, и это удерживает пассажирку на месте. Но карточка велит
            уточнить стоимость и порядок оформления, а не оставить ждать молча: она не знает, две
            минуты это или десять.
          better: >-
            Назвать срок: «Для решения вопроса мне понадобится две минуты».
          refs: [sit_8, model_role_steps]
      - id: send_her_to_chief_car
        text: Говорю «Идите в бизнес, там начальник поезда всё оформит», и возвращаюсь к тележке.
        effects: {loyalty: 5, safety: -10}
        competencies: {rules: -2, solution: -1}
        next: moved_free
        debrief:
          verdict: bad
          why: >-
            Пассажирка ушла в бизнес без оформления, без названного места и без вас, а начальник
            поезда о ней не знает: она сядет на первое пустое кресло, и по карточке 13 это чужое
            место с конфликтом впереди. Карточка 8 требует держать пассажира на месте по билету до
            подтверждения.
          better: Принести мобильную кассу к креслу и оформить доплату за пару минут.
          refs: [sit_8, sit_13]

  done:
    type: dialog
    text: >-
      Доплата оформлена через мобильную кассу, чек у пассажирки. Она стоит с сумкой и ждёт, куда
      идти.
    passenger_says: Спасибо. Куда мне теперь?
    options:
      - id: thank_and_escort
        text: Говорю «Благодарю Вас за ожидание, провожу Вас на место 5D», беру сумку и провожаю.
        role_step: assure
        effects: {loyalty: 10}
        competencies: {empathy: 2, solution: 1}
        next: ending_upgraded
        debrief:
          verdict: best
          why: >-
            Заверение по ролевой модели и доведение решения до конца: пассажирка не ищет вагон
            сама, а чек на руках исключает спор за место.
          refs: [model_role_steps, sit_8]
      - id: hand_receipt_only
        text: >-
          Отдаю чек и называю вагон и место: «Третий вагон, 5D, найдёте».
        effects: {safety: 5}
        competencies: {solution: 1}
        next: ending_upgraded
        debrief:
          verdict: ok
          why: >-
            Оформление завершено, чек на руках, по нему спор за место невозможен. Но пассажирка
            после ожидания ушла с сумкой одна, без слова благодарности за терпение: ролевая модель
            заканчивается заверением.
          better: «Благодарю Вас за ожидание, провожу Вас на место 5D».
          refs: [sit_8, model_role_steps]
      - id: rush_off_no_word
        text: Сую чек и убегаю на вызов из соседнего вагона, не сказав ни слова.
        effects: {loyalty: -10}
        competencies: {empathy: -2}
        next: ending_upgraded
        debrief:
          verdict: bad
          why: >-
            Всё оформлено, но пассажирка, которая по вашей просьбе ждала на месте, осталась без
            ответа на вопрос, куда идти. Нормы этики и ролевая модель требуют закончить разговор.
          better: «Благодарю Вас за ожидание, провожу Вас на место 5D».
          refs: [sto_011_10_1, model_role_steps]

  moved_himself:
    type: event
    text: >-
      Пока вы тянули, место 14А опустело: пассажирка ушла в бизнес сама и села на первое пустое
      кресло, 3С. Из третьего вагона вас уже зовут: на 3С вернулся из бистро пассажир с билетом.
    effects: {safety: -5}
    next: conflict_seat

  moved_free:
    type: event
    text: >-
      Пассажирка устроилась на первом пустом кресле, 3С, и открыла ноутбук. Через пять минут из
      бистро возвращается мужчина с билетом на 3С и останавливается у кресла.
    effects: {safety: -10}
    next: conflict_seat

  conflict_seat:
    type: dialog
    text: >-
      У места 3С двое: пассажирка с ноутбуком и мужчина с билетом на это место. Он требует
      объяснений, вагон бизнес-класса притих.
    passenger_says: Я же спросила, вы разрешили! Я никуда не пойду.
    options:
      - id: check_tickets_call_chief
        text: >-
          Говорю «Я вижу, что ситуация требует уточнения. Позвольте оба билета, и я приглашу
          начальника поезда», проверяю документы и вызываю его по радиосвязи.
        escalation_target: chief
        effects: {loyalty: 5, safety: 10}
        competencies: {rules: 2, escalation: 2, empathy: 1}
        next: chief_resolves
        debrief:
          verdict: best
          why: >-
            Реакция карточки 33 целиком: реплика без обвинений, оба проездных документа проверены,
            начальник поезда приглашён. Спор за место решает он, а не проводник в проходе.
          refs: [sit_33, sit_13]
      - id: apologise_return_and_process
        text: >-
          Говорю «Приношу извинения обоим: место 3С по билету Ваше. Прошу Вас вернуться на 14А,
          доплату оформлю через мобильную кассу на свободное 5D», и иду за кассой.
        effects: {loyalty: -5, safety: 10}
        competencies: {rules: 2, solution: 1}
        next: done
        debrief:
          verdict: ok
          why: >-
            Реакция карточки 13: спокойно вернуть пассажира на место по билету и оформить
            пересадку, с извинением, как требует стандарт. Спор, который вы создали, вы же и
            погасили, но начальник поезда о нём не знает, а карточка 33 при двух пассажирах на
            одном месте велит его пригласить.
          better: >-
            То же самое, но с приглашением начальника поезда: он должен знать о споре за место в
            своём поезде.
          refs: [sit_13, sto_011_10_3, sit_33]
      - id: call_chief_without_checking
        text: >-
          По радиосвязи сразу вызываю начальника поезда, билеты не смотрю: «Разберитесь, у нас
          двое на одно место».
        escalation_target: chief
        effects: {safety: 5}
        competencies: {escalation: 1}
        next: chief_resolves
        debrief:
          verdict: ok
          why: >-
            Начальник поезда приглашён, и это по карточке 33. Но она ставит первым внимательную
            проверку проездных документов: без неё вы не можете сказать начальнику, кто здесь на
            своём месте.
          better: >-
            Сначала «Пожалуйста, позвольте Ваш билет» обоим, потом вызов начальника поезда с
            фактами.
          refs: [sit_33, sit_13]
      - id: remind_agreed_to_wait
        text: >-
          Говорю «Обращаю Ваше внимание: мы договорились дождаться оформления на месте по билету,
          прошу вернуться на 14А», и вызываю начальника поезда.
        when: {flags_all: {stay_asked: true}}
        role_step: rule
        escalation_target: chief
        effects: {loyalty: -5, safety: 10}
        competencies: {rules: 2}
        next: chief_resolves
        debrief:
          verdict: ok
          why: >-
            Правило названо верно, напомнить о договорённости вы вправе, начальник поезда
            приглашён. Но напоминание при всём вагоне пассажирка приняла как выговор, а билеты
            обоих вы так и не сверили.
          better: Сначала проверить оба билета и пригласить начальника поезда без упрёков.
          refs: [sit_13, sit_33]
      - id: send_one_to_bistro
        text: Говорю мужчине «Посидите пока в бистро, я разберусь», чтобы снять спор.
        effects: {loyalty: -10, safety: 5}
        competencies: {rules: -1, empathy: -1}
        next: chief_resolves
        debrief:
          verdict: bad
          why: >-
            Спор в проходе снят, но за счёт законного владельца места, который ушёл обиженным, а
            решать спор самому без проверки документов и начальника поезда это ловушка карточки
            33.
          better: Проверить оба билета и пригласить начальника поезда.
          refs: [sit_33]
      - id: take_side_of_upgrader
        text: Говорю мужчине «Она доплачивает, сядьте на другое свободное место», билеты не смотрю.
        effects: {loyalty: -10, safety: -10}
        competencies: {rules: -3, empathy: -1}
        next: ending_seat_dispute
        debrief:
          verdict: bad
          why: >-
            Вы отдали чужое место по билету и обвинили законного пассажира, не проверив документы,
            а карточка 13 называет это первой ловушкой. Мужчина пошёл к начальнику поезда с
            жалобой, доплата так и не оформлена.
          better: >-
            Проверить оба билета, пригласить начальника поезда и вернуть пассажирку на 14А до
            оформления.
          refs: [sit_13, sit_33]

  chief_resolves:
    type: dialog
    text: >-
      Начальник поезда у места 3С: у мужчины билет на 3С, у пассажирки на 14А в комфорте. Он
      спрашивает вас, как она оказалась в бизнесе и оформлена ли доплата.
    passenger_says: Только не позорьте меня перед всем вагоном, я всё оплачу как положено.
    options:
      - id: report_honestly
        text: >-
          Докладываю как было: пассажирка пересела до оформления, доплата не проведена; предлагаю
          оформить сейчас через мобильную кассу на свободное 5D.
        when: {flags_none: [cash_bypass]}
        effects: {loyalty: 5}
        competencies: {rules: 2, escalation: 1}
        next: ending_chief_upgrade
        debrief:
          verdict: best
          why: >-
            Честный доклад и готовое решение: начальник поезда знает, что оформить, а пассажирка
            слышит, что вопрос решается без позора. По карточке 8 повышение класса оформляется с
            доплатой через мобильную кассу, и здесь это наконец делается по правилам.
          refs: [sit_8, sto_011_7_1_3]
      - id: issue_receipt_now
        text: >-
          Говорю «Информирую Вас: доплату я принял наличными до оформления, сейчас проведу её через
          мобильную кассу и выдам чек», и делаю это при начальнике поезда.
        when: {flags_all: {cash_bypass: true}}
        role_step: rule
        effects: {loyalty: -5, safety: 10}
        competencies: {rules: 2}
        set_flags: {receipt_issued: true}
        next: ending_chief_upgrade
        debrief:
          verdict: best
          why: >-
            Единственный верный ход после ошибки: наличные проведены через кассу при начальнике
            поезда, чек выдан, сверка сойдётся. Замечание вы получите, зато нарушение не стало
            скрытым.
          refs: [sit_8, sto_013_4_7]
      - id: leave_as_is
        text: >-
          Молчу и жду, что решит начальник поезда: он сам всё видит.
        effects: {safety: -5}
        next: ending_chief_upgrade
        debrief:
          verdict: ok
          why: >-
            Начальник поезда разберётся, но он ждёт от вас доклада, а не молчания: как пассажирка
            оказалась на 3С, знаете вы. Карточка 33 отводит проводнику роль того, кто проверил
            документы и передал факты.
          better: Доложить, что произошло, и предложить оформить доплату через мобильную кассу сейчас.
          refs: [sit_33]
      - id: hide_cash_from_chief
        text: >-
          Про наличные молчу: «Доплату ещё не оформляли», проведу через кассу, когда начальник
          уйдёт.
        when: {flags_all: {cash_bypass: true}}
        effects: {safety: -10}
        competencies: {rules: -3}
        next: ending_chief_upgrade
        debrief:
          verdict: bad
          why: >-
            Деньги уже в кармане, а начальнику поезда сказано, что оплаты не было: сверка кассы
            покажет расхождение, и скрытое нарушение превратится в разбор.
          better: Сказать о наличных сразу и провести их через мобильную кассу при начальнике поезда.
          refs: [sit_8, sto_013_4_7]
      - id: blame_passenger
        text: >-
          Говорю начальнику поезда при всех: «Она сама ушла, я тут ни при чём».
        effects: {loyalty: -15, safety: -5}
        competencies: {rules: -2, empathy: -2}
        next: ending_seat_dispute
        debrief:
          verdict: bad
          why: >-
            Обвинить пассажира в самовольной пересадке это ловушка карточки 13, а здесь это ещё и
            полуправда: она ушла с вашего разрешения или потому, что вы задержались с кассой.
            Пассажирка напишет жалобу, а начальник поезда узнает, как было, от соседей.
          better: Честно доложить, что произошло, и предложить оформить доплату сейчас.
          refs: [sit_13, sto_011_10_1]

  ending_upgraded:
    type: ending
    title: Место в бизнесе оформлено
    text: >-
      Пассажирка работает на 5D в тишине, чек в сумке, доплата в кассе. Соседи по комфорту так и
      не заметили, что она ушла.
    debrief:
      summary: >-
        Повышение класса при свободных местах оформлено по правилам: место по билету до
        подтверждения, стоимость названа заранее, доплата через мобильную кассу, срок ожидания
        назван. Паузы без обратной связи и молчание при прощании стоили лояльности.
      refs: [sit_8, sto_011_7_1_3, sto_013_4_7]

  ending_chief_upgrade:
    type: ending
    title: Пересадка через начальника поезда
    text: >-
      Начальник поезда распорядился оформить доплату на свободное 5D, мужчина сел на своё 3С. Вам
      он сказал два слова о том, как это должно было пройти.
    debrief:
      summary: >-
        Спор за место решён бригадой, как велит карточка 33, но возник он из-за пересадки до
        оформления. Если доплата прошла мимо кассы и осталась скрытой, сверка в конце рейса
        превращает замечание в разбор.
      refs: [sit_33, sit_8, sto_013_4_7]

  ending_seat_dispute:
    type: ending
    title: Жалоба за место
    text: >-
      Жалобы написали оба: мужчина за отданное место, пассажирка за то, что её при всём вагоне
      выставили виноватой. Начальник поезда вернул её на 14А, доплата не оформлена.
    debrief:
      summary: >-
        Место по билету это право пассажира, а проверка документов и начальник поезда это порядок
        карточек 13 и 33. Решать спор самому и назначать виноватых значит получить две жалобы
        вместо оформленного повышения класса.
      refs: [sit_13, sit_33, sto_011_10_1]
