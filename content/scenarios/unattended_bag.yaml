id: unattended_bag
version: 2
title: Сумка без хозяина
summary: >-
  В вагоне комфорт-класса пассажирка показывает на чёрную сумку под пустым креслом: хозяина не
  видно с Твери, до Москвы сорок минут, сотрудники ПТБ и начальник поезда в головном вагоне.
source_situations: [41, 14, 17]
difficulty: 3
critical: true
tags: [бесхозная вещь, ПТБ, радиосвязь, комфорт]
competencies: [safety, escalation, solution, empathy, rules]
role_model: true
estimated_minutes: 4
context:
  service_class: comfort
  segment: участок Тверь, Москва, через десять минут после Твери
  next_station_minutes: 40
  time_of_day: день
  passenger:
    label: женщина лет сорока на месте 12С, которая заметила сумку
    state: встревожена, показывает на сумку под пустым креслом 11В
  crew_available: [chief, ptb, pa_announcement]
  escalation_expected_by_step: 1
  loyalty_of: пассажирка с места 12С и соседи по вагону
start:
  node: intro
  loyalty: 60
  safety: 70
  flags: {}
# образцовый исход недостижим через ловушки карточки 41: порог выше умолчаний rules.yaml
outcome_rules:
  exemplary_if: {safety_min: 90, loyalty_min: 80}
nodes:
  intro:
    type: dialog
    text: Под креслом 11В чёрная сумка, соседка с 12С говорит, что хозяина нет с Твери.
    passenger_says: Минут десять никого. Гляньте, что там?
    timer:
      seconds: 25
      on_expire:
        next: passengers_approach
        effects: {loyalty: -5, safety: -15}
        competencies: {safety: -2, escalation: -1}
        set_flags: {late_call: true}
        debrief:
          why: >-
            Пока вы решали, любопытные подошли к сумке сами. Карточка 41 требует действовать
            оперативно: не подпускать пассажиров к предмету и сразу сообщить начальнику поезда и
            ПТБ по поездной радиосвязи.
          better: >-
            В первые секунды: «Благодарю за бдительность, сейчас уточню, кому принадлежит вещь», и
            вызов ПТБ по радиосвязи.
          refs: [sit_41]
    options:
      - id: thank_and_radio
        text: >-
          «Понимаю Вас. Благодарю за бдительность, сейчас уточню, чья вещь», по радиосвязи вызываю
          ПТБ и начальника поезда.
        role_step: acknowledge
        escalation_target: ptb
        effects: {loyalty: 10, safety: 15}
        competencies: {empathy: 2, escalation: 2, safety: 1}
        set_flags: {ptb_called: true}
        next: owner_search
        debrief:
          verdict: best
          why: >-
            Реакция карточки 41 целиком: вещь не тронута, начальник поезда и ПТБ вызваны по
            поездной радиосвязи, а пассажирка услышала рекомендованную реплику и поняла, что
            поступила правильно.
          refs: [sit_41, model_role_steps]
      - id: radio_only
        text: По радиосвязи докладываю о сумке начальнику поезда и ПТБ, соседке молчу.
        escalation_target: ptb
        effects: {safety: 15}
        competencies: {escalation: 2, safety: 1}
        set_flags: {ptb_called: true}
        next: owner_search
        debrief:
          verdict: ok
          why: >-
            Канал и момент верные, ПТБ и начальник поезда знают о вещи с первой минуты. Но
            пассажирка, которая помогла бригаде, осталась без ответа и решила, что зря сказала.
          better: >-
            Сначала «Благодарю за бдительность, сейчас уточню, кому принадлежит вещь», затем
            вызов по радиосвязи.
          refs: [sit_41, model_role_steps]
      - id: thank_and_ask_around
        text: «Спасибо, что сказали, сейчас найду хозяина», спрашиваю по рядам, чья сумка.
        role_step: acknowledge
        effects: {loyalty: 10}
        competencies: {empathy: 2}
        set_flags: {asked_passengers: true, late_call: true}
        next: owner_search
        debrief:
          verdict: ok
          why: >-
            Опрос пассажиров и описание вещи это путь карточки 14, и он часто находит хозяина. Но
            карточка 41 ставит первым вызов ПТБ и начальника поезда: пока вы ходите по рядам, о
            сумке не знает никто, кроме вагона.
          better: >-
            Поблагодарить, вызвать ПТБ по радиосвязи и только потом спрашивать по рядам с описанием
            сумки.
          refs: [sit_14, sit_41]
      - id: open_bag_check
        text: Открываю молнию посмотреть, что внутри.
        effects: {loyalty: 5, safety: -40}
        competencies: {safety: -3, rules: -3}
        next: bag_opened
        debrief:
          verdict: bad
          why: >-
            Трогать и открывать вещь это первая ловушка карточки 41. Соседям спокойнее, а вы
            вскрыли бесхозный предмет до прихода тех, кто отвечает за безопасность.
          better: >-
            Не трогать, отвести людей, вызвать ПТБ и начальника поезда по радиосвязи.
          refs: [sit_41]

  passengers_approach:
    type: event
    text: >-
      Пока вы медлили, к сумке подошли двое: парень с места 11А наклонился к молнии, остальные
      достали телефоны.
    effects: {safety: -5}
    next: crowd_control

  crowd_control:
    type: dialog
    text: >-
      Парень с 11А уже тянет молнию, второй пассажир держит сумку за ручку. Вагон смотрит на вас.
    passenger_says: Ну откройте уже, посмотрим, и всё!
    options:
      - id: announce_and_radio
        text: >-
          Говорю «Уважаемые пассажиры, просьба не приближаться к предмету. Мы сейчас уточним
          принадлежность вещи», по радиосвязи вызываю ПТБ и начальника поезда, описываю сумку и
          спрашиваю, чья она.
        role_step: rule
        escalation_target: ptb
        effects: {loyalty: 5, safety: 15}
        competencies: {rules: 2, safety: 2, escalation: 2}
        set_flags: {ptb_called: true, asked_passengers: true}
        next: waiting
        debrief:
          verdict: best
          why: >-
            Объявление карточки 41 дословно останавливает любопытных, вызов по радиосвязи сделан,
            опрос с описанием, как советует карточка 14, идёт без подхода к вещи. Поздно, но верно.
          refs: [sit_41, sit_14]
      - id: push_people_rudely
        text: Отталкиваю парня от сумки и кричу «Отойди, сказал! Все по местам!».
        effects: {loyalty: -20, safety: 5}
        competencies: {empathy: -2, rules: -1}
        next: waiting
        debrief:
          verdict: bad
          why: >-
            От сумки его отогнали, но вагон видел, как проводник толкает пассажира. Нормы этики
            нарушены, паника выросла, а ПТБ и начальник поезда всё ещё не знают о вещи.
          better: >-
            Спокойное объявление «Просьба не приближаться к предмету» и вызов ПТБ по радиосвязи.
          refs: [sit_41, sto_011_10_1]
      - id: open_to_calm
        text: Открываю молнию сам, чтобы все увидели, что там ничего страшного, и успокоились.
        effects: {loyalty: 5, safety: -40}
        competencies: {safety: -3, rules: -3}
        next: bag_opened
        debrief:
          verdict: bad
          why: >-
            Вскрыть предмет ради спокойствия салона это ровно та ловушка, о которой предупреждает
            карточка 41. Пассажиры выдохнули, а бесхозную вещь открыл проводник.
          better: >-
            Не трогать вещь, отвести пассажиров и вызвать ПТБ с начальником поезда по радиосвязи.
          refs: [sit_41]

  bag_opened:
    type: event
    text: >-
      Молния расстёгнута: внутри ноутбук, термос и папка с бумагами. Соседи смеются, а начальник
      поезда, узнав от пассажиров, что проводник открыл бесхозную вещь, идёт к вам.
    effects: {safety: -10}
    next: ending_incident_touched

  owner_search:
    type: dialog
    text: >-
      Соседи оборачиваются на сумку, парень с места 11А привстал посмотреть, что внутри.
      Пассажирка с 12С ждёт, что вы скажете.
    passenger_says: Так что, никого? Может, спросить по вагону?
    options:
      - id: describe_keep_away
        text: >-
          Говорю «Уважаемые пассажиры, просьба не приближаться к предмету. Мы сейчас уточним
          принадлежность вещи. Чёрная спортивная сумка под креслом 11В, чья?».
        when: {flags_all: {ptb_called: true}}
        role_step: rule
        effects: {loyalty: 5, safety: 10}
        competencies: {rules: 2, safety: 2, solution: 1}
        set_flags: {asked_passengers: true}
        next: waiting
        debrief:
          verdict: best
          why: >-
            Объявление карточки 41 отводит людей от вещи, а описание и опрос по карточке 14 ищут
            хозяина, не сходя с места. Правило и решение в одной фразе, ПТБ уже в пути.
          refs: [sit_41, sit_14]
      - id: describe_and_radio
        text: >-
          Говорю соседям «Просьба не приближаться к предмету, мы сейчас уточним принадлежность
          вещи» и тут же по радиосвязи вызываю ПТБ и начальника поезда: чёрная сумка под креслом
          11В, хозяина нет с Твери.
        when: {flags_none: [ptb_called]}
        role_step: rule
        escalation_target: ptb
        effects: {loyalty: 5, safety: 10}
        competencies: {rules: 2, safety: 2, escalation: 1}
        set_flags: {asked_passengers: true, ptb_called: true}
        next: waiting
        debrief:
          verdict: best
          why: >-
            Объявление карточки 41 отводит людей от вещи, а вызов по радиосвязи наконец сделан:
            ПТБ и начальник поезда знают о сумке и её приметах. Лучший ход из этого положения,
            хотя первая минута уже потрачена на опрос вместо доклада.
          refs: [sit_41, sto_011_10_6]
      - id: ask_chief_pa
        text: >-
          По радиосвязи прошу начальника поезда объявить по громкой связи, что хозяина чёрной
          сумки ждут в вагоне 5, и направить ПТБ, если они ещё не вызваны.
        escalation_target: pa_announcement
        effects: {loyalty: 5, safety: 5}
        competencies: {solution: 1}
        set_flags: {asked_passengers: true, ptb_called: true}
        next: waiting
        debrief:
          verdict: ok
          why: >-
            Объявление по громкой связи делает начальник поезда, как в карточке 17, и хозяин в
            бистро его услышит. Но любопытных от сумки вы не отвели и вагон не опросили.
          better: >-
            Сначала «Просьба не приближаться к предмету» с описанием сумки соседям, потом просьба
            об объявлении.
          refs: [sit_17, sit_41]
      - id: walk_search_leave_bag
        text: Иду по вагону спрашивать про сумку, оставив её и любопытных без присмотра.
        effects: {loyalty: 5, safety: -20}
        competencies: {safety: -2, solution: -1}
        next: waiting
        debrief:
          verdict: bad
          why: >-
            Опрос по карточке 14 правильный, но вы ушли от вещи, и к ней подходят все, кому
            интересно. Карточка 41 велит не подпускать пассажиров к предмету.
          better: >-
            Описать сумку вслух и спросить, чья она, оставаясь рядом и не подпуская людей.
          refs: [sit_41, sit_14]
      - id: shout_across
        text: Кричу через весь вагон «Чья сумка под 11В?! Быстро забрали, а то полицию вызову!».
        effects: {loyalty: -10}
        competencies: {empathy: -2, rules: -1}
        next: waiting
        debrief:
          verdict: bad
          why: >-
            Паника в объявлении роняет доверие: вагон слышит угрозу, а не просьбу. Карточка 41
            даёт спокойную формулировку, и нормы этики требуют именно её.
          better: >-
            Спокойно: «Уважаемые пассажиры, просьба не приближаться к предмету. Мы сейчас
            уточним принадлежность вещи».
          refs: [sit_41, sto_011_10_1]

  waiting:
    type: dialog
    text: >-
      Сумка стоит на месте, ряды вокруг опустели. Пассажирка с 12С спрашивает, что дальше, а
      кто-то из соседей снимает сумку на телефон.
    passenger_says: Долго ещё? Может, пусть кто-нибудь её просто вынесет?
    options:
      - id: reseat_away_and_wait
        text: >-
          Говорю «Для безопасности прошу пересесть на свободные места подальше, сотрудники уже
          идут; к вещи не подходим», остаюсь у ряда.
        when: {flags_all: {ptb_called: true}}
        role_step: solution
        effects: {safety: 10}
        competencies: {solution: 2, safety: 1}
        next: ptb_arrives
        debrief:
          verdict: best
          why: >-
            Пассажиры отведены, вещь под присмотром, ПТБ и начальник поезда в пути: алгоритм
            карточки 41 выполняется до конца, а пассажирка знает, что происходит.
          refs: [sit_41, model_role_steps]
      - id: radio_ptb_now
        text: >-
          Говорю «Прошу отойти от вещи, сейчас подойдут специалисты» и по радиосвязи вызываю ПТБ
          и начальника поезда.
        when: {flags_none: [ptb_called]}
        escalation_target: ptb
        effects: {safety: 10}
        competencies: {escalation: 1, safety: 1}
        set_flags: {ptb_called: true}
        next: ptb_arrives
        debrief:
          verdict: ok
          why: >-
            Вызов сделан, но на третьем шаге: карточка 41 требует сообщить начальнику поезда и
            ПТБ оперативно, а минуты ушли на поиски и разговоры.
          better: >-
            Вызывать ПТБ по радиосвязи первым действием, до опроса и объявлений.
          refs: [sit_41]
      - id: owner_returns_report_chief
        text: >-
          Подходит мужчина из бистро: соседи сказали, что ищут хозяина. Прошу описать сумку и что
          внутри, к вещи не подпускаю, докладываю начальнику поезда, что владелец нашёлся:
          проверку решает он.
        when: {flags_all: {asked_passengers: true, ptb_called: true}}
        escalation_target: chief
        effects: {loyalty: 10, safety: 5}
        competencies: {solution: 2, safety: 1}
        next: ending_owner_found
        debrief:
          verdict: best
          why: >-
            Опрос с описанием сработал, как обещает карточка 14: хозяин узнал сумку и назвал
            содержимое до того, как к ней прикоснулись. Решение, нужна ли ещё проверка ПТБ,
            остаётся за начальником поезда, а не за проводником.
          refs: [sit_14, sit_41]
      - id: verify_owner_relieved
        text: >-
          Подходит мужчина из бистро, узнаёт сумку по описанию соседей. Прошу назвать содержимое,
          сверяю на слово и возвращаю вещь.
        when: {flags_all: {asked_passengers: true}, flags_none: [ptb_called]}
        effects: {loyalty: 10, safety: -10}
        competencies: {safety: -2, escalation: -2}
        next: ending_owner_found
        debrief:
          verdict: bad
          why: >-
            Хозяин нашёлся, и вагон выдохнул, но вы вернули бесхозную вещь по описанию на слово, а
            ПТБ и начальник поезда так и не узнали о ней: обошлось, а не сработало. Карточка 41 не
            оставляет проводнику права решать это одному.
          better: >-
            Даже когда хозяин нашёлся, сообщить начальнику поезда по радиосвязи: вещь простояла
            бесхозной десять минут, и проверку решает он.
          refs: [sit_41, sit_14]
      - id: move_to_vestibule
        text: Беру сумку и уношу в тамбур, там она никому не помешает и не будет пугать людей.
        effects: {safety: -30}
        competencies: {safety: -3, rules: -2}
        set_flags: {bag_moved: true}
        next: bag_in_vestibule
        debrief:
          verdict: bad
          why: >-
            Переносить вещь это ловушка карточки 41 наравне с открыванием: неизвестный предмет
            проехал через вагон в ваших руках и стоит теперь у дверей.
          better: >-
            Оставить сумку на месте, отвести пассажиров и ждать ПТБ рядом.
          refs: [sit_41]

  bag_in_vestibule:
    type: event
    text: >-
      Сумка стоит в тамбуре у двери, её задевают проходящие. Начальник поезда, увидев её, по
      радиосвязи направляет ПТБ к тамбуру и спрашивает, кто перенёс вещь.
    effects: {safety: -10}
    set_flags: {ptb_called: true}
    next: ptb_arrives

  ptb_arrives:
    type: dialog
    text: >-
      Сотрудники ПТБ и начальник поезда у сумки. Старший ПТБ обращается к пассажирке с 12С: когда
      она заметила сумку и видела ли, кто садился на 11В. Она растерялась и смотрит на вас.
    passenger_says: Я... с Твери никого не было. Я же не виновата, что сказала?
    options:
      - id: support_and_add_facts
        text: >-
          Говорю ей «Благодарю Вас за бдительность, Вы всё сделали правильно», а старшему ПТБ
          добавляю: место 11В пустует с Твери, к сумке никто не подходил и не трогал.
        when: {flags_none: [bag_moved, late_call]}
        role_step: assure
        effects: {loyalty: 10, safety: 10}
        competencies: {escalation: 1, empathy: 2, safety: 1}
        next: ending_ptb_cleared
        debrief:
          verdict: best
          why: >-
            Пассажирка услышала заверение из ролевой модели и не осталась одна перед старшим ПТБ,
            а он получил факты без оценок: с какого момента место пусто, кто подходил. Проверка
            идёт по фактам, помощница бригады знает, что поступила правильно.
          refs: [sit_41, model_role_steps]
      - id: support_and_add_facts_late
        text: >-
          Говорю ей «Благодарю Вас за бдительность, Вы поступили правильно», старшему ПТБ добавляю
          факты: место 11В пусто с Твери, к сумке никто не подходил, а доложил о ней я не сразу.
        when: {flags_all: {late_call: true}, flags_none: [bag_moved]}
        role_step: assure
        effects: {loyalty: 10, safety: 10}
        competencies: {escalation: 1, empathy: 2, safety: 1}
        next: ending_ptb_cleared_late
        debrief:
          verdict: best
          why: >-
            Заверение сказано, факты переданы, и честно названо главное: доклад бригаде ушёл не в
            первую минуту. Пассажирка знает, что поступила правильно, а вопрос о потерянных
            минутах начальник поезда задаст уже вам.
          refs: [sit_41, model_role_steps]
      - id: add_facts_only
        text: >-
          Отвечаю старшему ПТБ вместо неё: место 11В пусто с Твери, никто не подходил и не трогал.
          Пассажирке ничего не говорю.
        when: {flags_none: [bag_moved]}
        effects: {safety: 10}
        competencies: {escalation: 1}
        next: ending_ptb_cleared
        debrief:
          verdict: ok
          why: >-
            Факты переданы, дальше работают ПТБ. Но вы ответили за пассажирку, не сказав ей ни
            слова: она помогла бригаде и так и не услышала, что сделала всё правильно.
          better: >-
            Сначала ей: «Благодарю Вас за бдительность, Вы всё сделали правильно», затем факты
            старшему ПТБ.
          refs: [sit_41, model_role_steps]
      - id: confess_moved
        text: >-
          Докладываю честно: сумку в тамбур перенёс я, до этого она стояла под 11В, никто её не
          открывал.
        when: {flags_all: {bag_moved: true}}
        effects: {loyalty: -5, safety: 5}
        competencies: {rules: 2, escalation: 1}
        next: ending_ptb_remark
        debrief:
          verdict: best
          why: >-
            После ошибки единственно верный ход: ПТБ должны знать, где вещь стояла и кто её
            трогал. Замечание вы получите, зато проверка идёт по фактам.
          refs: [sit_41, sto_011_10_6]
      - id: hide_moved
        text: Говорю, что сумку нашли уже в тамбуре, а кто её туда поставил, не знаю.
        when: {flags_all: {bag_moved: true}}
        effects: {safety: -20}
        competencies: {rules: -3, safety: -2}
        next: ending_incident_touched
        debrief:
          verdict: bad
          why: >-
            ПТБ работают по неверным сведениям, а соседи видели, кто нёс сумку. Скрытое
            нарушение карточки 41 становится инцидентом с разбором.
          better: >-
            Сразу сказать, что вещь перенесли вы, откуда и когда.
          refs: [sit_41]
      - id: leave_to_ptb_go_work
        text: >-
          Оставляю её отвечать старшему ПТБ одну и иду проверять билеты у севших в Твери, ни слова
          ни ей, ни сотрудникам.
        effects: {loyalty: -10, safety: -5}
        competencies: {escalation: -1, empathy: -1}
        next: ending_ptb_cleared
        debrief:
          verdict: bad
          why: >-
            С какого момента место пусто и кто подходил к сумке, знаете вы, а не пассажирка: ПТБ
            теперь собирают это по вагону, а она осталась одна перед вопросами, на которые не
            должна отвечать.
          better: >-
            Коротко доложить факты старшему ПТБ и поблагодарить пассажирку за бдительность.
          refs: [sit_41, model_role_steps]

  ending_owner_found:
    type: ending
    title: Хозяин нашёлся
    text: >-
      Мужчина с места 11В вернулся из бистро и назвал содержимое сумки до того, как к ней кто-то
      прикоснулся: ноутбук, термос, папка. Ряды вокруг снова заняты, пассажирка с 12С благодарит
      вас за спокойствие.
    debrief:
      summary: >-
        Хозяин найден опросом и описанием, как советуют карточки 14 и 17, а к вещи никто не
        подходил. Исход зависит от того, знали ли начальник поезда и ПТБ о сумке с первой минуты.
      refs: [sit_41, sit_14, sit_17]

  ending_ptb_cleared:
    type: ending
    title: ПТБ проверили сумку
    text: >-
      Сотрудники ПТБ осмотрели сумку: ноутбук и термос. Хозяин нашёлся в бистро и получил от
      начальника поезда замечание за оставленную вещь. Вагон вернулся к своим делам.
    debrief:
      summary: >-
        Вещь не тронута, пассажиры отведены, ПТБ и начальник поезда вызваны с первой минуты и
        получили факты: алгоритм карточки 41 выполнен целиком, а шкалы показывают, что стоили
        слова пассажирке и любопытным соседям.
      refs: [sit_41, sto_011_10_6]

  ending_ptb_cleared_late:
    type: ending
    title: Доклад с опозданием
    text: >-
      ПТБ проверили сумку и вернули хозяину из бистро. Начальник поезда спросил, почему о вещи
      доложили через десять минут после того, как о ней сказала пассажирка.
    forced_outcome: acceptable
    debrief:
      summary: >-
        Сумка оказалась безобидной, но карточка 41 ставит доклад начальнику поезда и ПТБ по
        радиосвязи первым действием: пока проводник искал хозяина сам, о бесхозной вещи знал
        только вагон. Образцовым такой рейс не станет.
      refs: [sit_41, sto_011_10_6]

  ending_ptb_remark:
    type: ending
    title: Замечание ПТБ
    text: >-
      ПТБ проверили сумку в тамбуре и вернули владельцу. Старший записал, что проводник перенёс
      бесхозную вещь, а начальник поезда пообещал разбор в депо; честный доклад он учёл.
    debrief:
      summary: >-
        Вещь переносили, это нарушение карточки 41, но признание уберегло от худшего: ПТБ
        работали, зная факты. Образцовым такой рейс уже не станет.
      refs: [sit_41, sto_011_10_6]

  ending_incident_touched:
    type: ending
    title: Вещь вскрыта
    text: >-
      ПТБ узнали, что бесхозную вещь трогал проводник: открыл или перенёс и умолчал. Начальник
      поезда составил рапорт, случай уходит в депо, вас ждёт разбор.
    forced_outcome: incident
    debrief:
      summary: >-
        Открыть, перенести и скрыть это ловушки карточки 41: даже если внутри ноутбук, инцидент
        уже состоялся. Правило одно: не трогать, отвести людей, вызвать ПТБ и начальника поезда.
      refs: [sit_41]
