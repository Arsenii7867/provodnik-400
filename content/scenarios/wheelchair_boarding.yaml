id: wheelchair_boarding
version: 1
title: Посадка на кресле-коляске
summary: >-
  На станции Тверь при стоянке в одну минуту в вагон стандарт-класса садится пассажир на
  кресле-коляске с сопровождающей: подъёмное устройство, выделенное место, вещи, высадка в Москве
  и обед на месте.
source_situations: [14, 35, 3]
difficulty: 3
critical: false
tags: [маломобильные пассажиры, посадка, стоянка, стандарт]
competencies: [inclusion, safety, solution, empathy, rules, escalation]
role_model: true
estimated_minutes: 5
context:
  service_class: standard
  segment: станция Тверь, стоянка одна минута, дальше участок Тверь, Москва
  next_station_minutes: 40
  time_of_day: день
  passenger:
    label: мужчина лет пятидесяти на кресле-коляске, с ним сопровождающая
    state: ждёт у двери вагона на платформе, служба сопровождения вокзала уже ушла
  crew_available: [chief, engineer]
  loyalty_of: пассажир на кресле-коляске и его сопровождающая
start:
  node: arrival
  loyalty: 65
  safety: 70
  flags: {}
# у сценария много верных ходов подряд, поэтому образцовый исход закрыт для путей с ловушкой
# порогами выше умолчаний rules.yaml
outcome_rules:
  exemplary_if: {safety_min: 95, loyalty_min: 95}
nodes:
  arrival:
    type: dialog
    text: >-
      Поезд остановился в Твери, стоянка одна минута. У двери вашего вагона мужчина на
      кресле-коляске и женщина с двумя сумками; сотрудник вокзала, который их привёл, уже ушёл.
    passenger_says: Здравствуйте. Нам в этот вагон, место для коляски. Мы успеем?
    options:
      - id: greet_ask_preference
        text: >-
          Говорю «Здравствуйте, я проводник этого вагона, подъёмник подаю сейчас. Я Вас понимаю,
          успеем. Скажите, как Вам удобнее: остаться в кресле или пересесть?».
        role_step: acknowledge
        effects: {loyalty: 5, safety: 5}
        competencies: {inclusion: 2, empathy: 2}
        next: lift
        debrief:
          verdict: best
          why: >-
            Обращение к самому пассажиру, а не к сопровождающей, и вопрос о том, как ему удобнее:
            СТО 03.014 требует получать информацию от маломобильного пассажира и обеспечивать
            коммуникацию на всех этапах. Тревога снята первой фразой.
          refs: [sto_014_8_9, sto_014_7_1, model_role_steps]
      - id: talk_only_to_companion
        text: >-
          Обращаюсь только к сопровождающей: «Он в кресле поедет или пересаживать будем? Сумки
          ваши?».
        effects: {loyalty: -15}
        competencies: {inclusion: -2, empathy: -1}
        next: lift
        debrief:
          verdict: bad
          why: >-
            Пассажир слышит, что о нём говорят в третьем лице. СТО 03.014 требует коммуникации с
            самим маломобильным пассажиром, а сопровождающий это помощник, а не переводчик.
          better: >-
            Поздороваться с пассажиром и спросить у него, как ему удобнее садиться и ехать.
          refs: [sto_014_7_1, sto_014_8_9]
      - id: lift_manually_with_helper
        text: >-
          Чтобы не терять минуту, прошу сопровождающую и мужчину с платформы помочь поднять
          кресло в вагон на руках.
        effects: {loyalty: 5, safety: -20}
        competencies: {safety: -3, inclusion: -1}
        next: boarding_manual
        debrief:
          verdict: bad
          why: >-
            Для посадки предусмотрено подъёмное устройство по требованиям ГОСТ, а кресло с
            человеком на руках через зазор это риск падения. Пассажиру кажется, что вы спешите
            ради него, но безопасность обрушилась.
          better: >-
            Подать подъёмное устройство и провести посадку по правилам, стоянка это позволяет.
          refs: [sto_014_6_1, sto_011_8_10]

  lift:
    type: dialog
    text: >-
      Подъёмное устройство выдвинуто, пассажир на его платформе, сопровождающая с сумками рядом.
      На табло стоянки остаётся полминуты.
    passenger_says: Я сам справлюсь, только скажите, за что держаться.
    timer:
      seconds: 60
      on_expire:
        next: doors_closing
        effects: {loyalty: -5, safety: -10}
        competencies: {safety: -1, solution: -1}
        debrief:
          why: >-
            Стоянка одна минута, о чём предупреждает карточка 35, а посадка через подъёмник не
            завершена. Каждая секунда раздумий на платформе устройства это пассажир между вагоном
            и перроном при объявленном отправлении.
          better: >-
            Работать с подъёмником сразу и по инструкции: тормоз кресла, ограждение, поручни,
            подъём.
          refs: [sit_35, sto_011_4_6]
    options:
      - id: operate_lift_by_rules
        text: >-
          «Обращаю Ваше внимание: держитесь за поручни, кресло на тормоз, закрываю ограждение и
          поднимаю». Всё по инструкции.
        role_step: rule
        effects: {loyalty: 5, safety: 15}
        competencies: {rules: 2, safety: 2, inclusion: 1}
        next: seating
        debrief:
          verdict: best
          why: >-
            Безопасная эксплуатация подъёмного устройства это навык персонала по СТО 03.014, а
            пассажир заранее знает, что произойдёт и за что держаться. Посадка укладывается в
            стоянку.
          refs: [sto_014_8_9, sto_014_6_1]
      - id: rush_skip_belt
        text: >-
          Поднимаю платформу сразу, не ставя кресло на тормоз и не закрывая ограждение: счёт идёт
          на секунды.
        effects: {safety: -15}
        competencies: {safety: -2, rules: -1}
        next: seating
        debrief:
          verdict: bad
          why: >-
            Кресло без тормоза на поднимающейся платформе откатывается к краю. Секунды выиграны за
            счёт того, ради чего подъёмное устройство и предусмотрено.
          better: >-
            Тормоз, ограждение, поручни, подъём: инструкция занимает те же секунды.
          refs: [sto_014_6_1, sto_014_8_9]
      - id: call_engineer_for_lift
        text: >-
          По радиосвязи вызываю бортинженера: пусть подъёмником занимается техник, а я пока
          проверю билеты.
        escalation_target: engineer
        effects: {loyalty: -10, safety: 5}
        competencies: {solution: -1, escalation: -1}
        delayed:
          - steps: 2
            effects: {loyalty: -5}
            text: >-
              Пассажир запомнил, что на платформе он ждал техника, пока проводник смотрел билеты.
        next: seating
        debrief:
          verdict: bad
          why: >-
            Подъёмник исправен, и пользоваться им обязан персонал, обслуживающий маломобильных
            пассажиров. Бортинженер отвечает за технику, а не за посадку, и его ожидание съедает
            стоянку.
          better: >-
            Провести посадку самому по инструкции, бортинженера звать только при неисправности
            устройства.
          refs: [sto_014_8_9, sto_011_10_6]

  doors_closing:
    type: dialog
    text: >-
      Минута вышла: по громкой связи объявили отправление, начальник поезда вызывает вас по
      радиосвязи. Пассажир ещё на платформе подъёмника, сопровождающая на перроне.
    passenger_says: Мы что, не успели? Не бросайте нас так!
    options:
      - id: report_hold_departure
        text: >-
          Отвечаю начальнику поезда: «Посадка пассажира на кресле-коляске не завершена, прошу
          задержать отправление на минуту», и завершаю подъём по инструкции.
        escalation_target: chief
        effects: {loyalty: 5, safety: 10}
        competencies: {escalation: 2, safety: 1, inclusion: 1}
        next: seating
        debrief:
          verdict: best
          why: >-
            Посадка идёт в присутствии и под контролем персонала, прервать её нельзя, а решение о
            задержке принимает начальник поезда. Карточка 3 запрещает держать поезд ради
            опоздавшего, но здесь пассажир уже на подъёмнике.
          refs: [sto_011_8_10, sit_3, sto_014_8_1]
      - id: pull_over_gap
        text: >-
          Складываю подъёмник и с сопровождающей затаскиваем кресло через зазор на руках, пока
          двери не закрылись.
        effects: {loyalty: 5, safety: -30}
        competencies: {safety: -3, inclusion: -1}
        next: seating
        debrief:
          verdict: bad
          why: >-
            Кресло с человеком через зазор между перроном и вагоном это падение на рельсы одним
            неверным движением. Пассажиру кажется, что его спасают, а риск максимальный.
          better: >-
            Доложить начальнику поезда, что посадка не завершена, и закончить подъём устройством.
          refs: [sto_014_6_1, sto_011_8_10]
      - id: leave_on_platform
        text: >-
          Говорю «Не успеваем, поедете следующим», опускаю платформу и убираю подъёмник.
        effects: {loyalty: -30}
        competencies: {inclusion: -3, empathy: -2}
        next: ending_left_behind
        debrief:
          verdict: bad
          why: >-
            Карточка 3 говорит об опоздавшем, а не о пассажире, чья посадка уже началась под
            контролем персонала. Маломобильному пассажиру обязаны помочь получить услугу, а не
            снять его с подъёмника.
          better: >-
            Доложить начальнику поезда и завершить посадку, задержку решает он.
          refs: [sit_3, sto_014_8_1, sto_011_8_10]

  boarding_manual:
    type: event
    text: >-
      Кресло с пассажиром подняли на руках через зазор между перроном и вагоном; на подножке оно
      накренилось, сопровождающая вскрикнула, пассажир ударился локтем о поручень.
    effects: {safety: -10}
    next: seating

  seating:
    type: dialog
    text: >-
      Пассажир в тамбуре, поезд отправляется. Выделенное место для кресла-коляски в середине
      вагона, рядом место для сопровождающего.
    passenger_says: Мне удобнее пересесть в кресло, спина устаёт. А коляску куда?
    options:
      - id: seat_and_fold_wheelchair
        text: >-
          Говорю «Конечно, помогу пересесть. Коляску сложим и поставим на место для её хранения,
          оно рядом», сопровождающую сажаю на соседнее место.
        role_step: solution
        effects: {loyalty: 5, safety: 10}
        competencies: {solution: 2, inclusion: 2, safety: 1}
        next: luggage
        debrief:
          verdict: best
          why: >-
            В стандарт-классе маломобильный пассажир едет на пассажирском месте, а для сложенной
            коляски и для сопровождающего предусмотрены свои места. Проход свободен, пассажир сидит
            так, как ему удобно.
          refs: [sto_014_6_2, sto_014_6_3]
      - id: leave_wheelchair_in_aisle
        text: >-
          Помогаю пересесть, коляску оставляю разложенной в проходе у кресла, чтобы была под рукой.
        effects: {loyalty: 5, safety: -20}
        competencies: {safety: -2, rules: -1}
        set_flags: {wheelchair_in_aisle: true}
        next: luggage
        debrief:
          verdict: bad
          why: >-
            Коляска в проходе перекрывает путь пассажирам и тележке, а место для её хранения в
            сложенном виде предусмотрено стандартом. Пассажиру удобно, вагону опасно.
          better: >-
            Сложить коляску и убрать на место хранения, объяснив, что она рядом и её вернут по
            просьбе.
          refs: [sto_014_6_3, sit_14]
      - id: insist_stay_in_wheelchair
        text: Говорю «Место для коляски выделенное, в ней и поедете, так положено».
        effects: {loyalty: -10}
        competencies: {inclusion: -2, empathy: -1}
        next: luggage
        debrief:
          verdict: bad
          why: >-
            Решение за пассажира вместо вопроса, как ему удобнее. Стандарт даёт ему право ехать на
            пассажирском месте, а «так положено» без объяснения это отказ без причины.
          better: >-
            Спросить, как удобнее, помочь пересесть, коляску сложить на место хранения.
          refs: [sto_014_6_2, sto_014_8_9, sto_011_10_3]
      - id: companion_seat_far
        text: >-
          Пересаживаю пассажира, а сопровождающую отправляю на свободное место через три ряда:
          соседнее занято, и просить пересесть неловко.
        effects: {loyalty: -15, safety: -5}
        competencies: {inclusion: -2, solution: -1}
        next: luggage
        debrief:
          verdict: bad
          why: >-
            Место для сопровождающего рядом с маломобильным пассажиром предусмотрено стандартом:
            занявшего его пассажира просят пересесть с извинением, а не разлучают пару на весь
            путь.
          better: >-
            Вежливо попросить соседа пересесть на другое свободное место и посадить сопровождающую
            рядом.
          refs: [sto_014_6_3, sto_011_10_3]

  luggage:
    type: dialog
    text: >-
      Две сумки и пакет стоят в проходе у кресла, сопровождающая ищет, куда их деть. По проходу
      идёт пассажирка с чемоданом.
    passenger_says: Куда нам это всё? Полка высоко, мне не дотянуться.
    options:
      - id: help_place_luggage
        text: >-
          Говорю «Позвольте, я помогу разместить вещи: сумки на полку, пакет в отсек у места.
          Благодарю Вас за ожидание», убираю вещи и освобождаю проход.
        role_step: assure
        effects: {loyalty: 5, safety: 5}
        competencies: {inclusion: 2, solution: 1, safety: 1, empathy: 1}
        next: destination
        debrief:
          verdict: best
          why: >-
            Персонал поезда помогает маломобильным пассажирам разместиться с вещами, а у
            выделенных мест есть доступные места для ручной клади. Реплика карточки 14 и
            заверение из ролевой модели в одной фразе.
          refs: [sto_014_8_7, sto_014_6_4, sit_14, model_role_steps]
      - id: move_wheelchair_now
        text: >-
          Спохватываюсь: складываю коляску и уношу на место хранения, потом помогаю с сумками.
        when: {flags_all: {wheelchair_in_aisle: true}}
        effects: {loyalty: 5, safety: 10}
        competencies: {safety: 2, inclusion: 1}
        set_flags: {wheelchair_in_aisle: false}
        next: destination
        debrief:
          verdict: ok
          why: >-
            Проход освобождён, коляска на своём месте, вещи убраны. Но несколько минут коляска
            стояла в проходе, и пассажирка с чемоданом уже обходила её.
          better: >-
            Складывать коляску на место хранения сразу при пересадке.
          refs: [sto_014_6_3, sit_14]
      - id: luggage_in_aisle_ok
        text: >-
          Ставлю сумки в проход у кресла, чтобы были под рукой: доставать с полки им неудобно.
        effects: {loyalty: 5, safety: -20}
        competencies: {safety: -2, rules: -1}
        next: destination
        debrief:
          verdict: bad
          why: >-
            Ловушка карточки 14: проход должен оставаться свободным, а вещи можно разместить в
            доступном отсеке у выделенного места, не на полке. Пассажирам удобно, тележке и
            соседям нет.
          better: >-
            «В целях безопасности проход должен оставаться свободным. Позвольте, я помогу
            разместить вещи» и указать отсек у места.
          refs: [sit_14, sto_014_6_4, sto_013_7_1_4]

  destination:
    type: dialog
    text: >-
      До Москвы сорок минут. Пассажир спрашивает, как будет устроена высадка: подъёмник, кто
      встретит, как добраться до такси через вокзал.
    passenger_says: В Москве нас кто-нибудь встретит? Через весь вокзал я не доеду.
    options:
      - id: inform_chief_destination_assist
        text: >-
          Говорю «Информирую Вас: высадка через подъёмник, на вокзале есть служба сопровождения. Я
          передам начальнику поезда, чтобы Вас встретили с креслом», передаю по радиосвязи.
        role_step: rule
        escalation_target: chief
        effects: {loyalty: 5, safety: 10}
        competencies: {inclusion: 2, escalation: 1, rules: 1, solution: 1}
        next: meal
        debrief:
          verdict: best
          why: >-
            Персонал строит маршрут сопровождения по схеме доступных путей вокзала, а
            сопровождение по вокзалу оформляется как услуга; начальник поезда передаёт заявку
            заранее. Пассажир знает, что будет на конечной.
          refs: [sto_014_8_9, sto_014_8_4, sto_014_8_1]
      - id: promise_to_clarify
        text: Говорю «Я уточню у начальника поезда и вернусь к Вам» и иду дальше по вагону.
        role_step: solution
        effects: {loyalty: 5}
        competencies: {solution: 1}
        delayed:
          - steps: 2
            effects: {loyalty: -15}
            text: >-
              Вы не вернулись с ответом: пассажир спросил у соседа, где на вокзале искать службу
              сопровождения.
            unless_flags: {returned_with_answer: true}
        next: meal
        debrief:
          verdict: ok
          why: >-
            Фраза из ролевой модели уместна, если вы не знаете порядка встречи. Но обещание
            вернуться обязывает: без ответа оно обернётся потерей доверия.
          better: >-
            Сразу сказать, что высадка через подъёмник, а сопровождение по вокзалу передаст
            начальник поезда.
          refs: [model_role_steps, sto_014_8_4]
      - id: assume_companion_handles
        text: Говорю «С Вами сопровождающая, она на месте разберётся» и ухожу.
        effects: {loyalty: -15, safety: -10}
        competencies: {inclusion: -2, empathy: -1}
        next: meal
        debrief:
          verdict: bad
          why: >-
            Помощь в получении услуг маломобильным пассажирам обеспечивает персонал, а не
            сопровождающий. Без заявки на встречу пассажир на кресле-коляске останется на
            платформе без подъёмника и сопровождения.
          better: >-
            Объяснить порядок высадки и передать начальнику поезда, чтобы на конечной встретили.
          refs: [sto_014_8_1, sto_014_7_1]

  meal:
    type: dialog
    text: >-
      Соседи достали еду, из бистро идёт запах кофе. Пассажир спрашивает, как быть с обедом:
      вагон-бистро через четыре вагона.
    passenger_says: Я до бистро не доеду, а есть хочется. Как быть?
    options:
      - id: offer_meal_to_seat
        text: >-
          Говорю «Для Вас заказ из бистро принесут на место: скажите, что выбрать, я передам и
          вернусь с обедом».
        role_step: solution
        effects: {loyalty: 10}
        competencies: {solution: 2, inclusion: 2, rules: 1}
        next: ending_full_care
        debrief:
          verdict: best
          why: >-
            В стандарт-классе питание на место не носят, но для маломобильного пассажира,
            которому трудно передвигаться, заказ на место обязан быть доступен. Услуги по классу
            билета для него не сокращаются.
          refs: [sto_014_8_8, sto_011_7_1_4]
      - id: return_with_answer_and_meal
        text: >-
          Говорю «Благодарю Вас за ожидание: начальник поезда подтвердил, в Москве встретит служба
          сопровождения с креслом. И обед из бистро принесём на место».
        when: {chosen_any: [promise_to_clarify]}
        role_step: assure
        effects: {loyalty: 10, safety: 5}
        competencies: {solution: 2, inclusion: 2, escalation: 1}
        set_flags: {returned_with_answer: true}
        next: ending_full_care
        debrief:
          verdict: best
          why: >-
            Обещание выполнено: ответ получен через начальника поезда и принесён пассажиру вместе
            с решением про обед. Заверение из ролевой модели закрывает оба вопроса.
          refs: [model_role_steps, sto_014_8_8, sto_014_8_4]
      - id: train_wheelchair_to_bistro
        text: >-
          Предлагаю довезти его в бистро на кресле-коляске поезда через четыре вагона на ходу.
        effects: {loyalty: 5, safety: -10}
        competencies: {safety: -2, solution: -1}
        next: ending_full_care
        debrief:
          verdict: bad
          why: >-
            Кресло-коляска поезда предусмотрена для услуг, которые нельзя оказать на месте, а
            обед на место принести можно. Четыре межвагонных перехода на ходу это риск без нужды.
          better: >-
            Принять заказ и принести обед из бистро на место.
          refs: [sto_014_6_5, sto_014_8_8]
      - id: say_no_food_in_standard
        text: Говорю «В стандарте питание на место не носят, бистро в седьмом вагоне».
        effects: {loyalty: -10}
        competencies: {rules: -2, inclusion: -2}
        next: ending_formal
        debrief:
          verdict: bad
          why: >-
            Правило класса названо, а требование СТО 03.014 забыто: маломобильному пассажиру
            заказ питания на место должен быть доступен в любом классе. Отказ без альтернативы.
          better: >-
            Предложить заказ из бистро на место и принять его.
          refs: [sto_014_8_8, sto_011_10_3]
      - id: ignore_request_busy
        text: >-
          Говорю «Позже, сейчас некогда» и ухожу; коляска так и стоит в проходе, пассажирка с
          чемоданом задевает её.
        when: {flags_all: {wheelchair_in_aisle: true}}
        effects: {safety: -20}
        competencies: {safety: -2, empathy: -1}
        next: ending_ptb_remark
        debrief:
          verdict: bad
          why: >-
            Просьба осталась без ответа, а перекрытый проход, о котором вы забыли ещё при
            посадке, стал причиной падения. Карточка 14 требует держать проход свободным.
          better: >-
            Убрать коляску на место хранения и предложить обед на место.
          refs: [sit_14, sto_014_6_3, sto_011_10_3]

  ending_full_care:
    type: ending
    title: Дорога без барьеров
    text: >-
      В Москве пассажира встретили на платформе с креслом-коляской вокзала, подъёмник подали до
      выхода остальных пассажиров. Сопровождающая на прощание спросила номер вагона.
    debrief:
      summary: >-
        Посадка через подъёмное устройство, места для коляски и сопровождающего, вещи размещены,
        высадка согласована с начальником поезда, обед доставлен на место. Исход зависит от того,
        не было ли по пути коляски и сумок в проходе и обещаний без ответа.
      refs: [sto_014_8_1, sto_014_8_9, sit_14]

  ending_formal:
    type: ending
    title: По инструкции, без участия
    text: >-
      Пассажир доехал голодным, на конечной ждал подъёмник дольше остальных и добирался через
      вокзал своими силами. Сопровождающая написала обращение: проводник не отказывал грубо, но
      и не помогал.
    debrief:
      summary: >-
        Отказ без альтернативы стоит лояльности: СТО 03.014 требует помощи в получении услуг и
        заказа питания на место для того, кому трудно передвигаться, а класс билета эту помощь не
        отменяет.
      refs: [sto_014_8_8, sto_014_8_1, sto_011_10_3]

  ending_left_behind:
    type: ending
    title: Остались на платформе
    text: >-
      Поезд ушёл, пассажир с сопровождающей остались на перроне Твери. Начальник поезда узнал об
      этом от дежурного по станции и составил рапорт: посадка маломобильного пассажира была
      начата и прервана проводником.
    forced_outcome: incident
    debrief:
      summary: >-
        Посадка идёт под контролем персонала и не прерывается по секундомеру: о задержке решает
        начальник поезда. Карточка 3 про опоздавшего к посадке не относится к пассажиру на
        подъёмнике.
      refs: [sto_011_8_10, sto_014_8_1, sit_3]

  ending_ptb_remark:
    type: ending
    title: Проход перекрыт
    text: >-
      Пассажирка с чемоданом зацепилась за коляску в проходе и упала, ударившись о подлокотник.
      Начальник поезда оформил травму, сотрудники ПТБ записали, что проход был перекрыт с самой
      посадки. Вас ждёт разбор.
    forced_outcome: incident
    debrief:
      summary: >-
        Коляска в проходе это нарушение стандарта и карточки 14: место для её хранения в
        сложенном виде предусмотрено, а проход должен оставаться свободным для пассажиров и
        тележки.
      refs: [sto_014_6_3, sit_14, sto_013_7_1_4]
