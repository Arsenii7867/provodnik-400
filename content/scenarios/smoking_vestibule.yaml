id: smoking_vestibule
version: 1
title: Дым в тамбуре
summary: >-
  В тамбуре вагона стандарт-класса пассажир курит электронную сигарету с банкой пива в руке;
  до Твери полчаса, начальник поезда и сотрудники ПТБ в головном вагоне.
source_situations: [20, 21]
difficulty: 2
critical: true
tags: [курение, алкоголь, безопасность, стандарт]
competencies: [safety, escalation, rules, empathy, solution]
role_model: true
estimated_minutes: 3
context:
  service_class: standard
  segment: участок Санкт-Петербург, Тверь, через сорок минут после отправления
  next_station_minutes: 30
  time_of_day: вечер
  passenger:
    label: мужчина лет тридцати пяти у двери тамбура вагона 7
    state: курит, в руке банка пива, смотрит с вызовом
  crew_available: [chief, ptb, engineer]
  escalation_expected_by_step: 2
  loyalty_of: пассажир в тамбуре и соседи по вагону, к которым тянет дым
start:
  node: intro
  loyalty: 55
  safety: 55
  flags: {}
# образцовый исход закрыт для путей с ловушками карточек 20 и 21: порог выше умолчаний rules.yaml
outcome_rules:
  exemplary_if: {safety_min: 85, loyalty_min: 80}
nodes:
  intro:
    type: dialog
    text: >-
      Из тамбура вагона 7 тянет дымом, пассажирка с места 3А морщится и показывает на дверь. В
      тамбуре у окна стоит мужчина, выдыхает клубы пара и держит банку пива.
    passenger_says: Я быстро, две затяжки. Вам жалко, что ли?
    options:
      - id: acknowledge_ask_device
        text: >-
          Говорю «Понимаю, дорога долгая. Но курить в поезде нельзя, электронные тоже», спрашиваю,
          что за устройство, и вижу, куда он его прячет.
        role_step: acknowledge
        effects: {loyalty: 5, safety: 5}
        competencies: {empathy: 2, rules: 2, safety: 2}
        set_flags: {device_checked: true}
        next: refuses
        debrief:
          verdict: best
          why: >-
            Признание из ролевой модели снимает вызов, правило названо сразу и целиком: карточка 20
            относит электронные сигареты к тому же запрету. Вы знаете, что это за устройство и где
            оно, а это факты для начальника поезда и бортинженера.
          refs: [sit_20, model_role_steps]
      - id: rule_stop_safety
        text: >-
          Говорю «Прошу Вас прекратить курение. В поезде это не допускается, дым угрожает
          безопасности движения».
        role_step: rule
        effects: {loyalty: 5, safety: 15}
        competencies: {rules: 2, safety: 2}
        next: refuses
        debrief:
          verdict: ok
          why: >-
            Реплика карточки 20 дословно и с акцентом на безопасность движения, как карточка
            требует. Но пассажир не услышал, что его поняли: правило без признания он воспринимает
            как придирку и продолжает.
          better: >-
            Начать с «Понимаю, дорога долгая», затем правило и вопрос, что именно он курит.
          refs: [sit_20, model_role_steps]
      - id: harsh_demand
        text: Резко, чтобы слышал весь вагон, говорю «Немедленно потушите, здесь вам не курилка».
        effects: {loyalty: -15}
        competencies: {empathy: -2, rules: -1}
        delayed:
          - steps: 2
            effects: {loyalty: -10}
            text: >-
              Соседи по вагону запомнили ваш тон и пожаловались начальнику поезда на грубость
              проводника.
            unless_flags: {apologized: true}
        next: refuses_angry
        debrief:
          verdict: bad
          why: >-
            Резкое требование без объяснения это ловушка карточки 20: пассажир отвечает тем же, а
            соседи слышат не правило, а крик. Нормы этики поведения персонала нарушены, курение
            продолжается.
          better: >-
            Спокойно: «Прошу Вас прекратить курение. В поезде это не допускается, дым угрожает
            безопасности движения».
          refs: [sit_20, sto_011_10_1]
      - id: ignore_it
        text: >-
          Делаю вид, что не заметил: докурит и уйдёт, а скандал в конце смены мне не нужен.
        effects: {loyalty: 5, safety: -25}
        competencies: {safety: -3, rules: -2}
        next: detector_alarm
        debrief:
          verdict: bad
          why: >-
            Пассажиру в тамбуре удобно, соседям по вагону нет, а карточка 20 требует любым доступным
            способом не допускать задымления на борту. Через минуту дым будет в салоне.
          better: >-
            Подойти сразу и вежливо прекратить нарушение с акцентом на угрозу безопасности движения.
          refs: [sit_20, sit_21]

  refuses:
    type: dialog
    text: Он выдыхает пар вам в лицо и не убирает устройство.
    passenger_says: Это электронная, это пар, а не дым. Тут все так делают, что вы ко мне пристали?
    timer:
      seconds: 15
      on_expire:
        next: smoke_spreads
        effects: {loyalty: -5, safety: -20}
        competencies: {safety: -2, escalation: -1}
        debrief:
          why: >-
            Вы искали слова, а он докуривал. Карточка 20 не оставляет паузы: при отказе вызывают
            начальника поезда или ПТБ любым оперативным способом, пока дым не пошёл в салон.
          better: >-
            Сразу сказать «Вынужден пригласить начальника поезда» и вызвать его и ПТБ по радиосвязи.
          refs: [sit_20]
    options:
      - id: rule_and_call_ptb
        text: >-
          «Обращаю Ваше внимание: дым угрожает безопасности движения. Приглашу начальника поезда»,
          вызываю ПТБ.
        role_step: rule
        escalation_target: ptb
        effects: {loyalty: 5, safety: 15}
        competencies: {rules: 2, safety: 2, escalation: 2}
        next: calmed_down
        debrief:
          verdict: best
          why: >-
            Обе реплики карточки 20 в одной фразе: правило с акцентом на безопасность движения и
            приглашение начальника поезда, а ПТБ вызваны по радиосвязи, как требует совет карточки.
            Услышав про ПТБ, пассажир убирает устройство сам.
          refs: [sit_20, sto_011_10_6]
      - id: explain_only
        text: >-
          «Обращаю Ваше внимание: дым угрожает безопасности движения». Никого не вызываю.
        role_step: rule
        effects: {safety: 5}
        competencies: {rules: 2, safety: 1}
        next: refuses_angry
        debrief:
          verdict: ok
          why: >-
            Акцент на безопасность движения сделан, но отказ уже прозвучал, а карточка 20 при отказе
            требует начальника поезда или ПТБ. Второе объяснение подряд пассажир слышит как спор.
          better: >-
            Вместе с правилом сказать «Вынужден пригласить начальника поезда» и вызвать ПТБ по
            радиосвязи.
          refs: [sit_20]
      - id: allow_finish
        text: «Ладно, докуривайте быстро». Отхожу.
        effects: {loyalty: 10, safety: -35}
        competencies: {safety: -3, rules: -3}
        next: detector_alarm
        debrief:
          verdict: bad
          why: >-
            Разрешить докурить это первая ловушка карточки 20. Пассажир доволен, а дым идёт в
            салон, и задымление на борту уже не предотвратить.
          better: >-
            Не давать паузы: «Вынужден пригласить начальника поезда», вызов ПТБ по радиосвязи.
          refs: [sit_20]

  refuses_angry:
    type: dialog
    text: >-
      Он повышает голос, из салона оборачиваются. Устройство по-прежнему в руке, пар идёт в
      сторону открытой двери в вагон.
    passenger_says: Не ваше дело! Докурю и уйду, и нечего тут командовать.
    options:
      - id: apologize_and_call
        text: >-
          Говорю «Простите, если прозвучало резко. Понимаю, что неприятно, но курить нельзя, и я
          обязан пригласить начальника поезда», вызываю его по радиосвязи.
        role_step: acknowledge
        escalation_target: chief
        effects: {loyalty: 5, safety: 10}
        competencies: {empathy: 2, escalation: 2, safety: 1}
        set_flags: {apologized: true}
        next: calmed_down
        debrief:
          verdict: best
          why: >-
            Извинение и признание снимают конфликт, который карточка 21 велит не разжигать, а
            вызов начальника поезда сделан открыто и спокойно. Пассажир убирает устройство, не
            теряя лица.
          refs: [sit_21, sit_20, model_role_steps]
      - id: call_chief_calm
        text: Спокойно говорю «Вынужден пригласить начальника поезда» и вызываю его и ПТБ по радиосвязи.
        escalation_target: chief
        effects: {safety: 10}
        competencies: {escalation: 2, safety: 1}
        next: chief_arrives
        debrief:
          verdict: ok
          why: >-
            Реакция карточки 20 при отказе: начальник поезда и ПТБ. Канал верный, тон спокойный,
            но пассажир остался в конфликте и докуривает до прихода начальника.
          better: >-
            Перед вызовом признать: «Понимаю, что неприятно, но курить нельзя, и я обязан
            пригласить начальника поезда».
          refs: [sit_20, sit_21]
      - id: threaten_police
        text: Говорю «Сейчас полицию вызову, на ближайшей станции снимут», хотя вызывать некого.
        effects: {loyalty: -10, safety: 5}
        competencies: {escalation: -1, empathy: -1}
        next: chief_arrives
        debrief:
          verdict: bad
          why: >-
            Полицию по карточке 20 привлекает начальник поезда по своему решению, а угроза, которую
            вы не можете исполнить, это провокация из карточки 21. Он тушит, но конфликт остаётся.
          better: >-
            Без угроз: «Вынужден пригласить начальника поезда», и вызвать его по радиосвязи.
          refs: [sit_20, sit_21]
      - id: step_back_wait
        text: >-
          Отхожу в салон: пусть докурит, потом поговорим спокойно.
        effects: {loyalty: -5, safety: -20}
        competencies: {safety: -2, escalation: -2}
        next: detector_alarm
        debrief:
          verdict: bad
          why: >-
            Игнорировать нарушение это ловушка карточки 21, а курение продолжилось у открытой
            двери в вагон. Пока вы ждали, дым дошёл до датчика.
          better: >-
            Не уходить и не спорить: вызвать начальника поезда и ПТБ по радиосвязи.
          refs: [sit_21, sit_20]

  smoke_spreads:
    type: event
    text: >-
      Пока вы подбирали слова, он докурил. В салон потянуло дымом, пассажирка с места 3А
      закашлялась, кто-то встал посмотреть, что горит.
    effects: {safety: -10}
    next: detector_alarm

  detector_alarm:
    type: dialog
    text: >-
      В тамбуре сработал датчик задымления, в салоне запах дыма. Пассажиры оборачиваются и
      спрашивают, что случилось.
    passenger_says: Да ничего не горит, это пар! Скажите им, что ложная тревога.
    options:
      - id: call_engineer_and_chief
        text: >-
          По радиосвязи вызываю бортинженера и начальника поезда: задымление в тамбуре вагона 7,
          источник, похоже, курение.
        escalation_target: engineer
        effects: {safety: 15}
        competencies: {escalation: 2, safety: 1}
        next: ending_detector_alarm
        debrief:
          verdict: best
          why: >-
            Датчик и тамбур проверяет бортинженер, за это отвечает техническое обслуживание
            поезда, а начальник поезда решает, что делать с нарушителем. Вызов любым оперативным
            способом, как советует карточка 20.
          refs: [sit_20, sto_011_10_6]
      - id: tell_engineer_vape
        text: >-
          Вызываю бортинженера и начальника поезда и сразу докладываю: пар электронной сигареты,
          открытого огня не было, устройство у пассажира в кармане.
        when: {flags_all: {device_checked: true}}
        escalation_target: engineer
        effects: {loyalty: 5, safety: 20}
        competencies: {escalation: 2, safety: 2}
        next: ending_detector_alarm
        debrief:
          verdict: best
          why: >-
            Тот же вызов, но с фактами: вы спросили об устройстве ещё в тамбуре, и бортинженеру не
            нужно искать тлеющий окурок. Проверка короче, пассажиры быстрее слышат, что огня нет.
          refs: [sit_20, sto_011_10_6]
      - id: ventilate_self
        text: Держу дверь в салон открытой, машу папкой, чтобы выветрилось, никого не вызываю.
        effects: {safety: -10}
        competencies: {safety: -2, escalation: -1}
        next: ending_detector_alarm
        debrief:
          verdict: bad
          why: >-
            Датчик сработал, и бригада обязана проверить тамбур, а вы гоните дым в салон. Карточка
            20 требует вызывать бортинженера и начальника поезда любым оперативным способом, а не
            проветривать самому.
          better: >-
            Вызвать бортинженера и начальника поезда по радиосвязи и держать пассажиров подальше от
            тамбура.
          refs: [sit_20, sto_011_10_6]
      - id: do_nothing_hope
        text: Говорю пассажирам «Всё в порядке, ложная тревога» и надеюсь, что датчик замолчит сам.
        effects: {loyalty: -5, safety: -20}
        competencies: {safety: -3, escalation: -2}
        next: ending_detector_alarm
        debrief:
          verdict: bad
          why: >-
            Вы не знаете, ложная ли тревога, и говорите пассажирам то, чего не проверяли. Тлеющий
            окурок в тамбуре на ходу это возгорание, которое карточка 20 велит не допускать любым
            способом.
          better: >-
            Немедленно вызвать бортинженера и начальника поезда, пассажирам сказать, что тамбур
            проверяют.
          refs: [sit_20]

  calmed_down:
    type: dialog
    text: >-
      Он ворчит, но убирает устройство в карман. Банка пива по-прежнему в руке, начальник поезда
      и сотрудник ПТБ уже идут по составу.
    passenger_says: Всё, убрал. Пиво-то можно хоть допить, или тоже нельзя?
    options:
      - id: offer_bistro_for_beer
        text: >-
          Говорю «Обращаю Ваше внимание, употребление алкогольных напитков допускается только в
          вагоне-бистро. Я провожу Вас», по пути проверяю, что в тамбуре ничего не тлеет.
        role_step: solution
        effects: {loyalty: 10, safety: 5}
        competencies: {solution: 2, rules: 1, safety: 2}
        next: chief_arrives
        debrief:
          verdict: best
          why: >-
            Реплика карточки 21 дословно, и сразу решение: бистро доступно в любое время пути, и
            пиво там законно. Тамбур проверен на тление, как советует карточка 20, конфликта нет.
          refs: [sit_21, sto_011_7_4_13, sit_20]
      - id: check_no_smoke_left
        text: >-
          Осматриваю тамбур: нет ли окурка или тления у мусорного бака. Про пиво молчу.
        effects: {safety: 10}
        competencies: {safety: 1}
        next: chief_arrives
        debrief:
          verdict: ok
          why: >-
            Тление проверено, это по карточке 20. Но пассажир так и не услышал правило про
            алкоголь и остался с банкой в тамбуре у двери в вагон.
          better: >-
            Проверить тамбур и сказать «Употребление алкогольных напитков допускается только в
            вагоне-бистро», проводить туда.
          refs: [sit_20, sit_21]
      - id: let_drink_here
        text: Говорю «Допивайте здесь, только тихо» и возвращаюсь в салон.
        effects: {loyalty: 5, safety: -15}
        competencies: {rules: -2, safety: -1}
        next: chief_arrives
        debrief:
          verdict: bad
          why: >-
            Закрыть глаза на алкоголь вне бистро это ловушка карточки 21: пассажиру приятно, а
            нетрезвый человек в тамбуре у дверей на ходу это риск для него и для соседей.
          better: >-
            «Обращаю Ваше внимание, употребление алкогольных напитков допускается только в
            вагоне-бистро», проводить его туда.
          refs: [sit_21, sto_011_7_4_13]

  chief_arrives:
    type: dialog
    text: >-
      Начальник поезда и сотрудник ПТБ у тамбура. Пассажир убрал устройство, банку держит за
      спиной. Начальник поезда спрашивает вас, что произошло.
    passenger_says: Ну и зачем этот цирк? Я же всё убрал.
    options:
      - id: report_and_thank
        text: >-
          Докладываю: что видел, во сколько, что пассажир ответил. Ему говорю «Благодарю Вас за
          понимание, дальше с Вами поговорит начальник поезда».
        role_step: assure
        effects: {loyalty: 5, safety: 10}
        competencies: {escalation: 1, empathy: 2, safety: 1}
        next: ending_prevented
        debrief:
          verdict: best
          why: >-
            Начальник поезда получает факты, а не оценки, и сам решает, нужна ли полиция, как
            описано в карточке 20. Заверение из ролевой модели закрывает разговор без обиды.
          refs: [sit_20, model_role_steps]
      - id: report_ecig_detail
        text: >-
          Докладываю факты и добавляю: электронная сигарета, убрана в правый карман куртки.
          Пассажиру говорю «Благодарю Вас за понимание, дальше с Вами поговорит начальник поезда».
        when: {flags_all: {device_checked: true}}
        role_step: assure
        effects: {loyalty: 5, safety: 15}
        competencies: {escalation: 2, empathy: 2, safety: 1}
        next: ending_prevented
        debrief:
          verdict: best
          why: >-
            Вы спросили об устройстве в первую минуту, и начальнику поезда не нужно спорить о
            «паре»: карточка 20 включает электронные сигареты в запрет. Заверение сказано, обиды
            нет.
          refs: [sit_20, model_role_steps]
      - id: report_dry
        text: Докладываю начальнику поезда факты и ухожу к тележке, пассажиру ничего не говорю.
        effects: {safety: 10}
        competencies: {escalation: 1}
        next: ending_calm_after_chief
        debrief:
          verdict: ok
          why: >-
            Доклад точный, начальник поезда разберётся. Но пассажир остался без заверения и
            запомнил только, что на него «вызвали охрану».
          better: >-
            После доклада сказать пассажиру «Благодарю Вас за понимание, дальше с Вами поговорит
            начальник поезда».
          refs: [sit_20, model_role_steps]
      - id: blame_loudly
        text: При всём вагоне говорю начальнику поезда, что пассажир хамил, пил и курил назло.
        effects: {loyalty: -15}
        competencies: {empathy: -2, rules: -1}
        next: ending_conflict
        debrief:
          verdict: bad
          why: >-
            Оценки вместо фактов при всех это провокация из карточки 21 и нарушение этики
            поведения персонала. Пассажир снова заводится, соседи пишут жалобу уже на вас.
          better: >-
            Коротко доложить факты начальнику поезда, пассажира поблагодарить за понимание.
          refs: [sit_21, sto_011_10_1]
      - id: downplay_to_chief
        text: Говорю начальнику поезда «Ничего страшного, он уже убрал, можно не оформлять».
        effects: {loyalty: 5, safety: -10}
        competencies: {rules: -2, escalation: -1}
        next: ending_calm_after_chief
        debrief:
          verdict: bad
          why: >-
            Решение о последствиях принимает начальник поезда, а не проводник, и для этого ему
            нужны факты. Пассажиру вы понравились, но при повторе бригада будет без предупреждения.
          better: >-
            Доложить факты полностью и оставить решение начальнику поезда.
          refs: [sit_20, sto_011_10_6]

  ending_prevented:
    type: ending
    title: Тамбур чист
    text: >-
      Начальник поезда предупредил пассажира и записал случай в журнал; тот допил пиво в бистро и
      до Твери в тамбуре не появлялся. Пассажирка с места 3А кивнула вам, проходя мимо.
    debrief:
      summary: >-
        Курение прекращено без задымления и без скандала: правило названо с акцентом на
        безопасность движения, начальник поезда и ПТБ вызваны при отказе, алкоголь отправлен в
        бистро, пассажир услышал благодарность.
      refs: [sit_20, sit_21, sto_011_10_6]

  ending_calm_after_chief:
    type: ending
    title: Разговор у начальника поезда
    text: >-
      Начальник поезда сам объяснил пассажиру правила и предупредил о полиции на станции. Курение
      прекращено, но пассажир до конца поездки смотрит на вас исподлобья.
    debrief:
      summary: >-
        Безопасность обеспечена бригадой, а доверие пассажира потеряно: здесь заканчиваются пути
        без заверения или с попыткой смягчить доклад начальнику поезда.
      refs: [sit_20, model_role_steps]

  ending_conflict:
    type: ending
    title: Жалоба на проводника
    text: >-
      Пассажир перестал курить ещё до прихода начальника поезда, но после ваших слов при всём
      вагоне написал жалобу на грубость проводника. Соседи подтвердили его версию.
    debrief:
      summary: >-
        Нарушение прекращено, а жалоба есть: провокация и оценки вместо фактов стоят дороже, чем
        сам инцидент. Карточка 21 велит не вступать в конфликт даже с тем, кто неправ.
      refs: [sit_21, sto_011_10_1]

  ending_detector_alarm:
    type: ending
    title: Задымление в тамбуре
    text: >-
      Бортинженер проверил тамбур и снял тревогу, начальник поезда зафиксировал задымление и
      передал курившего сотрудникам полиции в Твери. О случае доложено в депо, вас ждёт разбор.
    forced_outcome: incident
    debrief:
      summary: >-
        Дым на борту это инцидент независимо от того, как быстро вы вызвали бортинженера: карточка
        20 требует не допускать задымления любым способом, а при отказе сразу звать начальника
        поезда и ПТБ.
      refs: [sit_20, sto_011_10_6]
