id: lost_child
version: 2
title: Мальчик один в вагоне
summary: >-
  В вагоне комфорт-класса плачет мальчик лет шести: пошёл в туалет и не нашёл вагон, где едут
  родители; до Москвы сорок минут, начальник поезда в головном вагоне.
source_situations: [30, 47]
difficulty: 3
critical: false
tags: [дети, громкая связь, персональные данные, комфорт]
competencies: [inclusion, escalation, empathy, rules, safety]
role_model: true
estimated_minutes: 3
context:
  service_class: comfort
  segment: участок Тверь, Москва, через пять минут после Твери
  next_station_minutes: 40
  time_of_day: день
  passenger:
    label: мальчик лет шести в синей куртке, стоит в проходе вагона 5
    state: плачет, зовёт маму, не помнит номер своего вагона
  crew_available: [chief, pa_announcement]
  loyalty_of: ребёнок, его родители и соседи по вагону 5
start:
  node: found
  loyalty: 60
  safety: 70
  flags: {}
# объявление с фамилией и ребёнок, оставленный один или без доклада бригаде, закрывают образцовый
# исход: порог выше умолчаний rules.yaml
outcome_rules:
  exemplary_if: {safety_min: 90, loyalty_min: 80}
nodes:
  found:
    type: dialog
    text: >-
      В проходе вагона 5 стоит мальчик лет шести в синей куртке и плачет: ходил в туалет и не
      нашёл своих. Пассажиры оборачиваются, кто-то предлагает конфету.
    passenger_says: Я маму потерял... она там, где столики, а я не помню где.
    options:
      - id: calm_stay
        text: >-
          Присаживаюсь к нему: «Не волнуйся, я проводник этого вагона и помогу тебе найти маму.
          Побудь, пожалуйста, рядом со мной», и сажаю его на свободное место у служебного купе.
        role_step: acknowledge
        effects: {loyalty: 10, safety: 10}
        competencies: {empathy: 2, inclusion: 2, safety: 1}
        next: chief_inform
        debrief:
          verdict: best
          why: >-
            Реплика карточки 30 почти дословно и её главное правило: оставаться с ребёнком.
            Мальчик услышал, кто из работников рядом с ним и где его найти, как стандарт требует
            для ребёнка в поезде без взрослых, и больше никуда не идёт один.
          refs: [sit_30, sto_011_7_7_4, model_role_steps]
      - id: ask_neighbors_whose
        text: >-
          Спрашиваю у соседей по вагону, не видел ли кто его родителей; мальчик стоит рядом со
          мной.
        effects: {loyalty: 5}
        competencies: {inclusion: 1}
        next: chief_inform
        debrief:
          verdict: ok
          why: >-
            Ребёнок не оставлен один, и это главное. Но сам он от вас не услышал ни слова, а
            карточка 30 начинает с того, чтобы успокоить и оставить рядом: пока вы спрашиваете
            вагон, он плачет среди чужих людей.
          better: >-
            Сначала ему: «Не волнуйся, я помогу тебе найти маму. Побудь, пожалуйста, рядом со
            мной».
          refs: [sit_30]
      - id: send_to_search
        text: Говорю «Иди по вагонам, поищи маму, она где-то там» и показываю в сторону тамбура.
        effects: {safety: -40}
        competencies: {safety: -3, inclusion: -2}
        next: child_alone
        debrief:
          verdict: bad
          why: >-
            Первая ловушка карточки 30: отпустить ребёнка искать родителей самому. Шестилетний
            ребёнок один между вагонами, с тамбурами и дверями, это прямой риск, и о нём никто из
            бригады не знает.
          better: Оставить ребёнка рядом с собой и сообщить начальнику поезда.
          refs: [sit_30]
      - id: ignore_busy
        text: >-
          Говорю «Сейчас, минуту» и продолжаю проверять билеты: родители сами найдут.
        effects: {loyalty: -15, safety: -20}
        competencies: {empathy: -2, safety: -2}
        next: child_alone
        debrief:
          verdict: bad
          why: >-
            Ребёнок без присмотра это неотложный случай, а неотложные просьбы выполняются в
            приоритетном порядке. Пока вы проверяли билеты, мальчик ушёл искать маму сам, и вагон
            это видел.
          better: Отложить билеты, успокоить ребёнка и оставить рядом с собой.
          refs: [sto_011_10_4, sit_30]

  child_alone:
    type: dialog
    text: >-
      Мальчик ушёл к тамбуру один. Через минуту из соседнего вагона слышен плач, а пассажирка с 8В
      спрашивает, чей это ребёнок бродит между вагонами.
    passenger_says: Вы его одного отпустили? Он же в тамбур полез!
    options:
      - id: radio_chief_now
        text: >-
          Догоняю мальчика, беру за руку и по радиосвязи сообщаю начальнику поезда: ребёнок лет
          шести без родителей, вагон 5, ищем маму.
        escalation_target: chief
        effects: {safety: 10}
        competencies: {escalation: 2, safety: 1, inclusion: 1}
        next: announcement
        debrief:
          verdict: best
          why: >-
            Ребёнок снова под присмотром, а начальник поезда знает о нём, как требует карточка 30.
            Минуты, пока он шёл один, уже не вернуть, но дальше всё по правилам.
          refs: [sit_30]
      - id: catch_and_keep
        text: >-
          Догоняю мальчика, возвращаю в вагон и сажаю у служебного купе; начальнику поезда пока не
          сообщаю.
        effects: {loyalty: 5, safety: 5}
        competencies: {inclusion: 1}
        next: chief_inform
        debrief:
          verdict: ok
          why: >-
            Ребёнок рядом, и это исправляет главную ошибку. Но карточка 30 ставит рядом второе
            действие: сообщить начальнику поезда, а родители тем временем ищут его по составу.
          better: Вернуть ребёнка и сразу по радиосвязи сообщить начальнику поезда.
          refs: [sit_30]
      - id: run_yourself
        text: Бегу по вагонам искать родителей, мальчика оставляю у тамбура с пассажиркой с 8В.
        effects: {loyalty: -10, safety: -10}
        competencies: {safety: -2, escalation: -1}
        next: ending_incident_lost
        debrief:
          verdict: bad
          why: >-
            Ребёнок остался с чужим человеком у тамбура, а вы ушли из вагона: карточка 30 требует
            обратного, остаться с ребёнком и сообщить начальнику поезда. Найти родителей бегом по
            составу дольше, чем по радиосвязи.
          better: Вернуть ребёнка к себе и сообщить начальнику поезда по радиосвязи.
          refs: [sit_30, sto_011_10_4]

  chief_inform:
    type: dialog
    text: >-
      Мальчик сидит у служебного купе и всхлипывает. Начальник поезда в головном вагоне, до
      Москвы сорок минут; соседи ждут, что вы будете делать.
    passenger_says: А мама меня найдёт? Я в пятом вагоне, да?
    options:
      - id: radio_chief_no_pd
        text: >-
          Говорю ему «Смотри: ты остаёшься со мной и никуда не уходишь, а начальник поезда поможет
          маме найти тебя», по радиосвязи сообщаю: мальчик лет шести, синяя куртка, вагон 5.
        role_step: rule
        escalation_target: chief
        effects: {loyalty: 5, safety: 15}
        competencies: {escalation: 2, rules: 2, inclusion: 1}
        next: announcement
        debrief:
          verdict: best
          why: >-
            Правило для ребёнка сказано понятными словами, начальник поезда получил приметы и
            место, как требует карточка 30. Мальчик знает, что будет дальше, а бригада ищет
            родителей по всему составу.
          refs: [sit_30, model_role_steps]
      - id: walk_to_chief_with_child
        text: Беру мальчика за руку и веду через четыре вагона в купе начальника поезда.
        escalation_target: chief
        effects: {loyalty: 5, safety: 5}
        competencies: {escalation: 1, inclusion: 1}
        delayed:
          - steps: 2
            effects: {loyalty: -10}
            text: >-
              Пассажиры вагона 5 искали проводника, пока вы водили ребёнка в головной вагон: чай
              остыл, а на вопрос о пересадке никто не ответил.
        next: announcement
        debrief:
          verdict: ok
          why: >-
            Совет карточки 30 проводить ребёнка до купе начальника поезда выполнен. Но по
            радиосвязи начальник узнал бы о ребёнке сразу, а ваш вагон на четыре вагона пути
            остался без проводника, и это ему припомнят.
          better: >-
            Сначала сообщить по радиосвязи, а вести ребёнка к начальнику поезда по его решению.
          refs: [sit_30, sto_011_t3_staff_presence]
      - id: wait_without_report
        text: >-
          Никому не сообщаю: сажаю мальчика у служебного купе, родители сами найдут.
        effects: {loyalty: -5, safety: -20}
        competencies: {escalation: -2, safety: -1}
        next: search_alone
        debrief:
          verdict: bad
          why: >-
            Начальник поезда о ребёнке не знает, объявления по громкой связи не будет, а родители
            ищут его в другом конце состава. Карточка 30 называет доклад начальнику обязательным.
          better: >-
            Сообщить начальнику поезда по радиосвязи приметы и вагон, ребёнка оставить рядом.
          refs: [sit_30]

  search_alone:
    type: dialog
    text: >-
      Мальчик у служебного купе, о нём никто из бригады не знает. Соседи спрашивают, что вы
      будете делать, а он всё чаще смотрит на дверь тамбура.
    passenger_says: А если мама уйдёт с поезда без меня?
    options:
      - id: radio_chief_late
        text: >-
          По радиосвязи сообщаю начальнику поезда: мальчик лет шести, синяя куртка, ждёт родителей
          в вагоне 5.
        escalation_target: chief
        effects: {safety: 5}
        competencies: {escalation: 1}
        next: announcement
        debrief:
          verdict: ok
          why: >-
            Канал и слова верные: приметы и вагон, без фамилии. Но доклад сделан на третьем шаге, а
            карточка 30 ставит его сразу после того, как ребёнок рядом: минуты, пока родители
            искали сына сами, уже прошли.
          better: Сообщать начальнику поезда первым делом, как только ребёнок рядом с вами.
          refs: [sit_30]
      - id: walk_carriages_with_child
        text: Иду с мальчиком за руку по вагонам искать маму, спрашивая пассажиров.
        effects: {loyalty: 5, safety: -5}
        competencies: {inclusion: 1, escalation: -1}
        next: parents_come
        debrief:
          verdict: ok
          why: >-
            Ребёнок не оставлен, и родителей вы найдёте. Но объявление по громкой связи через
            начальника поезда нашло бы их за минуту, а ваш вагон остался без проводника.
          better: >-
            Сообщить начальнику поезда по радиосвязи и попросить объявить: мальчик лет шести ждёт
            родителей в вагоне 5.
          refs: [sit_30]
      - id: leave_child_with_neighbors_go_search
        text: Прошу соседей с 8А присмотреть за мальчиком и иду искать родителей сам.
        effects: {loyalty: -5, safety: -15}
        competencies: {safety: -2, inclusion: -1}
        next: parents_come
        debrief:
          verdict: bad
          why: >-
            Ребёнок оставлен с посторонними, а карточка 30 требует, чтобы рядом остались вы, и
            чтобы искал начальник поезда через громкую связь. Соседи не отвечают за чужого ребёнка
            и через минуту вернутся к своим делам.
          better: Остаться с ребёнком и вызвать начальника поезда по радиосвязи.
          refs: [sit_30]

  announcement:
    type: dialog
    text: >-
      Начальник поезда спрашивает, что объявить по громкой связи. Сосед с 8А подсказывает:
      «Фамилию и место скажите, быстрее найдут».
    passenger_says: Скажите маме, что я здесь!
    timer:
      seconds: 30
      on_expire:
        next: parents_panic
        effects: {loyalty: -15, safety: -10}
        competencies: {escalation: -2, inclusion: -1}
        debrief:
          why: >-
            Начальник поезда ждал слов для объявления, а вы их подбирали; тем временем мать бежала
            через состав и кричала имя сына. Карточка 30 требует действовать сразу: ребёнок
            рядом, начальник в курсе, объявление без лишних данных.
          better: >-
            Сразу ответить: объявить, что мальчик лет шести ждёт родителей в вагоне 5, без
            фамилии.
          refs: [sit_30, sto_011_10_4]
    options:
      - id: pa_without_pd
        text: >-
          «Сейчас объявим, и мама придёт сюда». Прошу начальника поезда объявить: мальчик лет
          шести ждёт родителей в вагоне 5.
        role_step: solution
        escalation_target: pa_announcement
        effects: {loyalty: 10, safety: 10}
        competencies: {rules: 2, inclusion: 1, escalation: 1}
        next: parents_come
        debrief:
          verdict: best
          why: >-
            Объявление без лишних персональных данных, как требует карточка 30: возраста и вагона
            достаточно, чтобы родители пришли, а посторонние не узнали ни имени, ни места ребёнка.
            Мальчик услышал, что будет дальше.
          refs: [sit_30, model_role_steps]
      - id: pa_with_full_name
        text: >-
          Прошу объявить фамилию, имя и место мальчика: так родители узнают его наверняка.
        effects: {loyalty: 10, safety: -20}
        competencies: {rules: -3}
        next: stranger_claims
        debrief:
          verdict: bad
          why: >-
            Вторая ловушка карточки 30: объявить по громкой связи фамилию и место ребёнка. Весь
            поезд теперь знает фамилию: посторонний назовётся отцом, а шестилетний не сумеет
            возразить. Соседям и родителям кажется, что так быстрее, поэтому лояльность выросла,
            хотя родители нашли бы сына и по возрасту с вагоном.
          better: >-
            Объявить только возраст и вагон: «Мальчик лет шести ждёт родителей в вагоне 5».
          refs: [sit_30]
      - id: pa_generic_no_details
        text: >-
          Прошу объявить: «Родителей потерявшегося ребёнка просят подойти к начальнику поезда».
        effects: {loyalty: 5, safety: 5}
        competencies: {rules: 1}
        next: parents_come
        debrief:
          verdict: ok
          why: >-
            Персональных данных в объявлении нет, и это по карточке 30. Но без вагона и возраста
            родители побегут в головной вагон, а ребёнок в пятом: встречу вы отложили на несколько
            минут.
          better: Назвать в объявлении возраст и вагон, где ждёт ребёнок.
          refs: [sit_30]

  parents_panic:
    type: event
    text: >-
      Пока вы медлили, мать мальчика бежала через вагоны и кричала его имя; её остановил начальник
      поезда и привёл к вам. Она в слезах, мальчик тоже.
    effects: {loyalty: -5}
    next: ending_found_late

  parents_come:
    type: dialog
    text: >-
      Мать мальчика прибежала из вагона 3, обнимает его и не может отдышаться. Отдышавшись,
      просит: ей нужно на минуту в туалет, а сумки остались в вагоне 3; пусть сын пока посидит у
      вас.
    passenger_says: Спасибо вам! Побудьте с ним минутку, я мигом.
    options:
      - id: assure_and_watch_nearby
        text: >-
          Говорю «Я буду рядом в зоне обслуживания и присмотрю, только отмечу, что мне необходимо
          продолжить обслуживание. Благодарю Вас за понимание».
        role_step: assure
        effects: {loyalty: 10, safety: 5}
        competencies: {empathy: 2, inclusion: 2, rules: 1}
        next: ending_reunited
        debrief:
          verdict: best
          why: >-
            Реакция карточки 47 её же словами: ситуативная помощь без ответственности вместо
            сопровождающего. Мать слышит и «присмотрю», и «у меня обязанности», ребёнок остаётся
            в зоне обслуживания, а вы на рабочем месте.
          refs: [sit_47, sto_011_t3_staff_presence, model_role_steps]
      - id: suggest_go_together
        text: >-
          Говорю «Лучше возьмите его с собой: у меня свои обязанности, и надолго отойти от зоны
          обслуживания я не могу».
        effects: {loyalty: 5, safety: 5}
        competencies: {inclusion: 1, rules: 1}
        next: ending_reunited
        debrief:
          verdict: ok
          why: >-
            Ответственность осталась у матери, и это по карточке 47. Но карточка допускает и
            содействие: побыть рядом с ребёнком в зоне обслуживания, пока мать отойдёт на минуту,
            а вы ей в этом отказали.
          better: >-
            «Я буду рядом в зоне обслуживания и присмотрю, только отмечу, что мне необходимо
            продолжить обслуживание».
          refs: [sit_47]
      - id: take_full_responsibility
        text: >-
          Говорю «Конечно, идите, я за ним присмотрю», сажаю мальчика в служебное купе и ухожу
          обслуживать вагон.
        effects: {loyalty: 10, safety: -15}
        competencies: {inclusion: -1, rules: -2, safety: -1}
        next: ending_reunited
        debrief:
          verdict: bad
          why: >-
            Ловушка карточки 47: взять ответственность вместо сопровождающего и уйти обслуживать.
            Мать довольна, поэтому лояльность выросла, а ребёнок, которого вы только что нашли,
            снова один, теперь в служебном купе.
          better: >-
            «Я буду рядом в зоне обслуживания и присмотрю», но ответственность остаётся у матери, и
            уходить от ребёнка нельзя.
          refs: [sit_47]
      - id: scold_parents
        text: Говорю «Как можно так за ребёнком не следить! Больше не отпускайте».
        effects: {loyalty: -15}
        competencies: {empathy: -2}
        next: ending_reunited_cold
        debrief:
          verdict: bad
          why: >-
            Мать и так напугана, а от проводника получила выговор при вагоне. Нормы этики не
            позволяют читать пассажирам мораль, а карточка 47 велит смотреть по ситуации и
            помогать.
          better: >-
            Спокойно сказать, где ребёнка нашли, предложить помощь и закончить словами
            «Благодарю Вас за понимание».
          refs: [sto_011_10_1, sit_47]

  stranger_claims:
    type: dialog
    text: >-
      На объявление с фамилией подошёл мужчина: «Это мой сын, отдайте его мне». Мальчик прячется
      за вас и его не узнаёт.
    passenger_says: Я его не знаю... где мама?
    options:
      - id: verify_with_chief_before_handover
        text: >-
          Говорю мужчине «Обращаю Ваше внимание: ребёнка я передам только после проверки
          начальником поезда, прошу Вас подождать здесь», и вызываю начальника по радиосвязи.
        role_step: rule
        escalation_target: chief
        effects: {safety: 10}
        competencies: {rules: 2, safety: 2, escalation: 1, inclusion: 1}
        next: ending_reunited
        debrief:
          verdict: best
          why: >-
            Ребёнок не узнаёт человека, который назвал фамилию, услышанную в объявлении: передать
            его нельзя. Проверку делает начальник поезда, а ребёнок остаётся рядом с вами, как
            требует карточка 30.
          refs: [sit_30]
      - id: ask_child_quietly
        text: >-
          Отвожу мальчика в сторону и тихо спрашиваю, знает ли он этого человека; мужчине говорю
          подождать, начальника не зову.
        effects: {loyalty: -5, safety: 5}
        competencies: {inclusion: 1, safety: 1}
        next: ending_reunited
        debrief:
          verdict: ok
          why: >-
            Вы не передали ребёнка на слово и спросили его самого, это верно. Но решать, кто его
            родитель, вам не по силам и не по должности: проверку делает начальник поезда, которого
            вы не позвали.
          better: >-
            Сказать, что передача только после проверки начальником поезда, и вызвать его по
            радиосвязи.
          refs: [sit_30]
      - id: hand_over_on_word
        text: >-
          Отдаю мальчика мужчине: фамилию назвал правильно, значит, отец.
        effects: {loyalty: 5, safety: -40}
        competencies: {safety: -3, rules: -2, inclusion: -2}
        next: ending_incident_lost
        debrief:
          verdict: bad
          why: >-
            Фамилию он узнал из вашего объявления, а ребёнок его не узнаёт: вы отдали чужого
            ребёнка постороннему на слово. Мужчина доволен, поэтому лояльность чуть выросла, а
            безопасность обрушилась: это прямое следствие ловушки карточки 30 с персональными
            данными в объявлении.
          better: Не передавать ребёнка никому до проверки начальником поезда.
          refs: [sit_30]

  ending_reunited:
    type: ending
    title: Семья вместе
    text: >-
      Мальчик едет с матерью в вагоне 3 до Москвы, вагон 5 вернулся к своим делам, а сосед с 8А
      всё ещё уверен, что с фамилией нашли бы быстрее.
    debrief:
      summary: >-
        Ребёнок нашёл родителей, потому что вы остались с ним, сообщили начальнику поезда и
        объявили без лишних данных, а потом не взяли на себя чужую ответственность. Промедление и
        лишние слова в объявлении видны по шкалам.
      refs: [sit_30, sit_47]

  ending_reunited_cold:
    type: ending
    title: Нашли, но обиделись
    text: >-
      Мальчик с матерью, но она ушла, не попрощавшись, и на выходе в Москве попросила у начальника
      поезда книгу отзывов.
    debrief:
      summary: >-
        Ребёнок в безопасности, а доверие потеряно словами: выговор напуганной матери при вагоне
        это нарушение этики, которое перечёркивает правильные действия до него.
      refs: [sto_011_10_1, sit_47]

  ending_found_late:
    type: ending
    title: Нашли с опозданием
    text: >-
      Мать нашла сына сама, пробежав через полсостава; начальник поезда спросил вас, почему
      объявления не было.
    debrief:
      summary: >-
        Ребёнок был рядом, но родители минуты паниковали без объявления: карточка 30 требует не
        только остаться с ребёнком, но и сразу дать начальнику поезда слова для объявления, чтобы
        оно прозвучало без задержки.
      refs: [sit_30]

  ending_incident_lost:
    type: ending
    title: Ребёнок вне присмотра
    text: >-
      О ребёнке, оставшемся без присмотра или переданном постороннему, начальник поезда узнал от
      пассажиров. На станции семью встречают сотрудники полиции, и первый их вопрос будет о том,
      почему ребёнок был не с вами.
    forced_outcome: incident
    debrief:
      summary: >-
        Отпустить ребёнка одного, оставить его с чужими или отдать по одному слову это
        происшествие, чем бы оно ни кончилось: карточка 30 требует оставаться с ребёнком до
        передачи родителям.
      refs: [sit_30]
