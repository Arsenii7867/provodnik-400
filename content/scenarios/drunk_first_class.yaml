id: drunk_first_class
version: 1
title: Вино включено в билет
summary: >-
  Вечерний рейс, вагон первого класса: пассажир просит третий бокал вина, которое включено в
  стоимость билета, но говорит громко и нетвёрдо держит бокал; начальник поезда в своём купе.
source_situations: [50, 6, 21, 51]
difficulty: 4
critical: false
tags: [алкоголь, первый класс, радиосвязь, эскалация]
competencies: [safety, escalation, empathy, rules]
role_model: true
estimated_minutes: 4
context:
  service_class: first
  segment: участок Москва, Санкт-Петербург, через час после отправления
  next_station_minutes: 50
  time_of_day: вечер
  passenger:
    label: мужчина лет сорока пяти на месте 2А
    state: говорит громко, глаза блестят, просит третий бокал вина
  crew_available: [chief, ptb, police]
  loyalty_of: пассажир на месте 2А и соседи по салону первого класса
start:
  node: request
  loyalty: 70
  safety: 65
  flags: {}
# образцовый исход только с докладом начальнику поезда: без него безопасность не доходит до порога,
# а отказ с ярлыком «вы пьяны» при чувствительности первого класса не даёт набрать лояльность
outcome_rules:
  exemplary_if: {safety_min: 90, loyalty_min: 80}
nodes:
  request:
    type: dialog
    text: >-
      Пассажир на 2А поднимает пустой бокал и просит третий: вино включено в билет. Речь громкая,
      движения размашистые; соседка с 1С оглядывается на вас.
    passenger_says: Ещё вина, друг мой! Включено же, я читал.
    options:
      - id: acknowledge_refuse_tea
        text: >-
          Говорю «Понимаю Вас, вечер долгий. К сожалению, этот напиток я предоставить не могу,
          позвольте предложить Вам чай или кофе?».
        role_step: acknowledge
        effects: {loyalty: -5, safety: 15}
        competencies: {empathy: 2, rules: 2, safety: 2}
        set_flags: {refused: true}
        next: reaction
        debrief:
          verdict: best
          why: >-
            Реплика карточки 50 дословно, перед ней признание из ролевой модели: пассажир слышит,
            что его поняли, а отказ идёт с альтернативой. Чай и кофе в первом классе доступны без
            ограничений, так что альтернатива настоящая. Лояльность чуть просела, потому что отказ
            есть отказ, зато нетрезвому пассажиру вино не подали.
          refs: [sit_50, sto_011_7_4_10, model_role_steps]
      - id: pour_but_inform_chief
        text: >-
          Говорю «Конечно, сейчас принесу», наливаю и по радиосвязи спокойно сообщаю начальнику
          поезда, что пассажиру на 2А подан третий бокал и он уже громкий.
        escalation_target: chief
        effects: {loyalty: 10, safety: -10}
        competencies: {rules: 1, empathy: 1, safety: -1}
        set_flags: {chief_informed: true}
        next: served_more
        debrief:
          verdict: ok
          why: >-
            Совет карточки 50 выполнен наполовину: если алкоголь включён в билет, не предоставить
            его нельзя, но начальника поезда предупреждают обязательно, и вы предупредили. Однако
            карточка ставит первым вежливый отказ с чаем или кофе, а нетрезвому пассажиру вы всё
            же налили.
          better: >-
            Сначала «К сожалению, этот напиток я предоставить не могу, позвольте предложить Вам чай
            или кофе?», и только при настойчивом требовании включённого напитка налить, предупредив
            начальника поезда.
          refs: [sit_50]
      - id: pour_included
        text: >-
          Наливаю третий бокал: включено в билет, а спорить с пассажиром первого класса себе
          дороже.
        effects: {loyalty: 15, safety: -25}
        competencies: {safety: -3, rules: -2}
        next: served_more
        debrief:
          verdict: bad
          why: >-
            Ловушка карточки 50: налить, потому что «включено», и никого не предупредить. Пассажиру
            приятно, поэтому лояльность выросла, но нетрезвый человек в салоне с полным бокалом это
            риск для него и для соседей, а начальник поезда о нём не знает.
          better: >-
            Вежливо отказать с альтернативой: «К сожалению, этот напиток я предоставить не могу,
            позвольте предложить Вам чай или кофе?», а при требовании включённого напитка
            предупредить начальника поезда.
          refs: [sit_50, sit_6]
      - id: refuse_with_label
        text: Говорю «Вам уже хватит, вы пьяны», забираю бокал и ухожу к тележке.
        effects: {loyalty: -20}
        competencies: {empathy: -2, rules: -1}
        next: reaction
        debrief:
          verdict: bad
          why: >-
            Отказ с ярлыком «вы пьяны» карточка 50 относит к тому, что роняет лояльность: пассажир
            первого класса услышал обвинение при соседях, а альтернативы не получил. Стандарт
            требует при отказе извиниться и объяснить причину, чего не прозвучало.
          better: >-
            «К сожалению, этот напиток я предоставить не могу, позвольте предложить Вам чай или
            кофе?»: отказ без ярлыков и с альтернативой.
          refs: [sit_50, sto_011_10_3, sto_011_10_1]

  reaction:
    type: dialog
    text: >-
      Пассажир кричит на весь салон: он заплатил за первый класс, и ему обязаны.
    passenger_says: Что значит не могу?! Я заплатил!
    timer:
      seconds: 25
      on_expire:
        next: goes_to_bistro
        effects: {loyalty: -10, safety: -20}
        competencies: {escalation: -1, safety: -1}
        debrief:
          why: >-
            Вы молчали, пока пассажир кричал на весь салон, и он ушёл в бистро за вином сам.
            Карточка 50 требует при угрозе конфликта сообщить начальнику поезда, а карточка 6
            напоминает: сообщить любым доступным способом, не откладывая.
          better: >-
            Спокойно назвать правило и тут же по радиосвязи нейтральной фразой пригласить
            начальника поезда.
          refs: [sit_50, sit_6]
    options:
      - id: rule_and_neutral_call
        text: >-
          «Понимаю Вас. Обращаю Ваше внимание: я отвечаю за Ваше самочувствие», по радиосвязи
          нейтрально зову начальника поезда.
        role_step: rule
        escalation_target: chief
        effects: {loyalty: 5, safety: 15}
        competencies: {rules: 2, empathy: 2, escalation: 2, safety: 1}
        set_flags: {chief_called: true}
        next: calmer
        debrief:
          verdict: best
          why: >-
            Правило названо через заботу о пассажире, а не через запрет, и начальник поезда вызван
            при первых признаках конфликта, как требует карточка 50. Вызов прозвучал нейтрально:
            слов о том, что пассажир пьян, при нём не сказано, а это прямой совет карточки 6.
          refs: [sit_50, sit_6, model_role_steps]
      - id: explain_only_calm
        text: >-
          «Понимаю Вас. Обращаю Ваше внимание: я отвечаю за Ваше самочувствие». Никого не
          вызываю.
        role_step: rule
        effects: {loyalty: 5, safety: 5}
        competencies: {rules: 2, empathy: 1}
        next: calmer
        debrief:
          verdict: ok
          why: >-
            Правило названо верно и спокойно, пассажир его услышал. Но конфликт уже обозначился, а
            карточка 50 в этот момент велит сообщить начальнику поезда: о нетрезвом пассажире в
            салоне пока знаете только вы.
          better: >-
            Та же фраза плюс нейтральный вызов начальника поезда по радиосвязи, без слов о
            состоянии пассажира.
          refs: [sit_50, sit_6]
      - id: radio_drunk_aloud
        text: >-
          При нём в рацию: «У нас тут пьяный на 2А буянит, подойдите».
        escalation_target: chief
        effects: {loyalty: -20, safety: -10}
        competencies: {escalation: -2, empathy: -2}
        set_flags: {chief_called: true}
        next: aggressive
        debrief:
          verdict: bad
          why: >-
            Главная ловушка карточки 6: по рации при пассажире сказать, что он пьян. Начальник
            поезда вызван, но пассажир услышал ярлык при всём салоне и перешёл к агрессии, которую
            вы сами спровоцировали.
          better: >-
            Вызывать нейтрально: «Начальник поезда, прошу подойти в первый вагон к месту 2А», без
            оценок состояния пассажира.
          refs: [sit_6, sto_011_10_1]
      - id: argue
        text: «Кричать здесь не надо, вы не в том состоянии, чтобы требовать».
        effects: {loyalty: -10, safety: -10}
        competencies: {empathy: -2, rules: -1}
        next: aggressive
        debrief:
          verdict: bad
          why: >-
            Спор с нетрезвым пассажиром это ловушка карточек 6 и 21: он не слышит аргументов, зато
            слышит вызов, и конфликт разгорается. Помощь бригады при этом не вызвана.
          better: >-
            Не спорить: назвать правило спокойно и пригласить начальника поезда нейтральной фразой
            по радиосвязи.
          refs: [sit_6, sit_21]

  goes_to_bistro:
    type: dialog
    text: >-
      Пока вы молчали, пассажир ушёл в бистро. Через десять минут он возвращается с бокалом и
      приятелем из вагона стандарт-класса: «посидим у меня». В проходе как раз идёт обслуживание
      горячими напитками с тележки.
    passenger_says: Это мой друг, пусть посидит, места же пустые!
    options:
      - id: stop_friend_via_safety
        text: >-
          Говорю приятелю «Понимаю Вас, но пропустить не могу: в вагоне идёт обслуживание горячими
          напитками с тележки, посторонним в проходе небезопасно. Спасибо за понимание».
        effects: {safety: 10}
        competencies: {rules: 2, safety: 2, empathy: 1}
        next: served_more
        debrief:
          verdict: best
          why: >-
            Реакция карточки 51: отказ через безопасность, а не через «не положено». Первый класс
            это изолированное пространство для своих пассажиров, а тележка с горячими напитками в
            проходе делает постороннего в вагоне риском. Пассажир с 2А остался с бокалом, и этот
            вопрос ещё впереди.
          refs: [sit_51, sto_011_5_5, sto_013_7_1_3]
      - id: refuse_friend_dry
        text: >-
          Говорю приятелю «Извините, в первый класс по билету другого класса пройти нельзя», и он
          уходит.
        effects: {loyalty: -5, safety: 10}
        competencies: {rules: 1}
        next: served_more
        debrief:
          verdict: ok
          why: >-
            Отказ сделан и с извинением, как требует стандарт, но причина названа через запрет, а
            не через заботу. Карточка 51 советует делать акцент на безопасности: вы не пускаете не
            потому, что жалко, а потому что в проходе тележка с горячими напитками.
          better: >-
            «Пропустить не могу: сейчас идёт обслуживание горячими напитками, посторонним в проходе
            небезопасно. Спасибо за понимание».
          refs: [sit_51, sto_011_10_3]
      - id: let_both_in
        text: >-
          Пропускаю обоих: «Только тихо и ненадолго», и отхожу к тележке.
        effects: {loyalty: 10, safety: -15}
        competencies: {safety: -2, rules: -2}
        next: aggressive
        debrief:
          verdict: bad
          why: >-
            Ловушка карточки 51: пропустить «на минутку». Двое нетрезвых в изолированном салоне
            первого класса, посторонний в проходе во время обслуживания с тележки, и всё это при
            соседке с 1С, которая уже просила помощи.
          better: >-
            Отказать через безопасность: в вагоне идёт обслуживание горячими напитками, посторонним
            здесь небезопасно.
          refs: [sit_51, sto_011_5_5]
      - id: refuse_rudely
        text: Говорю приятелю «Вам сюда нельзя, идите в свой вагон», без объяснений.
        effects: {loyalty: -15}
        competencies: {empathy: -2, rules: -1}
        next: aggressive
        debrief:
          verdict: bad
          why: >-
            Вторая ловушка карточки 51: отказ в форме «вам туда нельзя» без объяснения через
            безопасность. Стандарт требует при отказе извиниться и объяснить причину; вместо этого
            приятель услышал грубость, а пассажир с 2А заступился за него.
          better: >-
            «Понимаю Вас, но пропустить не могу: идёт обслуживание горячими напитками, посторонним
            в проходе небезопасно. Спасибо за понимание».
          refs: [sit_51, sto_011_10_3, sto_011_10_1]

  served_more:
    type: dialog
    text: >-
      Бокал опустел за пять минут. Пассажир зовёт вас через весь салон, требует ещё и предлагает
      выпить с ним; соседка с 1С отворачивается к окну.
    passenger_says: Ещё один! И себе налей, я угощаю!
    options:
      - id: now_call_chief
        text: >-
          Говорю «Одну минуту, сейчас подойду» и по радиосвязи нейтрально прошу начальника поезда
          подойти к месту 2А.
        when: {flags_none: [chief_informed]}
        escalation_target: chief
        effects: {safety: 10}
        competencies: {escalation: 2, safety: 1}
        set_flags: {chief_called: true}
        next: chief_comes
        debrief:
          verdict: best
          why: >-
            Ситуация ушла дальше просьбы о напитке: пассажир шумит на весь салон и зовёт вас пить.
            Карточка 6 требует сообщить начальнику поезда любым доступным способом, и вызов сделан
            нейтрально, без слов о состоянии пассажира при нём.
          refs: [sit_6, sto_011_10_6]
      - id: remind_chief_it_got_worse
        text: >-
          Говорю «Одну минуту», по радиосвязи начальнику поезда: «На 2А стало хуже, прошу
          подойти».
        when: {flags_all: {chief_informed: true}}
        escalation_target: chief
        effects: {safety: 10}
        competencies: {escalation: 2, safety: 1}
        set_flags: {chief_called: true}
        next: chief_comes
        debrief:
          verdict: best
          why: >-
            Начальник поезда уже знал о третьем бокале, теперь знает, что стало хуже, и идёт сам.
            Именно так карточка 50 описывает роль начальника: при угрозе конфликта решение о
            дальнейших напитках принимает он.
          refs: [sit_50, sit_6]
      - id: keep_serving
        text: >-
          Приношу ещё бокал: включено в билет, а спорить с ним себе дороже.
        effects: {loyalty: 5, safety: -30}
        competencies: {safety: -3, rules: -2}
        next: aggressive
        debrief:
          verdict: bad
          why: >-
            Каждый следующий бокал нетрезвому пассажиру это риск для него и для салона, и карточка
            50 не оставляет здесь выбора: при угрозе конфликта решает начальник поезда, а не
            бутылка. Пассажиру приятно ровно до следующей ссоры с соседями.
          better: Спокойно отказать и пригласить начальника поезда по радиосвязи нейтральной фразой.
          refs: [sit_50, sit_21]
      - id: ask_to_quiet_no_call
        text: >-
          Говорю «Прошу Вас соблюдать спокойствие и не создавать неудобств другим пассажирам» и
          возвращаюсь к тележке.
        effects: {loyalty: -5, safety: 5}
        competencies: {rules: 1}
        next: aggressive
        debrief:
          verdict: ok
          why: >-
            Рекомендованная реплика карточки 6 сказана, и это правильные слова. Но она рассчитана
            на поддержку бригады: о том, что пассажир шумит на весь салон, начальник поезда от вас
            не услышал, а нетрезвый человек просьбы не запомнил.
          better: Те же слова плюс нейтральный вызов начальника поезда по радиосвязи.
          refs: [sit_6]

  aggressive:
    type: dialog
    text: >-
      Пассажир вскочил в проход и кричит, что его тут за человека не считают, задел тележку с
      чашками; соседка с 1С вжалась в кресло.
    passenger_says: Ты кто такой, чтобы мне указывать?!
    options:
      - id: calm_phrase_call_ptb
        text: >-
          Говорю «Прошу Вас соблюдать спокойствие и не создавать неудобств другим пассажирам», по
          радиосвязи вызываю ПТБ и начальника поезда в первый вагон.
        when: {flags_none: [chief_called]}
        escalation_target: ptb
        effects: {loyalty: 5, safety: 15}
        competencies: {escalation: 2, safety: 2, rules: 1}
        set_flags: {chief_called: true}
        next: chief_comes
        debrief:
          verdict: best
          why: >-
            Реакция карточек 6 и 21 при нарушении порядка: рекомендованная реплика без спора и
            вызов сотрудников ПТБ вместе с начальником поезда. За безопасность пассажиров в бригаде
            отвечают именно они.
          refs: [sit_6, sit_21, sto_011_10_6]
      - id: calm_phrase_ptb_chief_on_way
        text: >-
          Говорю «Прошу Вас соблюдать спокойствие и не создавать неудобств другим пассажирам», по
          радиосвязи прошу ПТБ подойти: начальник поезда уже в пути.
        when: {flags_all: {chief_called: true}}
        escalation_target: ptb
        effects: {loyalty: 5, safety: 15}
        competencies: {escalation: 2, safety: 2, rules: 1}
        next: chief_comes
        debrief:
          verdict: best
          why: >-
            Начальник поезда уже идёт, но при агрессии в салоне карточки 6 и 21 велят привлечь и
            сотрудников ПТБ: они отвечают за безопасность пассажиров. Реплика карточки сказана без
            спора.
          refs: [sit_6, sit_21, sto_011_10_6]
      - id: police_at_station
        text: >-
          Говорю «На станции Вас встретят сотрудники полиции», по радиосвязи прошу начальника
          поезда вызвать ЛОВД на ближайшую станцию.
        escalation_target: police
        effects: {loyalty: -5, safety: 10}
        competencies: {escalation: 1, safety: 1}
        next: chief_comes
        debrief:
          verdict: ok
          why: >-
            ЛОВД карточка 6 упоминает «при необходимости», и агрессия в салоне это такой случай. Но
            полиция будет только на станции через пятьдесят минут, а сотрудники ПТБ и начальник
            поезда есть в составе сейчас, и их вы не вызвали.
          better: >-
            Сначала ПТБ и начальника поезда по радиосвязи, вопрос о полиции на станции решит
            начальник.
          refs: [sit_6, sto_011_10_6]
      - id: try_alone
        text: >-
          Беру его за локоть и веду на место: «Сядьте, пока не сняли с поезда».
        when: {safety_min: 50}
        effects: {loyalty: -5, safety: -15}
        competencies: {safety: -2, empathy: -1}
        next: ending_incident_scandal
        debrief:
          verdict: bad
          why: >-
            Физический контакт с агрессивным нетрезвым пассажиром это то, чего карточки 6 и 21
            велят избегать: не спорить и не провоцировать, а вызвать ПТБ. Пассажир вырвался, задел
            соседку, и случай стал происшествием.
          better: >-
            Не трогать пассажира, сказать реплику карточки и вызвать ПТБ с начальником поезда по
            радиосвязи.
          refs: [sit_6, sit_21]
      - id: leave_him_be
        text: >-
          Ухожу в служебное купе: перебесится сам, соседи потерпят.
        effects: {loyalty: -10, safety: -20}
        competencies: {safety: -3, escalation: -2}
        next: ending_incident_scandal
        debrief:
          verdict: bad
          why: >-
            Оставить агрессивного пассажира без внимания это ловушка карточек 6 и 21 и удар по
            соседям, за которых вы отвечаете. Начальник поезда узнал о происшествии от пассажиров,
            а не от вас.
          better: >-
            Вызвать ПТБ и начальника поезда по радиосвязи, оставаясь в салоне и не вступая в спор.
          refs: [sit_6, sit_21]

  calmer:
    type: dialog
    text: >-
      Пассажир сел обратно, ворчит, но уже тише. Просит хотя бы «чего-нибудь», раз вино не дают, и
      жалуется, что голоден.
    passenger_says: Ладно, ладно. Чаю тогда и закусить чего-нибудь.
    options:
      - id: tea_and_hot_snack
        text: >-
          Говорю «Позвольте предложить Вам чай и горячую закуску, принесу через пять минут», и
          приношу.
        when: {service_class: [first]}
        role_step: solution
        effects: {loyalty: 10}
        competencies: {empathy: 2, rules: 1, safety: 1}
        next: after_calm
        debrief:
          verdict: best
          why: >-
            Решение по ролевой модели вместо отказа: чай в первом классе доступен без ограничений,
            горячие закуски на месте входят в обслуживание, и пассажиру предложено то, что ему
            положено. Еда и чай помогают протрезветь, а разговор о вине закончился.
          refs: [sit_50, sto_011_7_4_10, sto_011_t2_food, model_role_steps]
      - id: tea_and_snack_by_class
        text: >-
          Говорю «Позвольте предложить Вам чай и закуску из того, что есть на борту, принесу через
          пять минут», и приношу.
        when: {service_class: [business, comfort, standard]}
        role_step: solution
        effects: {loyalty: 10}
        competencies: {empathy: 2, rules: 1, safety: 1}
        next: after_calm
        debrief:
          verdict: best
          why: >-
            Решение по ролевой модели вместо отказа: чай и закуска, которые положены по классу,
            вместо вина. Еда помогает протрезветь, а разговор о вине закончился, и пассажир не
            остался с ощущением, что ему просто отказали.
          refs: [sit_50, sto_011_t2_food, model_role_steps]
      - id: tea_and_send_to_bistro
        text: >-
          Говорю «Чай принесу, а поесть можно в вагоне-бистро, он открыт весь путь», и он
          собирается туда.
        effects: {loyalty: 5, safety: -5}
        competencies: {empathy: 1}
        next: after_calm
        debrief:
          verdict: ok
          why: >-
            Бистро действительно открыто на всём пути, и это честная альтернатива. Но нетрезвый
            пассажир идёт туда один, а запретить ему купить там вино проводник не вправе, о чём
            прямо говорит карточка 50: закуска на месте была бы безопаснее.
          better: >-
            Предложить чай и закуску на месте, как положено по классу, и не отправлять его в бистро
            одного.
          refs: [sit_50, sto_011_7_4_13]
      - id: serve_wine_now_calm
        text: >-
          Раз успокоился, приношу бокал: «Включено же, только это последний».
        when: {flags_all: {refused: true}}
        effects: {loyalty: 10, safety: -20}
        competencies: {rules: -2, safety: -3}
        next: after_calm
        debrief:
          verdict: bad
          why: >-
            Вы уже отказали по карточке 50, и отказ сработал: пассажир успокоился. Налить сейчас
            значит перечеркнуть собственное правило и снова дать алкоголь нетрезвому человеку; про
            «последний» он не вспомнит.
          better: >-
            Держаться сказанного: чай и закуска, вино в этот вечер закончилось.
          refs: [sit_50, sit_21]
      - id: walk_away_busy
        text: Говорю «Позже, сейчас некогда» и ухожу к другим пассажирам.
        effects: {loyalty: -10, safety: -5}
        competencies: {empathy: -2}
        next: after_calm
        debrief:
          verdict: bad
          why: >-
            Пассажир пошёл навстречу, а в ответ услышал отказ без причины. Стандарт требует
            ответить на просьбу или извиниться и объяснить причину отказа; голодный и обиженный
            нетрезвый пассажир вернётся к прежнему тону.
          better: >-
            Принести чай и закуску, как положено по классу, или хотя бы сказать, когда подойдёте.
          refs: [sto_011_10_3, sit_50]

  after_calm:
    type: dialog
    text: >-
      Чай и закуска сделали своё: пассажир откинулся в кресле и задремал. Соседка с 1С благодарит
      вас шёпотом. До Санкт-Петербурга сорок минут.
    passenger_says: Спасибо... устал я, вы правы.
    options:
      - id: assure_and_brief_chief
        text: >-
          Говорю «Благодарю Вас за понимание, отдыхайте», а подошедшему начальнику поезда коротко
          докладываю: третий бокал, шумел, после отказа и чая успокоился.
        when: {flags_all: {chief_called: true}}
        role_step: assure
        effects: {loyalty: 10, safety: 10}
        competencies: {empathy: 2, escalation: 1, rules: 1}
        next: ending_settled
        debrief:
          verdict: best
          why: >-
            Заверение по ролевой модели закрывает разговор с пассажиром, а начальник поезда
            получает факты без оценок: он решает, подавать ли пассажиру напитки дальше, как
            описывает карточка 50.
          refs: [sit_50, model_role_steps]
      - id: assure_and_inform_chief
        text: >-
          Говорю «Благодарю Вас за понимание, отдыхайте» и по радиосвязи спокойно докладываю
          начальнику поезда: пассажир на 2А просил вино в нетрезвом виде, получил отказ и чай,
          сейчас спокоен.
        when: {flags_none: [chief_called]}
        role_step: assure
        escalation_target: chief
        effects: {loyalty: 10, safety: 10}
        competencies: {empathy: 2, escalation: 1, rules: 1}
        next: ending_settled
        debrief:
          verdict: best
          why: >-
            Конфликта не вышло, но карточка 50 требует предупредить начальника поезда, если
            пассажиру с признаками опьянения положен алкоголь по билету: следующую просьбу он
            получит уже с вашими сведениями. Заверение по ролевой модели закрывает разговор.
          refs: [sit_50, sit_6, model_role_steps]
      - id: brief_chief_dry
        text: >-
          Подошедшему начальнику поезда коротко излагаю, что было, а с пассажиром не говорю: спит,
          и ладно.
        when: {flags_all: {chief_called: true}}
        effects: {safety: 10}
        competencies: {escalation: 1, rules: 1}
        next: ending_settled
        debrief:
          verdict: ok
          why: >-
            Факты переданы, начальник поезда решит о напитках дальше. Но пассажир, который пошёл
            навстречу, не услышал ни слова благодарности: ролевая модель заканчивается заверением,
            а не молчанием.
          better: Сначала «Благодарю Вас за понимание, отдыхайте», затем доклад начальнику поезда.
          refs: [sit_50, model_role_steps]
      - id: thank_only_no_report
        text: >-
          Говорю «Благодарю Вас за понимание, отдыхайте». Начальнику поезда не сообщаю: обошлось.
        when: {flags_none: [chief_called]}
        role_step: assure
        effects: {loyalty: 10}
        competencies: {empathy: 2}
        next: ending_settled
        debrief:
          verdict: ok
          why: >-
            Заверение сказано, пассажир доволен. Но карточка 50 прямо требует предупредить
            начальника поезда, когда нетрезвому пассажиру алкоголь положен по билету: через полчаса
            он проснётся и попросит снова, а бригада ничего не знает.
          better: Те же слова пассажиру и короткий доклад начальнику поезда по радиосвязи.
          refs: [sit_50, sit_6]
      - id: leave_him_sleep
        text: >-
          Ухожу, ничего не сказав ни пассажиру, ни начальнику поезда: спит, значит, вопрос закрыт.
        effects: {loyalty: -5, safety: -10}
        competencies: {empathy: -1, safety: -1}
        next: ending_settled
        debrief:
          verdict: bad
          why: >-
            Вопрос не закрыт: нетрезвый пассажир проснётся и попросит снова, а начальник поезда о
            нём не знает; соседка, которая просила помощи, не услышала ни слова. Карточка 50
            требует предупредить начальника, ролевая модель требует заверить.
          better: «Благодарю Вас за понимание, отдыхайте» пассажиру и доклад начальнику поезда.
          refs: [sit_50, model_role_steps]

  chief_comes:
    type: dialog
    text: >-
      Начальник поезда у места 2А. Пассажир притих и косится на вас, соседка с 1С выдохнула;
      начальник ждёт короткого доклада.
    passenger_says: Ну и что вы ему про меня наговорили?
    options:
      - id: brief_chief_facts
        text: >-
          Докладываю факты без оценок: третий бокал, громкая речь, задел тележку; пассажиру говорю
          «Дальше с Вами поговорит начальник поезда».
        effects: {loyalty: 5, safety: 10}
        competencies: {escalation: 2, rules: 1}
        next: ending_chief_decides
        debrief:
          verdict: best
          why: >-
            Начальнику поезда нужны факты, а не ярлыки: по ним он решает, подавать ли напитки
            дальше и нужны ли ПТБ, как описывает карточка 50. Пассажир слышит, что о нём говорят
            без оценок, и не получает нового повода для ссоры.
          refs: [sit_50, sit_6]
      - id: refer_to_earlier_warning
        text: >-
          Напоминаю начальнику поезда, что предупреждал его по радиосвязи о третьем бокале, и
          докладываю, что изменилось с тех пор.
        when: {flags_all: {chief_informed: true}}
        effects: {loyalty: 5, safety: 10}
        competencies: {escalation: 2, rules: 1}
        next: ending_chief_decides
        debrief:
          verdict: best
          why: >-
            Предупреждение, которое требует карточка 50 при включённом в билет алкоголе, было
            сделано вовремя, и теперь у начальника поезда полная картина: что было и что стало.
            Решение о напитках и о ПТБ за ним.
          refs: [sit_50]
      - id: let_chief_ask
        text: >-
          Молча отступаю: пусть начальник поезда сам расспросит пассажира и соседей.
        effects: {safety: 5}
        next: ending_chief_decides
        debrief:
          verdict: ok
          why: >-
            Начальник поезда разберётся, но потратит время на расспросы, а факты о бокалах и
            тележке видели вы. Карточки 6 и 50 ставят вас в цепочку: сообщить, а не только позвать.
          better: >-
            Коротко доложить факты без оценок и сказать пассажиру, что дальше с ним говорит
            начальник поезда.
          refs: [sit_6, sit_50]
      - id: thank_for_patience
        text: >-
          Говорю пассажиру «Благодарю Вас за терпение, дальше с Вами поговорит начальник поезда»,
          факты начальнику не докладываю.
        when: {loyalty_min: 60}
        role_step: assure
        effects: {loyalty: 10}
        competencies: {empathy: 2}
        next: ending_chief_decides
        debrief:
          verdict: ok
          why: >-
            Заверение по ролевой модели уместно: пассажир ещё готов слушать, и вы закрыли свою
            часть разговора вежливо. Но начальник поезда остался без ваших фактов и будет собирать
            их у соседей.
          better: Сначала факты начальнику поезда без оценок, потом заверение пассажиру.
          refs: [model_role_steps, sit_50]
      - id: brief_with_labels
        text: >-
          Говорю начальнику поезда при всех: «Он пьяный в хлам, хамит, я с ним больше не
          работаю».
        effects: {loyalty: -10, safety: 5}
        competencies: {empathy: -2, rules: -1}
        next: ending_chief_decides
        debrief:
          verdict: bad
          why: >-
            Ярлыки при пассажире это провокация, о которой предупреждает карточка 6, и нарушение
            норм этики: начальник поезда получил эмоции вместо фактов, а пассажир новый повод для
            скандала.
          better: >-
            Факты без оценок: сколько бокалов, что делал, кого задел.
          refs: [sit_6, sto_011_10_1]

  ending_settled:
    type: ending
    title: Вечер в первом классе
    text: >-
      Пассажир проспал до Санкт-Петербурга и вышел сам; соседка с 1С поблагодарила вас на выходе.
      О том, что было в салоне, бригада знает ровно столько, сколько вы доложили.
    debrief:
      summary: >-
        Конфликт погашен словами: отказ с альтернативой, правило через заботу, чай вместо вина.
        Исход зависит от того, знал ли начальник поезда о нетрезвом пассажире с включённым в билет
        алкоголем, как требует карточка 50.
      refs: [sit_50, sit_6]

  ending_chief_decides:
    type: ending
    title: Решение за начальником поезда
    text: >-
      Начальник поезда поговорил с пассажиром: напитков ему в этом рейсе больше не подают,
      сотрудники ПТБ до Санкт-Петербурга заглядывают в вагон. Соседка с 1С пересела ближе к вам.
    debrief:
      summary: >-
        Бригада подключена, и это правильно по карточкам 6 и 21: при нарушении порядка решают
        начальник поезда и ПТБ. Шкалы показывают, сколько стоили слова по радиосвязи и минуты до
        вызова.
      refs: [sit_6, sit_21, sto_011_10_6]

  ending_incident_scandal:
    type: ending
    title: ЛОВД на станции
    text: >-
      На станции пассажира встретили сотрудники ЛОВД, соседка с 1С написала жалобу на шум и на
      проводника, который «ничего не сделал» или «схватил человека». Начальник поезда оформил
      рапорт, вас ждёт разбор.
    forced_outcome: incident
    debrief:
      summary: >-
        Агрессивный нетрезвый пассажир без ПТБ и начальника поезда это происшествие: карточки 6 и
        21 велят не спорить, не трогать и вызвать бригаду по радиосвязи, а решение о полиции
        оставить начальнику.
      refs: [sit_6, sit_21]
