id: panic_attack
version: 1
title: Не могу дышать
summary: >-
  Пассажирке бизнес-класса не хватает воздуха: она едет против хода, её укачало, и начинается
  паника; до Москвы тридцать пять минут, начальник поезда в головном вагоне.
source_situations: [29, 45, 46, 28]
difficulty: 3
critical: false
tags: [медицина, паника, бизнес, планшет]
competencies: [medical, empathy, escalation, solution]
role_model: true
estimated_minutes: 4
context:
  service_class: business
  segment: участок Тверь, Москва, через десять минут после Твери
  next_station_minutes: 35
  time_of_day: вечер
  passenger:
    label: женщина лет тридцати на месте 5А, сидит против хода движения
    state: дышит часто, держится за горло, просит открыть окно
  crew_available: [chief, medics_station, police]
  loyalty_of: пассажирка на месте 5А и соседи по ряду
start:
  node: intro
  loyalty: 60
  safety: 70
  flags: {}
# образцовый исход требует, чтобы начальник поезда узнал о случае хотя бы к концу: дыхание по
# квадрату без доклада и ловушки карточек 28, 29, 45 и 46 не добирают безопасности до порога
outcome_rules:
  exemplary_if: {safety_min: 95, loyalty_min: 85}
nodes:
  intro:
    type: dialog
    text: Пассажирка на 5А вскочила, хватает ртом воздух и просит открыть окно.
    passenger_says: Не могу вдохнуть... откройте!
    timer:
      seconds: 20
      on_expire:
        next: rushes_vestibule
        effects: {loyalty: -10, safety: -15}
        competencies: {medical: -1, empathy: -1}
        debrief:
          why: >-
            Вы медлили, и паника взяла верх: пассажирка бросилась в тамбур к двери. Карточка 29
            требует не оставлять её без внимания, а карточка 45 давать чёткие формулировки сразу.
          better: Сразу «Я рядом, сейчас помогу», усадить, дышать вместе и принести воды.
          refs: [sit_29, sit_45]
    options:
      - id: sit_breathe_water
        text: «Я рядом, сейчас помогу Вам. Присядьте, дышите спокойно, принесу воды», усаживаю её.
        role_step: acknowledge
        effects: {loyalty: 10, safety: 10}
        competencies: {medical: 2, empathy: 2}
        next: breathing
        debrief:
          verdict: best
          why: >-
            Реплика карточки 29 почти дословно: спокойный голос, пассажирка усажена, вода обещана,
            она не одна. Признание из ролевой модели здесь звучит как «я рядом».
          refs: [sit_29, model_role_steps]
      - id: ask_history_first
        text: «Понимаю Вас. Такое уже бывало?», усаживаю её и жду ответа.
        role_step: acknowledge
        effects: {loyalty: 5, safety: 5}
        competencies: {medical: 1, empathy: 1}
        next: breathing
        debrief:
          verdict: ok
          why: >-
            Совет карточки 29 уточнить, бывало ли такое раньше, выполнен, и пассажирка сидит. Но
            воды и слов о том, что вы поможете, она не услышала, а дышать спокойно ей никто не
            помог.
          better: >-
            «Я рядом, сейчас помогу Вам. Присядьте, дышите спокойно, принесу воды», и уже потом
            вопрос, бывало ли раньше.
          refs: [sit_29]
      - id: offer_sedative
        text: >-
          Даю ей свою таблетку успокоительного: «Выпейте, полегчает».
        effects: {loyalty: 5, safety: -30}
        competencies: {medical: -3}
        next: worse
        debrief:
          verdict: bad
          why: >-
            Ловушка карточек 28 и 29: личное лекарство пассажиру. Реакция на препарат неизвестна,
            а ответственность за неё ляжет на вас.
          better: >-
            «Сожалею, но на борту отсутствуют медикаменты»: вода, дыхание вместе, начальник
            поезда.
          refs: [sit_28, sit_29]
      - id: call_police_disturbance
        text: >-
          По рации прошу вызвать ЛОВД: она кричит и мешает вагону.
        escalation_target: police
        effects: {loyalty: -20, safety: -10}
        competencies: {escalation: -2, empathy: -2}
        next: escalate_wrong
        debrief:
          verdict: bad
          why: >-
            Паническая атака это состояние здоровья, а не нарушение порядка: карточка 29 называет
            адресатом начальника поезда, а не полицию. Пассажирка услышала слово «полиция» и
            испугалась ещё сильнее.
          better: Уведомить начальника поезда, оставаясь рядом, и помогать дышать.
          refs: [sit_29, sto_011_10_6]

  rushes_vestibule:
    type: dialog
    text: >-
      Не дождавшись ответа, она бросилась в тамбур и дёргает ручку двери, чтобы «выйти на
      воздух». Двое пассажиров пошли следом и стоят в дверях.
    passenger_says: Откройте дверь! Я задыхаюсь!
    options:
      - id: follow_and_calm
        text: >-
          Беру её за руку и отвожу от двери: «Пожалуйста, сохраняйте спокойствие. Дверь на ходу не
          открывается, это безопасно. Дышим вместе: вдох на четыре счёта».
        effects: {loyalty: 5, safety: 10}
        competencies: {medical: 2, empathy: 2}
        next: breathing
        debrief:
          verdict: best
          why: >-
            Реплика карточки 45 и чёткие слова вместо расплывчатых: причина, по которой дверь не
            откроется, названа, и пассажирка получила простое действие, дыхание на счёт. Она
            отведена от двери и не одна.
          refs: [sit_45, sit_29, sto_011_10_3]
      - id: ask_neighbor_stay_call_chief
        text: Прошу мужчину из тамбура побыть рядом с ней, а сам по рации зову начальника поезда.
        escalation_target: chief
        effects: {loyalty: -5, safety: 5}
        competencies: {escalation: 1, empathy: -1}
        next: breathing
        debrief:
          verdict: ok
          why: >-
            Начальник поезда уведомлён, как советует карточка 29, но пассажирку в панике вы
            оставили на постороннего, а карточка требует находиться рядом самому.
          better: >-
            Отвести от двери, остаться рядом и вызвать начальника поезда по радиосвязи, не
            отходя.
          refs: [sit_29]
      - id: let_her_be
        text: >-
          Не мешаю: пусть подышит в тамбуре, там прохладнее, а я вернусь к тележке.
        effects: {safety: -20}
        competencies: {medical: -2, empathy: -1}
        next: ending_panic_spread
        debrief:
          verdict: bad
          why: >-
            Оставить без внимания это первая ловушка карточки 29: пассажирка в панике у двери, а
            рядом никого из бригады. Люди в тамбуре подхватят панику раньше, чем вы вернётесь.
          better: Остаться рядом, отвести от двери, дышать вместе.
          refs: [sit_29, sit_45]
      - id: shout_back
        text: Кричу «Прекратите истерику, дверь не откроется!».
        effects: {loyalty: -15}
        competencies: {empathy: -2}
        next: ending_panic_spread
        debrief:
          verdict: bad
          why: >-
            Раздражение на паникующего пассажира карточка 45 относит к тому, что роняет доверие, а
            нормы этики не допускают крика. Формулировка к тому же расплывчатая: что делать,
            пассажирка не услышала.
          better: >-
            Спокойно: «Пожалуйста, сохраняйте спокойствие, дверь на ходу не открывается. Дышим
            вместе».
          refs: [sit_45, sto_011_10_1]

  worse:
    type: dialog
    text: >-
      Через несколько минут ей стало хуже: кружится голова, речь замедлилась. Соседка с 5В
      спрашивает, что вы ей дали.
    passenger_says: Мне... плохо... что это было?
    options:
      - id: call_chief_report_pill
        text: >-
          Зову начальника поезда по рации, сразу называю таблетку и время, прошу заказать медиков к
          поезду в Москве.
        escalation_target: chief
        effects: {loyalty: -5, safety: 10}
        competencies: {escalation: 2, medical: 1}
        next: breathing
        debrief:
          verdict: best
          why: >-
            После ошибки единственно верный ход: начальник поезда и медики должны знать о препарате
            до того, как начнут помогать. Скрывать уже нечего, а медики на станции по карточке 28
            вызываются заранее.
          refs: [sit_28, sit_29]
      - id: medics_station_silent
        text: >-
          Прошу начальника поезда заказать осмотр медиками в Москве, про таблетку молчу до их
          прихода.
        escalation_target: medics_station
        effects: {safety: 5}
        competencies: {escalation: 1, medical: -1}
        next: breathing
        debrief:
          verdict: ok
          why: >-
            Медики заказаны, и это правильно. Но они приедут лечить вслепую: о таблетке знаете
            только вы, и молчание до станции продлевает риск.
          better: Сказать начальнику поезда о препарате сразу, вместе с заявкой на медиков.
          refs: [sit_28]
      - id: continue_alone_no_report
        text: Никому не сообщаю о таблетке, усаживаю её и жду, что пройдёт.
        effects: {safety: -20}
        competencies: {medical: -3, escalation: -2}
        next: ending_incident_sedative
        debrief:
          verdict: bad
          why: >-
            Пассажирке хуже после вашего лекарства, а бригада и медики об этом не узнают: скрытое
            нарушение карточки 28 превращается в происшествие с разбором.
          better: Вызвать начальника поезда, назвать препарат и время, заказать медиков на станцию.
          refs: [sit_28]

  escalate_wrong:
    type: dialog
    text: >-
      По радиосвязи отвечает начальник поезда: полиции в составе нет, он идёт сам. Пассажирка
      услышала слово «полиция» и плачет ещё сильнее; соседи возмущены.
    passenger_says: Полицию? На меня? Я же просто не могу дышать!
    options:
      - id: apologise_correct
        text: >-
          Говорю «Простите, я ошибся. Я Вас понимаю, я рядом: присядьте, дышим спокойно, сейчас
          принесу воды».
        role_step: acknowledge
        effects: {loyalty: 10, safety: 5}
        competencies: {empathy: 2, medical: 1}
        next: breathing
        debrief:
          verdict: best
          why: >-
            Ошибка признана вслух, и дальше всё по карточке 29: спокойный голос, пассажирка
            усажена, вода, вы рядом. Признание из ролевой модели возвращает доверие быстрее, чем
            оправдания.
          refs: [sit_29, model_role_steps]
      - id: wait_for_chief
        text: >-
          Жду начальника поезда у служебного купе, к пассажирке не подхожу: он разберётся.
        effects: {loyalty: -5}
        competencies: {empathy: -1}
        next: breathing
        debrief:
          verdict: ok
          why: >-
            Начальник поезда идёт, но пассажирка в панике остаётся одна ещё несколько минут, а
            карточка 29 требует находиться рядом и не оставлять без внимания.
          better: Подойти, извиниться за слово «полиция» и помогать дышать до прихода начальника.
          refs: [sit_29]
      - id: insist
        text: Говорю «Вы мешаете пассажирам, сидите тихо до станции».
        effects: {loyalty: -15, safety: -10}
        competencies: {empathy: -2, medical: -1}
        next: ending_panic_spread
        debrief:
          verdict: bad
          why: >-
            Раздражение на паникующего человека и угроза вместо помощи: карточки 29 и 45 требуют
            спокойствия и чётких слов, а нормы этики не допускают такого тона. Паника в вагоне
            только выросла.
          better: Признать ошибку, усадить, дышать вместе, принести воды.
          refs: [sit_45, sit_29, sto_011_10_1]

  breathing:
    type: dialog
    text: >-
      Она сидит, но дышит часто и держится за горло; пробует говорить и сбивается. В конце вагона
      ждёт тележка с ужином.
    passenger_says: Мне кажется, я сейчас упаду... не уходите.
    options:
      - id: square_breathing_notify
        text: >-
          Говорю «Информирую Вас: это пройдёт. Дышим по квадрату: вдох на четыре счёта, пауза,
          выдох, пауза. Я рядом», и, не отходя, по радиосвязи тихо сообщаю начальнику поезда, что
          пассажирке на 5А плохо и я с ней.
        role_step: rule
        escalation_target: chief
        effects: {loyalty: 10, safety: 10}
        competencies: {medical: 2, empathy: 1, escalation: 2, solution: 1}
        set_flags: {chief_notified: true}
        next: distraction
        debrief:
          verdict: best
          why: >-
            Дыхание по квадрату из совета карточки 29 это чёткая инструкция, которую карточка 45
            ставит выше утешений, а начальник поезда уведомлён, не отходя от пассажирки. Она
            слышит, что это состояние проходит и что вы остаётесь.
          refs: [sit_29, sit_45, model_role_steps]
      - id: square_breathing_only
        text: >-
          Говорю «Информирую Вас: это пройдёт. Дышим по квадрату: вдох на четыре счёта, пауза,
          выдох, пауза. Я рядом». Начальнику поезда не сообщаю.
        role_step: rule
        effects: {loyalty: 10, safety: 5}
        competencies: {medical: 2, empathy: 1, solution: 1}
        next: distraction
        debrief:
          verdict: ok
          why: >-
            Дыхание по квадрату и спокойные слова работают, пассажирка не одна. Но совет карточки
            29 уведомить начальника поезда не выполнен: если станет хуже, бригада узнает об этом
            последней, и без доклада хотя бы в конце рейс образцовым не станет.
          better: >-
            Те же слова плюс тихое сообщение начальнику поезда по радиосвязи, не отходя от
            пассажирки.
          refs: [sit_29, sit_45]
      - id: promise_return_and_leave
        text: >-
          Говорю «Я уточню и вернусь к Вам» и ухожу к тележке: ужин ждут полвагона.
        role_step: solution
        effects: {loyalty: 5}
        competencies: {solution: 1}
        set_flags: {promised_return: true}
        delayed:
          - steps: 2
            effects: {loyalty: -15}
            text: Вы так и не вернулись, пассажирка ждала обещанного и снова начала задыхаться.
            unless_flags: {returned: true}
        next: distraction
        debrief:
          verdict: ok
          why: >-
            Фраза из ролевой модели уместна, но она обязывает вернуться: карточка 46 напоминает,
            что подойти позже нужно обязательно. Пассажирку в панике вы всё же оставили одну на
            несколько минут, хотя карточка 29 просит не оставлять без внимания.
          better: Остаться рядом, дышать вместе, а тележку доверить коллеге или отложить.
          refs: [sit_46, sit_29, model_role_steps]
      - id: vague_reassurance
        text: Говорю «Да всё с вами нормально, не накручивайте себя» и отхожу.
        effects: {loyalty: -10, safety: -10}
        competencies: {empathy: -2, medical: -1}
        next: distraction
        debrief:
          verdict: bad
          why: >-
            Расплывчатые слова вместо инструкции это ловушка карточки 45, а уход от пассажирки в
            панике ловушка карточки 29. Она не поняла, что делать, и осталась одна.
          better: >-
            «Дышим по квадрату: вдох на четыре счёта, пауза, выдох, пауза. Я рядом».
          refs: [sit_45, sit_29]

  distraction:
    type: dialog
    text: >-
      Дыхание выравнивается, но она вцепилась в подлокотник и боится, что «накатит снова». Просит
      чем-нибудь отвлечься.
    passenger_says: Мне бы отвлечься чем-нибудь... и воды, если можно.
    options:
      - id: offer_tablet_water
        text: >-
          Говорю «Позвольте предложить Вам воду с лимоном и планшет: фильм или музыка, что
          захотите», приношу и остаюсь рядом на минуту.
        when: {service_class: [business, first]}
        role_step: solution
        effects: {loyalty: 10, safety: 5}
        competencies: {solution: 2, medical: 1}
        set_flags: {returned: true}
        next: check_back
        debrief:
          verdict: best
          why: >-
            Совет карточки 29 отвлечь пассажира и карточки 46 предложить воду с лимоном, а планшет
            по запросу в бизнесе и первом классе положен по стандарту. Пассажирка занята делом, а
            не страхом.
          refs: [sit_29, sit_46, sto_011_t2_entertainment]
      - id: offer_magazine_water
        text: >-
          Говорю «Позвольте предложить Вам воду и журнал, чтобы отвлечься», приношу и остаюсь
          рядом на минуту.
        when: {service_class: [standard, comfort]}
        role_step: solution
        effects: {loyalty: 5, safety: 5}
        competencies: {solution: 2, medical: 1}
        set_flags: {returned: true}
        next: check_back
        debrief:
          verdict: best
          why: >-
            Совет карточки 29 отвлечь пассажира выполнен тем, что есть в вагоне: планшета в этом
            классе нет, а вода доступна на всём пути в любом классе.
          refs: [sit_29, sto_013_7_1_2]
      - id: seat_forward_offer
        text: >-
          Говорю «Позвольте предложить Вам пересесть по ходу движения, так меньше укачивает», и
          приношу воду.
        role_step: solution
        effects: {loyalty: 5, safety: 5}
        competencies: {solution: 1, medical: 1}
        set_flags: {returned: true}
        next: check_back
        debrief:
          verdict: ok
          why: >-
            Реакция карточки 46: место по ходу движения и вода, укачивание уходит. Но отвлечь
            пассажирку, как советует карточка 29, вы не предложили, и страх «накатит снова»
            остался с ней.
          better: Пересадка по ходу движения плюс вода с лимоном и планшет или журнал.
          refs: [sit_46, sit_29]
      - id: return_to_passenger
        text: >-
          Возвращаюсь, как обещал: «Я вернулся, вот вода. Как Вы?», и сажусь рядом.
        when: {flags_all: {promised_return: true}}
        effects: {loyalty: 5, safety: 5}
        competencies: {solution: 1}
        set_flags: {returned: true}
        next: check_back
        debrief:
          verdict: ok
          why: >-
            Обещание «я вернусь» выполнено, и карточка 46 ставит это обязательным: пассажирка
            дождалась. Но отвлечь её вы не предложили, а планшет или журнал под рукой.
          better: Вернуться с водой и сразу предложить планшет или журнал.
          refs: [sit_46, sit_29]
      - id: continue_service
        text: >-
          Говорю «Вам уже лучше, отдыхайте» и ухожу к тележке: ужин ждут.
        effects: {loyalty: -5, safety: -10}
        competencies: {empathy: -1, medical: -1}
        next: check_back
        debrief:
          verdict: bad
          why: >-
            Просьба о воде и отвлечении осталась без ответа, а неотложное здесь важнее ужина:
            неотложные просьбы выполняются в приоритетном порядке. Страх вернулся, как только вы
            отошли.
          better: >-
            Принести воду, предложить планшет или журнал и только потом вернуться к тележке.
          refs: [sto_011_10_4, sit_29]

  check_back:
    type: dialog
    text: >-
      Через десять минут вы снова у места 5А: она спокойнее, но бледна, руки дрожат. До Москвы
      двадцать минут.
    passenger_says: Кажется, отпускает. Спасибо, что не ушли.
    options:
      - id: close_with_chief
        text: >-
          Говорю «Благодарю Вас за доверие, отдыхайте до Москвы, я рядом», по радиосвязи
          докладываю начальнику поезда: пассажирке лучше, медики не нужны.
        when: {flags_all: {chief_notified: true}}
        role_step: assure
        effects: {loyalty: 10, safety: 5}
        competencies: {empathy: 2, escalation: 1, medical: 1}
        next: ending_calm
        debrief:
          verdict: best
          why: >-
            Совет карточки 46 подойти позже выполнен, заверение по ролевой модели сказано, а
            начальник поезда, который знал о случае, получил его завершение: бригада не держит
            открытый вопрос.
          refs: [sit_46, sit_29, model_role_steps]
      - id: assure_and_report_late
        text: >-
          Говорю «Благодарю Вас за доверие, отдыхайте до Москвы, я рядом» и по радиосвязи впервые
          сообщаю начальнику поезда о случае.
        when: {flags_none: [chief_notified]}
        role_step: assure
        escalation_target: chief
        effects: {loyalty: 10, safety: 5}
        competencies: {empathy: 2, escalation: 1, medical: 1}
        next: ending_calm
        debrief:
          verdict: best
          why: >-
            Совет карточки 46 подойти позже выполнен, заверение сказано, и начальник поезда
            наконец знает о пассажирке: поздно, но до станции, где ей может понадобиться помощь.
          refs: [sit_46, sit_29, model_role_steps]
      - id: ask_how_feel_only
        text: Говорю «Благодарю Вас за доверие. Как Вы сейчас?» и выслушиваю; бригаде ничего не сообщаю.
        role_step: assure
        effects: {loyalty: 10}
        competencies: {empathy: 2}
        next: ending_calm
        debrief:
          verdict: ok
          why: >-
            Вы подошли позже, как требует карточка 46, и закрыли разговор заверением. Но начальник
            поезда о пассажирке, которой было плохо, так и не знает или не знает, чем всё
            кончилось.
          better: Те же слова пассажирке и короткий доклад начальнику поезда по радиосвязи.
          refs: [sit_46, sit_29]
      - id: station_medics_if_needed
        text: >-
          Прошу начальника поезда заказать осмотр медиками на станции в Москве, пассажирке говорю,
          что её встретят.
        escalation_target: medics_station
        effects: {safety: 5}
        competencies: {medical: 1, escalation: 1}
        next: ending_calm
        debrief:
          verdict: ok
          why: >-
            Медики на станции по карточке 28 вызываются заранее, и осторожность понятна. Но
            пассажирке уже лучше, а слов благодарности за доверие она не услышала: заверение из
            ролевой модели пропущено.
          better: >-
            Сначала «Благодарю Вас за доверие. Как Вы сейчас?», медиков предложить, если ей не
            лучше.
          refs: [sit_28, model_role_steps]
      - id: skip_check
        text: >-
          Вижу издалека, что она сидит спокойно, и не подхожу: работы много.
        effects: {loyalty: -10, safety: -10}
        competencies: {empathy: -2, medical: -1}
        next: ending_calm_formal
        debrief:
          verdict: bad
          why: >-
            Ловушка карточки 46: не подойти позже. Пассажирка ждала, что вы спросите, как она, а вы
            решили за неё издалека; если бы стало хуже, никто бы не заметил.
          better: Подойти, спросить «Как Вы сейчас?» и доложить начальнику поезда.
          refs: [sit_46, sit_29]

  ending_calm:
    type: ending
    title: Спокойно до Москвы
    text: >-
      Пассажирка доехала спокойно, на выходе в Москве поблагодарила вас. Начальник поезда отметил
      случай в журнале, медики не понадобились.
    debrief:
      summary: >-
        Паника снята словами и действиями из карточек 29, 45 и 46: усадить, дышать вместе, вода,
        планшет, вернуться позже и не оставлять одну. Шкалы показывают, что стоили минуты
        промедления и слова.
      refs: [sit_29, sit_45, sit_46]

  ending_calm_formal:
    type: ending
    title: Доехала сама
    text: >-
      Пассажирка доехала, но проводника после первых минут больше не видела; на выходе прошла мимо,
      не глядя.
    debrief:
      summary: >-
        Помощь была, а возвращения не было: карточка 46 обязывает подойти позже и спросить, как
        самочувствие, и без этого шага доверие не возвращается.
      refs: [sit_46, sit_29]

  ending_panic_spread:
    type: ending
    title: Паника в тамбуре
    text: >-
      Пассажирка обессилела у двери тамбура, вокруг собрались люди, кто-то снимал на телефон.
      Начальник поезда вызвал медиков на станцию и записал жалобу соседей на проводника.
    debrief:
      summary: >-
        Оставленная без внимания паника захватила тамбур: карточка 29 требует не оставлять
        пассажира, карточка 45 давать чёткие спокойные формулировки. Крик и уход это ловушки
        обеих.
      refs: [sit_29, sit_45]

  ending_incident_sedative:
    type: ending
    title: Разбор из-за таблетки
    text: >-
      На станции медики выяснили, что пассажирка приняла препарат от проводника, а бригада об этом
      не знала. Начальник поезда оформил рапорт, вас ждёт разбор.
    forced_outcome: incident
    debrief:
      summary: >-
        Личное лекарство пассажиру и умолчание о нём это происшествие независимо от исхода:
        правило карточки 28 без исключений.
      refs: [sit_28]
