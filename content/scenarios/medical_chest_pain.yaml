id: medical_chest_pain
version: 4
title: Давит в груди
summary: >-
  Пассажиру бизнес-класса плохо, стоянка по расписанию через двенадцать минут, начальник поезда
  в своём купе в головном вагоне.
source_situations: [19, 28]
difficulty: 3
critical: true
tags: [медицина, эскалация, бизнес]
competencies: [medical, escalation, empathy, rules]
role_model: true
estimated_minutes: 4
context:
  service_class: business
  segment: участок Тверь, Санкт-Петербург, перегон после Твери
  next_station_minutes: 12
  time_of_day: утро
  passenger:
    label: мужчина лет шестидесяти на месте 7В
    state: бледен, держится за грудь, дышит часто
  crew_available: [chief, pa_announcement, medics_station]
  escalation_expected_by_step: 1
  loyalty_of: пассажир на месте 7В и его соседи по ряду
start:
  node: intro
  loyalty: 60
  safety: 70
  flags: {}
# образцовый исход только без ловушек карточек 19 и 28: порог выше умолчаний rules.yaml
outcome_rules:
  exemplary_if: {safety_min: 90, loyalty_min: 80}
nodes:
  intro:
    type: dialog
    text: >-
      Соседка с ряда 7 машет вам: пассажиру на 7В плохо, он держится за грудь.
    passenger_says: Мне что-то нехорошо, давит в груди.
    timer:
      seconds: 20
      on_expire:
        next: collapsed
        effects: {loyalty: -10, safety: -20}
        competencies: {medical: -2, escalation: -1}
        debrief:
          why: >-
            Вы медлили, пока пассажир терял сознание. При боли в груди каждая минута повышает риск
            для жизни, а соседи начинают паниковать.
          better: >-
            Сразу сказать «Я рядом, сейчас приглашу начальника поезда и организуем помощь», вызвать
            по радиосвязи и остаться с пассажиром.
          refs: [sit_19, sto_011_10_4]
    options:
      - id: call_chief_stay
        text: >-
          Говорю «Я Вас понимаю, я рядом, сейчас приглашу начальника поезда», вызываю его по
          радиосвязи, остаюсь.
        role_step: acknowledge
        escalation_target: chief
        effects: {loyalty: 10, safety: 10}
        competencies: {medical: 2, escalation: 2, empathy: 1}
        set_flags: {chief_called: true, acknowledged: true}
        next: at_the_seat
        debrief:
          verdict: best
          why: >-
            Признание из ролевой модели и реплика карточки 19 в одной фразе. Пассажир слышит, что
            его поняли и что он не один, начальник поезда вызван любым доступным способом, а
            неотложная просьба выполняется в приоритетном порядке.
          refs: [sit_19, model_role_steps, sto_011_10_4]
      - id: run_for_chief
        text: Бегу к купе начальника поезда, пассажира оставляю с соседкой.
        escalation_target: chief
        effects: {loyalty: -10, safety: -5}
        competencies: {escalation: 1, medical: -1, empathy: -1}
        set_flags: {chief_called: true}
        delayed:
          - steps: 2
            effects: {loyalty: -10}
            text: >-
              Пассажир и соседка запомнили, что вы убегали: без спокойного разговора у кресла
              доверие не вернулось.
            unless_flags: {returned_to_passenger: true}
        next: at_the_seat
        debrief:
          verdict: ok
          why: >-
            Начальник поезда вызван, но вы отошли от пассажира, хотя в условиях сценария доступна
            радиосвязь. Карточка 19 требует вызвать начальника любым доступным способом и оказать
            помощь в рамках компетенции; здесь вызов по рации позволяет остаться рядом.
          better: Вызвать по радиосвязи, не покидая пассажира, и сказать ему «Я рядом».
          refs: [sit_19]
      - id: give_own_pills
        text: Достаю свой нитроглицерин и даю пассажиру.
        effects: {loyalty: 5, safety: -30}
        competencies: {medical: -3, rules: -2}
        next: pills_taken
        debrief:
          verdict: bad
          why: >-
            Личные лекарства выдавать нельзя. Реакция пассажира на препарат неизвестна,
            ответственность ляжет на проводника. Пассажиру кажется, что о нём заботятся, поэтому
            лояльность чуть выросла, а безопасность обрушилась.
          better: >-
            Сказать «Сожалею, но на борту отсутствуют медикаменты», извиниться и объяснить причину,
            вызвать начальника поезда и предложить воду.
          refs: [sit_28, sto_011_10_3]
      - id: finish_trolley_first
        text: Говорю соседке «Закончу с тележкой и подойду».
        effects: {loyalty: -10, safety: -15}
        competencies: {medical: -2, rules: -2, empathy: -1}
        next: at_the_seat
        debrief:
          verdict: bad
          why: >-
            Неотложные просьбы выполняются в приоритетном порядке. Тележка может подождать, сердце
            пассажира нет.
          better: Оставить тележку, подойти к пассажиру, вызвать начальника поезда по радиосвязи.
          refs: [sto_011_10_4, sit_19]

  collapsed:
    type: dialog
    text: >-
      Пассажир осел в кресле, глаза полузакрыты, на вопросы отвечает невнятно. Соседка кричит
      «Да сделайте же что-нибудь!», в вагоне встают с мест и снимают на телефоны.
    options:
      - id: check_and_radio_chief
        text: >-
          Проверяю, отвечает ли он и дышит ли, укладываю удобнее, вызываю начальника поезда с
          аптечкой по радиосвязи.
        escalation_target: chief
        effects: {safety: 10}
        competencies: {medical: 2, escalation: 2}
        set_flags: {chief_called: true}
        next: at_the_seat
        debrief:
          verdict: best
          why: >-
            Первая доврачебная помощь в рамках компетенции и вызов начальника поезда любым
            доступным способом, как требует карточка 19. Время уже потеряно, но дальше всё по
            правилам.
          refs: [sit_19, sit_28]
      - id: water_to_unconscious
        text: Прошу соседку подать воду и пытаюсь напоить пассажира, чтобы привести его в чувство.
        effects: {loyalty: -5, safety: -10}
        competencies: {medical: -2}
        next: at_the_seat
        debrief:
          verdict: bad
          why: >-
            Пассажир почти не отвечает, а вы занялись водой вместо проверки его состояния и
            вызова помощи. Карточка 19 предписывает вызвать начальника поезда и действовать в
            рамках компетенции. В этой учебной ветке попытка напоить пассажира не заменяет вызов
            помощи.
          better: >-
            Проверить, отвечает ли пассажир и дышит ли, вызвать начальника поезда по радиосвязи, не
            допускать паники.
          refs: [sit_19, sto_011_10_4]
      - id: ask_neighbors_help
        text: Прошу соседей присмотреть за ним, а сам бегу к купе начальника поезда.
        escalation_target: chief
        effects: {loyalty: -10, safety: -10}
        competencies: {escalation: -1, empathy: -1}
        set_flags: {chief_called: true}
        delayed:
          - steps: 2
            effects: {loyalty: -10}
            text: >-
              Соседи не знали, что делать с пассажиром, который едва отвечал, и запаниковали ещё
              сильнее.
            unless_flags: {returned_to_passenger: true}
        next: at_the_seat
        debrief:
          verdict: bad
          why: >-
            Начальника поезда вызывают любым доступным способом, а не бегом по составу. Пассажир,
            который едва отвечает, остаётся с людьми, которые не знают, что делать.
          better: >-
            Вызвать по радиосвязи, не отходя от пассажира, и попросить соседей только освободить
            место у кресла.
          refs: [sit_19]

  pills_taken:
    type: event
    text: >-
      Пассажир проглотил таблетку. Через минуту ему стало хуже: он побледнел ещё сильнее и жалуется
      на головокружение. Соседка зовёт вас громче.
    effects: {safety: -10}
    set_flags: {pills_given: true}
    next: at_the_seat

  at_the_seat:
    type: dialog
    text: >-
      Вы у кресла 7В. Пассажир в сознании, но бледен и дышит часто; соседка держит его за руку и
      спрашивает, что ещё можно сделать. До станции десять минут.
    passenger_says: Не уходите, пожалуйста. Может, таблетку какую-нибудь дадите?
    options:
      # признание сказано только в call_chief_stay, поэтому после таблетки, истечения и бега по
      # составу реплика карточки 28 скрыта, а вместо неё сухое правило без сочувствия
      - id: water_and_calm
        text: >-
          Говорю «Сожалею, но на борту отсутствуют медикаменты. Позвольте предложить для Вас воду»,
          спрашиваю, бывало ли так раньше и что он принимал.
        when: {flags_all: {acknowledged: true}}
        role_step: rule
        effects: {loyalty: 10}
        competencies: {rules: 2, empathy: 2, medical: 2}
        set_flags: {returned_to_passenger: true, history_asked: true}
        next: help_options
        debrief:
          verdict: best
          why: >-
            Реплика карточки 28 дословно, после того как пассажир услышал «Я Вас понимаю»: правило
            названо с извинением и альтернативой, как требует п. 10.3. Лекарств для выдачи
            пассажирам на борту нет, а аптечка начальника поезда это средства первой помощи, а не
            таблетки по просьбе, поэтому фраза честная. Если у пассажира есть свой назначенный
            препарат, мешать ему принять его вы не вправе, но давать чужой нельзя. Причина
            недомогания выяснена, эти сведения нужны медикам.
          refs: [sit_28, sto_011_10_3, model_role_steps]
      - id: rule_without_acknowledge
        text: >-
          Говорю «Сожалею, но на борту отсутствуют медикаменты. Позвольте предложить для Вас воду»
          и жду ответа.
        when: {flags_none: [acknowledged, pills_given]}
        role_step: rule
        effects: {loyalty: 3}
        competencies: {rules: 2}
        set_flags: {returned_to_passenger: true}
        next: help_options
        debrief:
          verdict: ok
          why: >-
            Правило названо верно, но пассажир не услышал, что его поняли: сухой отказ без
            сочувствия карточка 28 относит к тому, что роняет лояльность, а ролевая модель ставит
            признание перед правилом.
          better: >-
            Сначала «Я Вас понимаю, я рядом», потом правило и вода; и спросить, бывало ли так
            раньше и что он принимал.
          refs: [sit_28, model_role_steps]
      - id: ask_history_only
        text: Спрашиваю, бывало ли такое раньше и что он принимал; про лекарства и воду не говорю.
        effects: {safety: 10}
        competencies: {medical: 2}
        set_flags: {returned_to_passenger: true, history_asked: true}
        next: help_options
        debrief:
          verdict: ok
          why: >-
            Совет карточки 28, выяснить причину недомогания. Сведения о начале боли и о том, что
            пассажир принимал, нужны фельдшеру и медикам на станции; но пассажир так и не услышал,
            что будет дальше.
          better: >-
            Добавить реплику «Сожалею, но на борту отсутствуют медикаменты» с извинением и
            предложить воду.
          refs: [sit_28, sto_011_10_3]
      - id: radio_chief_if_not_yet
        text: Вызываю начальника поезда по радиосвязи, не отходя от пассажира.
        when: {flags_none: [chief_called]}
        escalation_target: chief
        effects: {safety: 10}
        competencies: {escalation: 2}
        set_flags: {chief_called: true}
        next: help_options
        debrief:
          verdict: ok
          why: >-
            Вызов сделан любым доступным способом, как требует карточка 19, но с опозданием.
            Минуты, пока вы решали сами, уже потеряны.
          better: Вызывать начальника поезда первым действием, до любых других попыток помочь.
          refs: [sit_19]
      - id: admit_pill_to_chief
        text: >-
          Говорю «Я рядом, помощь уже вызываю», по радиосвязи вызываю начальника поезда и сразу
          сообщаю, что дал пассажиру нитроглицерин.
        when: {flags_all: {pills_given: true}}
        escalation_target: chief
        effects: {loyalty: 5, safety: 10}
        competencies: {rules: 2, escalation: 2}
        set_flags: {chief_called: true}
        next: help_options
        debrief:
          verdict: best
          why: >-
            После ошибки единственно верный ход: сказать о препарате сразу, до прихода медиков, и
            не оставлять пассажира. Начальник поезда вызван, скрывать уже нечего.
          refs: [sit_28, sit_19]
      - id: ask_neighbors_for_pills
        text: Спрашиваю соседей, нет ли у кого-нибудь таблетки от сердца; сосед сзади протягивает свою.
        when: {flags_none: [pills_given]}
        effects: {loyalty: 5, safety: -30}
        competencies: {medical: -3, rules: -2}
        set_flags: {pills_given: true}
        next: help_options
        debrief:
          verdict: bad
          why: >-
            Привлекать пассажиров и коллег к выдаче лекарств так же опасно, как давать своё.
            Реакция неизвестна, ответственность на проводнике.
          better: >-
            Ответить «Сожалею, но на борту отсутствуют медикаменты», предложить воду и действовать
            через начальника поезда и медиков.
          refs: [sit_28]
      - id: leave_to_meet_chief
        text: Говорю «Сейчас вернусь» и ухожу в тамбур встречать начальника поезда.
        effects: {loyalty: -15, safety: -10}
        competencies: {empathy: -1, escalation: -1}
        next: help_options
        debrief:
          verdict: bad
          why: >-
            Пассажир просил не уходить, а встречать начальника поезда не нужно: он знает вагон и
            место. Пассажир снова один.
          better: Остаться рядом, предложить воду, держать связь по радиосвязи.
          refs: [sit_19]

  help_options:
    type: dialog
    text: До станции восемь минут, пассажиру не легче. Медиков на платформу надо заказать сейчас.
    passenger_says: Долго ещё? Мне правда плохо.
    timer:
      seconds: 30
      on_expire:
        next: station_no_medics
        effects: {loyalty: -10}
        competencies: {escalation: -2, medical: -1}
        debrief:
          why: >-
            Медиков на станцию заказывают заранее через начальника поезда. Вы тянули с заявкой,
            пока поезд подходил к станции, и на платформе никто не ждёт.
          better: Сразу запросить медработника по громкой связи и медиков на ближайшей станции.
          refs: [sit_28, sit_19]
    options:
      - id: pa_medic
        text: >-
          Говорю «Сейчас найдём врача», прошу начальника поезда объявить поиск медработника и
          заказать медиков на станцию.
        when: {flags_all: {chief_called: true}}
        role_step: solution
        escalation_target: pa_announcement
        effects: {loyalty: 5, safety: 5}
        competencies: {medical: 2, escalation: 2}
        next: medic_found
        debrief:
          verdict: best
          why: >-
            Карточки 19 и 28 прямо предлагают уточнить по громкой связи о медработниках среди
            пассажиров и вызвать медиков на ближайшей станции. Сделано и то, и другое, а пассажир
            услышал, какое решение принято.
          refs: [sit_19, sit_28, model_role_steps]
      - id: request_station_medics
        text: Прошу начальника поезда вызвать медиков на ближайшую станцию к нашему вагону.
        when: {flags_all: {chief_called: true}}
        escalation_target: medics_station
        effects: {safety: 10}
        competencies: {escalation: 2, medical: 1}
        next: station_prep
        debrief:
          verdict: ok
          why: >-
            Медики на станции заказаны заранее, это по карточке 28. Но восемь минут пассажир
            остаётся без помощи, хотя в вагоне мог быть врач.
          better: >-
            Сделать и то, и другое: объявление по громкой связи сейчас, медиков на станцию тем же
            вызовом.
          refs: [sit_28, sit_19]
      - id: prepare_wheelchair_exit
        text: >-
          Прошу начальника поезда подготовить кресло-коляску поезда, чтобы довезти пассажира к
          двери к медикам.
        when: {safety_max: 45}
        escalation_target: chief
        effects: {safety: 15}
        competencies: {escalation: 2, medical: 1}
        set_flags: {chief_called: true}
        next: station_prep
        debrief:
          verdict: ok
          why: >-
            Пассажир, которому трудно идти, к двери сам не дойдёт, а кресло-коляска поезда
            предусмотрена для временного пользования: после остановки, когда медики решат, его
            довезут к двери. Но врача среди пассажиров вы не искали.
          better: >-
            Тот же запрос вместе с поиском медработника по громкой связи, чтобы помощь началась до
            станции.
          refs: [sto_014_6_5, sit_28]
      - id: hide_pill
        text: Никому не говорю про таблетку, пусть считают, что стало хуже само.
        when: {flags_all: {pills_given: true}}
        effects: {safety: -25}
        competencies: {medical: -3, rules: -2}
        next: ending_incident_pills
        debrief:
          verdict: bad
          why: >-
            Медики будут лечить вслепую, а препарат всплывёт при осмотре. Скрытое нарушение
            превращается в инцидент с разбором.
          better: Сообщить начальнику поезда и медикам, какой препарат принял пассажир и когда.
          refs: [sit_28]
      - id: radio_chief_late
        text: Вызываю начальника поезда по радиосвязи и прошу заказать медиков на станцию.
        when: {flags_none: [chief_called]}
        escalation_target: chief
        effects: {safety: 10}
        competencies: {escalation: 1}
        set_flags: {chief_called: true}
        next: station_prep
        debrief:
          verdict: ok
          why: >-
            Канал вызова верный, но помощь начали организовывать только за восемь минут до
            станции. Медики на станцию запрошены, а поиск медработника среди пассажиров вы ещё не
            организовали. Карточка 19 предлагает и этот способ получить помощь.
          better: Вызывать начальника поезда первым действием, до любых других попыток помочь.
          refs: [sit_19]
      - id: just_wait
        text: Жду станцию и ничего больше не предпринимаю.
        effects: {loyalty: -5, safety: -10}
        competencies: {medical: -1, escalation: -1}
        next: ending_help_late
        debrief:
          verdict: bad
          why: >-
            Минуты до станции уходят впустую. Помощь можно было организовать раньше и без риска
            для себя.
          better: Запросить медработника по громкой связи и медиков на станцию через начальника поезда.
          refs: [sit_19, sto_011_10_4]

  station_no_medics:
    type: event
    text: >-
      Поезд подходит к станции. На платформе только дежурный: заявку на медиков никто не передал,
      скорую вызывают уже с перрона.
    effects: {safety: -15}
    next: ending_help_late

  medic_found:
    type: dialog
    text: >-
      К вам подошла женщина из соседнего вагона, она фельдшер. Она уже у кресла и спрашивает, что
      случилось и что пассажир принимал.
    timer:
      seconds: 30
      on_expire:
        next: medic_works_blind
        effects: {loyalty: -5}
        competencies: {medical: -1, escalation: -1}
        debrief:
          why: >-
            Фельдшер ждала сведений и начала помогать вслепую. Что видели вы и что принимал
            пассажир, знали только вы.
          better: >-
            Коротко доложить за первые секунды: что видели, что принимал пассажир, сколько минут до
            станции.
          refs: [sit_19, sit_28]
    options:
      - id: brief_medic_full
        text: >-
          Передаю фельдшеру то, что узнал у пассажира: когда началась боль, бывало ли раньше, что
          принимал; до станции семь минут.
        when: {flags_all: {history_asked: true}, flags_none: [pills_given]}
        effects: {safety: 10}
        competencies: {medical: 2, escalation: 1}
        next: station_prep
        debrief:
          verdict: best
          why: >-
            Помощь в рамках компетенции проводника это точные сведения тому, кто умеет лечить. Вы
            спросили пассажира заранее, и фельдшер не теряет минуты на расспросы.
          refs: [sit_19, sit_28]
      - id: brief_medic
        text: >-
          Коротко докладываю, что видел сам: бледность, частое дыхание, держится за грудь; до
          станции семь минут.
        when: {flags_none: [pills_given]}
        effects: {safety: 5}
        competencies: {medical: 1, escalation: 1}
        next: station_prep
        debrief:
          verdict: ok
          why: >-
            Фельдшер получила то, что видно со стороны, но не то, что знает пассажир. Причину
            недомогания и что он принимал вы не спросили.
          better: >-
            Ещё у кресла спросить пассажира, бывало ли так раньше и что он принимал, и передать это
            фельдшеру.
          refs: [sit_28, sit_19]
      - id: tell_about_pill
        text: Сообщаю фельдшеру, что пассажир принял таблетку не от медиков, называю какую и когда.
        when: {flags_all: {pills_given: true}}
        effects: {loyalty: -5, safety: 10}
        competencies: {rules: 2, medical: 1}
        next: station_prep
        debrief:
          verdict: best
          why: >-
            После ошибки это единственно верный ход. Фельдшер учитывает препарат, риск для пассажира
            снижается, хотя доверие соседей к проводнику падает.
          better: >-
            Не выдавать и не просить лекарств вовсе. Если это случилось, сказать медикам сразу и
            без утайки.
          refs: [sit_28]
      - id: keep_pill_secret
        text: Отвечаю фельдшеру только про симптомы, о таблетке молчу.
        when: {flags_all: {pills_given: true}}
        effects: {safety: -25}
        competencies: {medical: -3, rules: -2}
        next: ending_incident_pills
        debrief:
          verdict: bad
          why: >-
            Фельдшер спросила прямо, что принимал пассажир, и получила неполный ответ. Лечение
            вслепую и скрытое нарушение это инцидент.
          better: Назвать препарат и время сразу, как только фельдшер спросила.
          refs: [sit_28]
      - id: let_medic_handle_and_go
        text: Оставляю пассажира на фельдшера и ухожу к другим пассажирам, полвагона ждёт чай.
        effects: {loyalty: -5, safety: -10}
        competencies: {empathy: -1, escalation: -1}
        delayed:
          - steps: 2
            effects: {loyalty: -10}
            text: >-
              Фельдшер искала вас, чтобы уточнить о лекарствах пассажира, а он спрашивал, куда
              делся проводник.
        next: station_prep
        debrief:
          verdict: bad
          why: >-
            Проводник остаётся ответственным за пассажира и связь с бригадой. Фельдшеру нужны
            сведения и помощник, пассажиру знакомое лицо.
          better: Остаться рядом, отвечать на вопросы фельдшера, держать связь с начальником поезда.
          refs: [sit_19, sto_011_10_4]

  medic_works_blind:
    type: event
    text: >-
      Фельдшер начала помогать без ваших сведений. Она не знает, сколько длится боль и что пассажир
      принимал, и переспрашивает соседей.
    effects: {safety: -5}
    next: station_prep

  station_prep:
    type: dialog
    text: >-
      До станции три минуты. Начальник поезда подтвердил, что скорая будет у вагона. Пассажир в
      сознании, соседи притихли и смотрят на вас.
    passenger_says: Спасибо, что не ушли. Меня встретят?
    options:
      - id: announce_calm
        text: >-
          Говорю пассажиру и соседям «Благодарю за помощь и спокойствие, на станции нас встретит
          скорая» и готовлю проход к двери.
        role_step: assure
        effects: {loyalty: 5, safety: 5}
        competencies: {empathy: 2, escalation: 1}
        next: ending_station_medics
        debrief:
          verdict: best
          why: >-
            Заверение по ролевой модели: пассажир и соседи знают, что будет дальше, проход к двери
            свободен для медиков.
          refs: [sit_19, model_role_steps]
      - id: ask_neighbor_meet_medics
        text: Прошу соседку встретить медиков у двери и показать место, сам остаюсь у кресла.
        effects: {safety: 5}
        competencies: {escalation: 1}
        next: ending_station_medics
        debrief:
          verdict: ok
          why: >-
            Встречу поручили, проводник остался рядом. Но пассажир и соседи так и не услышали от
            вас, что будет дальше, и тревога в вагоне не ушла.
          better: >-
            Сказать «На станции нас встретит скорая», поблагодарить за спокойствие и подготовить
            проход к двери.
          refs: [sit_19, model_role_steps]
      - id: move_to_vestibule_early
        text: Прошу соседей помочь довести пассажира в тамбур заранее, чтобы не задерживать поезд.
        effects: {loyalty: 5, safety: -15}
        competencies: {medical: -2}
        next: ending_station_medics
        debrief:
          verdict: bad
          why: >-
            Вы ведёте пассажира к двери ради соблюдения расписания, хотя в этой ситуации помощь
            организована у его кресла. Карточка 19 требует оказать помощь в рамках компетенции.
            В учебной модели самостоятельное перемещение до передачи медикам снижает
            безопасность, даже если соседи воспринимают его как заботу.
          better: Оставить пассажира в кресле, освободить проход и ждать медиков у кресла.
          refs: [sit_19]
      - id: loud_panic
        text: Громко прошу всех освободить проход, потому что человеку совсем плохо. Соседи вскакивают.
        effects: {loyalty: -15, safety: -20}
        competencies: {empathy: -2, medical: -1}
        next: ending_station_medics
        debrief:
          verdict: bad
          why: >-
            Паника в вагоне пугает пассажира и мешает медикам. Карточка 19 прямо требует не
            допускать паники и действовать спокойно.
          better: >-
            Спокойно попросить соседей освободить место у кресла и проход, заверить, что помощь уже
            на станции.
          refs: [sit_19]

  ending_station_medics:
    type: ending
    title: Скорая у вагона
    text: >-
      На станции пассажира встретила бригада скорой, его увезли в сознании. Начальник поезда
      фиксирует случай в журнале, поезд отправляется дальше.
    debrief:
      summary: >-
        Пассажира передали медикам. Исход зависит от того, как быстро вы вызвали начальника поезда,
        чем занимали минуты до станции, остались ли рядом и не давали ли лекарств.
      refs: [sit_19, sit_28, sto_011_10_4]

  ending_help_late:
    type: ending
    title: Помощь пришла поздно
    text: >-
      Скорую вызвали уже с перрона, пассажира выносили на носилках при всём вагоне. Соседи
      спрашивают начальника поезда, почему помощь не ждала на платформе.
    debrief:
      summary: >-
        Помощь пришла, но минуты в пути прошли впустую. Сюда ведут ветки, где не вызван начальник
        поезда, не запрошены медики или проводник ждал станцию молча.
      refs: [sit_19, sit_28, sto_011_10_4]

  ending_incident_pills:
    type: ending
    title: Разбор у начальника поезда
    text: >-
      На станции медики выяснили, что пассажир принимал нитроглицерин, а бригада об этом не
      сказала. Начальнику поезда предстоит разбор случая с вами, соседи видели, откуда взялась
      таблетка.
    forced_outcome: incident
    debrief:
      summary: >-
        Лекарство не от медиков и умолчание о нём это инцидент независимо от того, чем всё
        закончилось для пассажира. Правило карточки 28 без исключений.
      refs: [sit_28, sto_011_10_3]
